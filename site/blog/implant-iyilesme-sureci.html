      "html": "<p>Operasyondan çıktığınızda uyuşukluk birkaç saat daha sürer; bu süre dolmadan yanağınızı ya da dudağınızı fark etmeden ısırmamak için yemeği erteleyin. Uyuşukluk geçtikçe hafif bir sızı hissedilebilir — hekiminizin önerdiği ağrı kesici, bu dönemi çoğu olguda rahat atlatmanızı sağlar.<\/p><p>İlk günün asıl kahramanı, implant bölgesinde oluşan pıhtıdır. İyileşmenin temelini bu pıhtı attığı için tükürmekten, pipetle içmekten ve ağzı hızla çalkalamaktan uzak durun. Dışarıdan aralıklarla uygulanan soğuk kompres şişliği sınırlar; sıcak içecekler ise kanamayı tetikleyebileceğinden ilk gün masada yer almamalı.<\/p><p>Gün boyunca dinlenin, yatarken başınızı hafif yüksekte tutun ve ağır egzersizden kaçının. Hafif sızıntı şeklinde kanama ilk saatlerde normaldir; steril gazlı beze nazikçe ısırarak kontrol altına alabilirsiniz.<\/p>"
