      "h2": "Yaş ilerledikçe ağızda neler değişir?",
      "html": "<p>Altmışlı yaşlar, ağız için sessiz bir dönüşüm dönemidir. Tükürük üretimi pek çok kişide azalır; buna sıklıkla düzenli kullanılan bazı ilaçların yan etkileri de eklenir. Tükürük azaldığında ağız kendini eskisi kadar iyi yıkayamaz: çürük riski artar, protez kullananlarda tutuculuk zorlaşır, gün boyu süren yapışkan bir kuruluk hissi belirir.<\/p><p>İkinci belirgin değişiklik diş etlerinde yaşanır. Diş eti çekilmesi yıllar içinde kök yüzeylerini açığa çıkarır; kök yüzeyi minenin korumasından yoksun olduğu için burada başlayan çürükler daha hızlı ilerleyebilir. Fırçalama sırasında kanama fark ediyorsanız bunu yaşlılığın olağan bir parçası saymayın; <a href=\"/hizmet/dis-etim-kaniyor/\">diş eti kanaması<\/a> her yaşta değerlendirilmesi gereken bir uyarı işaretidir.<\/p><p>Mine aşınması, renk koyulaşması ve eski dolguların yorulması da tabloya eklenir. İyi haber şu ki bu değişikliklerin büyük bölümü, düzenli kontrol ve doğru bakım alışkanlıklarıyla yönetilebilir.<\/p>"
