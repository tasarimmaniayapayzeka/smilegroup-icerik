  "lead": "Une seule dent manquante peut, avec le temps, perturber l'équilibre masticatoire et l'harmonie du sourire. Cette page explique le périmètre de l'implant unitaire, ses étapes, les risques possibles et les soins de suite. Cliquez sur la rubrique qui vous intéresse pour l'ouvrir.",

    },
    {
