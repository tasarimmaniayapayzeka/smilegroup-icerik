  "lead": "Le smile design est une approche globale : les dents, les gencives, les lèvres et les proportions du visage sont planifiées ensemble, plutôt que traitées isolément. Cette page vous guide à travers le flux de planification numérique (DSD), l'étape d'essai avec mock-up et les traitements généralement associés. Ouvrez la rubrique qui vous intéresse pour y accéder directement.",

      "q": "Qu'est-ce que le smile design ?",

    {

    {

    },
