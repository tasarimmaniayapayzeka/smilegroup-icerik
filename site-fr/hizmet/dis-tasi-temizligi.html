window.ARTICLE = {

  "breadcrumb": [

  ],
  "lead": "Le détartrage — souvent appelé détartrage-polissage — est un acte clinique qui débarrasse la surface des dents des dépôts de plaque durcis. Il relève à la fois de l'esthétique et de la santé bucco-dentaire générale, car il joue autant sur l'apparence de votre sourire que sur la santé de votre tissu gingival. Les sections ci-dessous couvrent les étapes de l'acte, la sensibilité qui peut suivre et les inquiétudes que les patients évoquent le plus.",
  "faqs": [
    {
      "q": "Qu'est-ce que le détartrage ?",
      "a": "La plaque bactérienne molle qui s'accumule sur la dent durcit en quelques jours au contact des minéraux de la salive, devenant une couche jaunâtre que le brossage seul ne retire plus. Votre praticien élimine cette couche de façon contrôlée, au-dessus de la gencive et, au besoin, à l'intérieur de la poche gingivale. Le but ne se limite pas à l'apparence — la surface rugueuse du tartre facilite l'ancrage des bactéries et prépare l'inflammation gingivale. Voilà pourquoi cet acte revient souvent comme première étape quand une patiente signale des <a href=\"/fr/hizmet/dis-etim-kaniyor/\">gencives qui saignent<\/a>."
    },
    {
      "q": "Pourquoi le tartre se forme-t-il, et qu'est-ce qui accélère l'accumulation ?",
      "a": "Calcium et phosphate de la salive cristallisent rapidement la plaque laissée en place — toute zone de plaque non nettoyée est candidate au tartre. La face interne des incisives inférieures et la face côté joue des molaires supérieures s'encrassent plus vite, car elles jouxtent les canaux des glandes salivaires. Tabac, thé et café augmentent l'accumulation comme les colorations. Bouche sèche, dents chevauchées et impasse sur le nettoyage interdentaire sont d'autres facteurs contributifs courants. Les <a href=\"/fr/hizmet/dislerimde-lekeler-var/\">taches sur la surface dentaire<\/a> accompagnent souvent cette accumulation."
    },
    {
      "q": "Quelles sont les étapes du nettoyage à l'appareil à ultrasons ?",
      "a": "Votre praticien examine d'abord gencives, profondeur des poches et quantité de tartre, imageant au besoin par radiographie les dépôts sous la gencive. La pointe de l'appareil à ultrasons entre ensuite en contact avec le tartre en vibration haute fréquence, fissurant la couche durcie et la décollant de la surface. Un flux d'eau simultané évite l'échauffement et évacue les fragments détachés. Le praticien finit les dépôts fins des espaces interdentaires serrés et des surfaces radiculaires aux instruments manuels appelés <em>curettes<\/em>. Les dépôts qui descendent profondément dans la poche peuvent dépasser le cadre du détartrage de routine ; ce tableau relève d'un traitement gingival plus étendu, planifié à part. En dernière étape : polissage à la brossette et à la pâte spéciale — le polissage réduit la rugosité de surface, rendant l'ancrage d'une nouvelle plaque plus difficile. Un gel fluoré s'ajoute au besoin. L'anesthésie locale n'est pas nécessaire dans la plupart des cas."
    },
    {
      "q": "À qui se recommande-t-il, et quels symptômes appellent un rendez-vous ?",
      "a": "Les personnes dont les gencives saignent, rougissent ou se sont rétractées au brossage en bénéficient en premier lieu. Qui remarque une bande jaune-brun durcie au collet, qui décrit une <a href=\"/fr/hizmet/agiz-kokusu/\">mauvaise haleine<\/a> persistante, et les patients se préparant à un traitement orthodontique sont des groupes fréquents. Diabète, grossesse et tabac rendent le suivi régulier plus important encore. L'accumulation peut aussi se repérer à un contrôle de routine chez des personnes sans aucune plainte."
    },
    {
      "q": "Combien de temps cela prend-il, et combien de rendez-vous ?",
      "a": "Terminé en une séance, l'acte prend en général vingt à quarante minutes. Si l'accumulation est lourde ou les poches profondes, le praticien divise la bouche en secteurs et répartit le traitement sur deux rendez-vous ou plus. Le nettoyage sous la gencive demande un temps propre pour chaque zone. Le facteur principal de durée : le temps écoulé depuis votre dernier nettoyage."
    },
    {
      "q": "Ressent-on une douleur pendant l'acte ?",
      "a": "La plupart des personnes aux gencives saines décrivent l'acte comme une sensation de vibration et d'eau, sans vraie douleur. Si vos gencives sont enflammées ou vos surfaces radiculaires exposées, un picotement peut se sentir aux points de contact. Dans ces cas, le praticien baisse la puissance de la pointe, travaille par plus petits secteurs ou propose une anesthésie locale. En cas d'inconfort, lever la main pour demander une pause facilite les choses. Si vous vous savez déjà sensible, mentionnez-le en début de rendez-vous."
    },
    {
      "q": "Quels sont les risques et complications possibles ?",
      "a": "L'effet secondaire le plus courant : une sensibilité au chaud-froid de quelques jours après l'acte ; elle se calme seule dans la plupart des cas. Signalez une sensibilité qui dépasse trois jours ou s'aggrave. Des gencives enflammées peuvent saigner pendant l'acte et un moment après. Dans les zones longtemps couvertes de tartre, la gencive peut légèrement se rétracter et une sensation d'espace nouveau apparaître entre les dents ; cette récession ne se corrige pas toujours complètement. Nous expliquons cette sensation d'espace dans une question à part ci-dessous. Utilisée avec trop de pression ou sous le mauvais angle, la pointe à ultrasons peut rayer émail et surface radiculaire — d'où la surveillance continue de la puissance et de l'angle de contact par votre praticien. Chez les personnes aux <a href=\"/fr/hizmet/dislerim-asindi/\">surfaces dentaires usées<\/a>, la zone radiculaire est plus sensible et se travaille à puissance réduite. Rarement, un plombage ou une couronne dont la limite tenait déjà mal peut se détacher pendant l'acte."
    },
    {
      "q": "Quand n'est-il pas réalisé, ou reporté ?",
      "a": "En infection aiguë — un abcès gingival douloureux par exemple — le praticien contrôle d'abord l'infection et remet le nettoyage à plus tard. Diabète non contrôlé, trouble de la coagulation ou anticoagulants : l'avis du médecin concerné précède l'acte. Chez les patients porteurs d'une valve cardiaque prothétique ou de certaines cardiopathies congénitales, une antibioprophylaxie peut s'envisager. Chez les porteurs de stimulateur cardiaque, le praticien peut préférer les instruments manuels à l'appareil à ultrasons. La planification diffère pour les patients récemment traités par radiothérapie de la tête et du cou. Le détartrage reste en général possible pendant la grossesse ; votre praticien en évalue le moment avec votre suivi prénatal."
    },
    {
      "q": "Le détartrage amincit-il les dents ou abîme-t-il l'émail ?",
      "a": "Les patients soulèvent souvent cette inquiétude en rendez-vous. La pointe à ultrasons n'est pas conçue pour entamer l'émail — elle fissure la couche dure du tartre par vibration ; à la bonne puissance et au bon angle, sa cible est le tartre, pas la dent. Si vos dents paraissent plus fines ou plus petites après l'acte, c'est en général qu'une épaisse couche de dépôt a été retirée. Le nettoyage peut réduire les colorations de surface, mais changer la teinte propre de la dent est un traitement à part, couvert par le <a href=\"/fr/hizmet/dis-beyazlatma/\">blanchiment dentaire<\/a>."
    },
    {
      "q": "Pourquoi est-ce que je sens un espace entre mes dents après un nettoyage ?",
      "a": "La sensation d'espace après un nettoyage est une plainte courante, et dans la plupart des cas directement liée au tartre retiré. Autrement dit, l'espace n'a pas été créé — il a simplement été découvert. Deuxième raison : des gencives gonflées par l'inflammation reprennent leur vraie position une fois nettoyées. La cicatrisation avançant, la gencive se raffermit, le saignement diminue et la sensation d'espace se tasse en général en quelques semaines. Si la récession ne se corrige pas et que l'apparence vous gêne, vous pouvez explorer l'<a href=\"/fr/hizmet/dis-eti-estetigi/\">esthétique gingivale<\/a> ou les <a href=\"/fr/hizmet/dislerim-ayrik/\">écarts entre les dents<\/a>."
    },
    {
      "q": "À quoi faire attention après l'acte ?",
      "a": "Éviter les boissons très chaudes et très froides le premier jour réduit la sensibilité. Les boissons foncées et le tabac colorent plus facilement la surface fraîchement polie et lissée dans les premières heures — mieux vaut les repousser un moment. Tant que vos gencives sont sensibles, brosse souple et gestes circulaires doux plutôt que pression. Ajouter brossette interdentaire ou fil à la routine quotidienne ralentit la formation des nouveaux dépôts. Votre praticien peut recommander quelques jours de bain de bouche antiseptique s'il le juge utile."
    },
    {
      "q": "À quelle fréquence le répéter, et qu'est-ce qui détermine cette fréquence ?",
      "a": "Pour la plupart des adultes, un contrôle tous les six mois passe pour un intervalle raisonnable. Chez les fumeurs, les personnes aux antécédents de maladie gingivale, les porteurs de bagues orthodontiques et celles dont la salive forme vite le tartre, l'intervalle peut descendre à trois ou quatre mois. Chez qui entretient bien sa bouche et s'encrasse lentement, un contrôle annuel peut suffire. Le vrai facteur qui fixe l'intervalle : la vitesse d'accumulation constatée à votre dernier nettoyage."
    }
  ],
  "closing": "La santé gingivale est le socle de l'apparence de votre sourire comme de votre confort buccal à long terme. Si vous avez remarqué saignement, changement de couleur ou bande durcie au collet, nous pouvons l'évaluer ensemble à un examen. Pour rendez-vous et questions, vous pouvez nous joindre via notre <a href=\"/fr/contact/\">page de contact<\/a>.",
