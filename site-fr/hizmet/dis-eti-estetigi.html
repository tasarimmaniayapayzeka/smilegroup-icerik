  "lead": "Un sourire ne tient pas qu'aux dents — la ligne du bord gingival, sa hauteur et sa symétrie d'un côté à l'autre dessinent le cadre visible qui les entoure. L'esthétique gingivale est le terme générique des traitements qui visent l'excès de gencive visible au sourire, un niveau inégal d'un côté, ou des dents qui paraissent longues par récession. Sur cette page : la logique du traitement, ses étapes, ses limites et la récupération.",

    {
