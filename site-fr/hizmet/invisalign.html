window.ARTICLE = {

  "breadcrumb": [

  "lead": "Invisalign est un système orthodontique où le mouvement dentaire se planifie par ordinateur et se réalise avec une série de gouttières transparentes portées l'une après l'autre. Le principe de base est simple : chaque gouttière rapproche une dent d'un petit pas de sa position cible. Avant tout, le résultat dépend du nombre d'heures quotidiennes où le patient les porte réellement.",
  "faqs": [
    {
      "q": "Qu'est-ce qu'Invisalign, et comment le système fonctionne-t-il vraiment ?",
      "a": "C'est le processus derrière le nom qui compte : scan intra-oral, planification en trois dimensions et série de gouttières fabriquées en conséquence. L'orthodontiste scanne la position de départ de vos dents, trace numériquement la position cible et découpe la distance entre les deux en dizaines de petites étapes intermédiaires. Le centre de fabrication produit ensuite une gouttière thermoplastique distincte pour chaque étape. En parcourant les gouttières dans l'ordre, vos dents avancent graduellement vers la position planifiée. Vous trouverez les principes généraux de l'approche par aligneurs sur notre page <a href=\"/fr/hizmet/seffaf-plakla-ortodonti/\">orthodontie par aligneurs transparents<\/a>."
    },
    {
      "q": "Comment les gouttières déplacent-elles réellement une dent ?",
      "a": "Chaque gouttière se fabrique avec une géométrie légèrement différente de la position actuelle de la dent ; une fois en place, ce petit décalage transmet une force douce et continue à la dent et à l'os autour. Le tissu osseux répond à cette force en se résorbant d'un côté et en se reconstruisant de l'autre — un remodelage progressif. Le mouvement par gouttière reste de l'ordre du dixième de millimètre, l'orthodontiste visant à garder la force dans ce que la dent tolère sans risque. Voilà pourquoi le nombre de gouttières d'un cas peut se compter en dizaines, selon sa complexité."
    },
    {
      "q": "Que se passe-t-il pendant la planification numérique du traitement ?",
      "a": "Le praticien prend d'abord un scan numérique tridimensionnel de vos mâchoires au scanner intra-oral, puis ajoute radiographies et photos au dossier. L'orthodontiste évalue avec ces données l'alignement de vos dents, votre engrènement et l'espace nécessaire. Le logiciel de planification simule ensuite les mouvements étape par étape. Au besoin, l'orthodontiste intègre au plan expansion d'arcade, légère réduction interproximale ou extraction. Le plan approuvé part au centre de fabrication, où les techniciens produisent la série de gouttières correspondante. La simulation est une image cible, pas une garantie — la réponse biologique en bouche ne progressant pas au même rythme chez tous, le plan peut se mettre à jour aux contrôles."
    },
    {
      "q": "Qu'est-ce qu'un taquet, et pourquoi le coller sur la dent ?",
      "a": "Le taquet — l'attachment — est une petite bosse de composite collée sur l'émail pour aider la gouttière à mieux saisir la dent ; le praticien les pose en une visite avec un guide, et les retire de la même façon en fin de traitement. Pour les mouvements plus exigeants — rotation, extrusion verticale, mouvement radiculaire — les taquets sont en général indispensables. Ils s'accordent finement à la teinte de votre dent, mais peuvent rester perceptibles de près et se colorer au fil du temps avec les boissons foncées. Si un taquet se décolle, la gouttière peut ne plus s'ajuster correctement — prévenir la clinique tout de suite évite les retards."
    },
    {
      "q": "Pour qui Invisalign est-il une option adaptée ?",
      "a": "Chevauchement léger à modéré, écarts entre les dents et légère récidive après un ancien traitement orthodontique sont les situations où ce système s'utilise le plus. Les adultes qui préfèrent éviter le look des brackets métalliques, et les professionnels souvent en présentation ou en réunion, penchent souvent vers l'option gouttières. Des versions adaptées aux enfants et adolescents existent aussi, mais direction de croissance et état des dents de lait demandent une évaluation à part dans ces âges. Pour mettre un nom sur ce qui vous gêne, nos pages <a href=\"/fr/hizmet/dislerim-yamuk/\">dents de travers<\/a> et <a href=\"/fr/hizmet/dislerim-ayrik/\">dents écartées<\/a> peuvent vous orienter."
    },
    {
      "q": "Dans quels cas peut-il ne pas suffire seul ?",
      "a": "Les aligneurs déplacent les dents. Ils ne font pas grandir la mâchoire et ne changent pas la position de l'os lui-même. Dans les problèmes d'occlusion squelettiques avancés et les décalages marqués des mâchoires, le système peut ne pas atteindre la cible seul. L'orthodontie se planifie alors avec la chirurgie maxillaire. Déplacer des racines en parallèle sur une longue distance, ramener une dent incluse sur l'arcade et corriger des prémolaires très tournées comptent aussi parmi les mouvements difficiles pour les aligneurs. Dans certains cas, le praticien ajoute au traitement des brackets temporaires ou un appui sur mini-vis. Nous couvrons le versant chirurgical des relations de mâchoires sur notre page <a href=\"/fr/hizmet/ortognatik-cerrahi/\">chirurgie orthognathique<\/a>."
    },
    {
      "q": "Quand le traitement n'est-il pas mené, ou reporté ?",
      "a": "En cas de carie active, d'inflammation gingivale non traitée ou de tartre abondant, le praticien ne démarre pas l'orthodontie tout de suite. Ces sujets se règlent d'abord ; alors seulement vient l'étape du scan. Dans la maladie parodontale à perte osseuse avancée, l'orthodontiste reconsidère tout le plan — déplacer les dents pourrait aggraver la perte de soutien. Pour les patients qui annoncent d'emblée ne pas pouvoir tenir les heures de port, un système fixe peut être l'option plus réaliste. Maladies générales non contrôlées, certains médicaments du métabolisme osseux et grincement nocturne sévère peuvent aussi retarder le départ. Le <a href=\"/fr/hizmet/dis-tasi-temizligi/\">détartrage<\/a> est la première étape de la plupart des plans."
    },
    {
      "q": "Combien d'heures par jour porter les gouttières ?",
      "a": "Les gouttières doivent rester en bouche environ <strong>20 à 22 heures par jour<\/strong> — toute heure hors repas et brossage compte. Écourter ce temps dérègle l'ajustement dent-gouttière, et la suivante de la série ne se placera plus correctement. Les semaines de port relâché étirent le calendrier global, et imposent parfois une série supplémentaire. Les jours de port réduit, remettre la gouttière devient nettement plus difficile, et la pression des premières heures plus intense. Ranger la gouttière directement dans sa boîte à chaque retrait — plutôt que dans une serviette — réduit le nombre de gouttières perdues."
    },
    {
      "q": "À quelle fréquence changer de gouttière, et comment se passent les contrôles ?",
      "a": "Dans la plupart des plans, chaque gouttière se porte entre sept et quatorze jours. Vous passez vous-même à la suivante, chez vous, et venez en clinique toutes les six à dix semaines en général. À ces rendez-vous, le praticien vérifie que les taquets tiennent et que vos gencives vont bien. Les nouvelles séries se remettent au besoin, et les bords vifs se lissent. Passer à une nouvelle gouttière le soir facilite le sommeil malgré la pression initiale. Venir au contrôle gouttières en bouche laisse le praticien évaluer l'ajustement immédiatement."
    },
    {
      "q": "Combien de temps dure un traitement Invisalign ?",
      "a": "La durée dépend du nombre de dents à déplacer et du type de mouvement. Les corrections limitées se bouclent en quelques mois ; les cas exigeant une correction d'occlusion sur toute l'arcade peuvent dépasser l'année. Plus de taquets et plus de dents à mouvement radiculaire augmentent le nombre de gouttières — et le calendrier avec. Quand arcades supérieure et inférieure progressent à des vitesses différentes, la date de fin peut reculer. Le plan numérique produit après votre scan annonce le calendrier attendu et le nombre de gouttières."
    },
    {
      "q": "Quels sont les risques et inconvénients ?",
      "a": "Les premiers jours d'une nouvelle gouttière : pression, gêne légère et changements passagers de l'élocution sont courants. Les bords peuvent irriter langue et muqueuse des joues ; le praticien peut les lisser au besoin. La plaque s'accumule plus facilement autour des taquets — sans nettoyage suivi, le risque de taches blanches sur l'émail et de carie monte. Un raccourcissement des apex est possible avec toute orthodontie ; l'impact clinique reste limité dans la plupart des cas, mais le raccourcissement survenu est définitif — d'où la limitation des mouvements chez les patients jugés plus à risque. Récession gingivale, béance inattendue ou mouvement planifié partiellement atteint peuvent aussi survenir. Pouvoir retirer la gouttière ressemble à un avantage — chez qui peine avec la discipline exigée, cela devient un sérieux inconvénient. Remplacer les gouttières perdues ou cassées coûte aussi du temps. Dans cette situation, la plupart des plans prévoient de revenir à la gouttière précédente et de prévenir la clinique le jour même. Chez les patients au grincement sévère, les gouttières s'usent vite — nous le détaillons sur notre page <a href=\"/fr/hizmet/dislerimi-sikiyorum/\">serrement des dents<\/a>."
    },
    {
      "q": "Que retenir pour l'hygiène des gouttières ?",
      "a": "La règle de base : rincer les gouttières à l'eau tiède à chaque retrait et les nettoyer doucement à la brosse souple ; pas de dentifrice — ses abrasifs rayent la surface. Loin de l'eau chaude : le thermoplastique se déforme à la chaleur, et les bains de bouche colorés peuvent laisser la surface trouble. Avec le temps, un film blanchâtre de salive et de minéraux se dépose à l'intérieur ; des pastilles nettoyantes approuvées par le fabricant, quelques fois par semaine, réduisent ce dépôt et l'odeur qui l'accompagne. Laver régulièrement la boîte à l'eau savonneuse évite le film humide à l'intérieur."
    },
    {
      "q": "Que se passe-t-il si une gouttière ne se place pas correctement ?",
      "a": "Rester dans les rails signifie que le mouvement en bouche suit le rythme du plan. Signes de décrochage : les logements des taquets ne se remplissent plus complètement, la gouttière se soulève sur les molaires du fond, ou elle ne s'assoit plus sans que vous l'y pressiez. Pour les petits écarts, le praticien prolonge le port de la gouttière en cours et fait travailler un chewie pour l'asseoir. Si l'écart grandit, un nouveau scan se prend et une série additionnelle se planifie pour les mouvements restants. L'habitude qui fait le plus dérailler le suivi : manger gouttières en bouche — retirez-les pour tout sauf l'eau. Boire thé, café ou cola avec les gouttières colore la surface et piège le sucre contre la dent. Sans brossage possible après le repas, un rinçage soigneux de la bouche avant de remettre la gouttière est la meilleure solution de repli."
    },
    {
      "q": "Pourquoi une contention après le traitement ?",
      "a": "Une fois les dents dans leur nouvelle position, elles tendent à dériver en arrière tant que ligaments et os ne se sont pas complètement adaptés. Voilà pourquoi l'orthodontiste recommande dès la fin du traitement une gouttière de contention, ou un fin fil collé derrière les dents. Au début, la contention se porte toute la journée ; les mois suivants, elle passe en général aux nuits seules. Les patients qui l'abandonnent peuvent voir un léger chevauchement revenir au fil des ans. L'approche classique par appareils fixes figure sur notre page <a href=\"/fr/hizmet/dis-teli/\">bagues<\/a>, et si le confort de votre sourire vous questionne, notre page <a href=\"/fr/hizmet/gulerken-rahat-hissetmiyorum/\">je ne me sens pas à l'aise en souriant<\/a> peut aider."
    }
  ],
  "closing": "Dans les bons cas, Invisalign est l'un des systèmes qui permettent d'atteindre vos objectifs orthodontiques en gouttières transparentes — mais autant que la justesse du plan, le résultat dépend de la constance de votre port au quotidien. Pour faire évaluer vos dents et passer en revue les options qui vous conviendraient, contactez-nous via notre <a href=\"/fr/contact/\">page de contact<\/a>.",
  "editor": {
