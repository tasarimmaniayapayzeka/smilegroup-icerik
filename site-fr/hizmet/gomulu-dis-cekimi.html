  "lead": "Certaines dents restent piégées dans l'os ou la gencive et n'atteignent jamais la bouche. L'extraction de dent incluse couvre le retrait de ces dents par une petite intervention chirurgicale — elle ne concerne pas que les dents de sagesse, mais aussi les canines supérieures, les prémolaires et les dents surnuméraires. Cette page couvre la planification, le déroulé chirurgical, les risques et la période de cicatrisation.",
  "faqs": [
    {
      "q": "Qu'est-ce que l'extraction de dent incluse, et quelles dents concerne-t-elle ?",
      "a": "Une dent censée apparaître en bouche peut ne pas terminer son éruption à cause d'un blocage osseux ou muqueux. Retirer une telle dent — en soulevant la gencive et, au besoin, en amincissant l'os autour — voilà l'extraction de dent incluse. Là où l'<a href=\"/fr/hizmet/dis-cekimi/\">extraction dentaire<\/a> classique traite une dent visible en bouche, cet acte demande une approche chirurgicale. On la voit surtout avec les dents de sagesse, mais canines supérieures, prémolaires inférieures et dents surnuméraires peuvent aussi rester incluses."
    },
    {
      "q": "Pourquoi une dent reste-t-elle incluse ?",
      "a": "Le décalage entre taille de la mâchoire et taille des dents est la cause la plus courante — quand l'espace sur le chemin d'éruption rétrécit, la dent se retrouve piégée dans l'os. Une racine voisine barrant le passage, un kyste ou une dent surnuméraire peuvent aussi stopper l'éruption. Les facteurs héréditaires pèsent particulièrement sur les canines supérieures incluses, souvent inclinées vers le palais. Pour les prémolaires, le tableau commence en général par une molaire de lait qui ne tombe pas, soudée à l'os — l'ankylose — laissant la dent définitive dessous sans issue. L'arcade se raccourcissant, la deuxième prémolaire inférieure peut rester coincée dans l'os, parfois racine tournée vers l'arrière ou couchée à l'horizontale. Un panoramique pris tôt peut repérer ce tableau avant même l'heure d'éruption de la dent."
    },
    {
      "q": "Quels symptômes évoquent une dent incluse ?",
      "a": "Certaines dents incluses ne causent aucun symptôme et ne se découvrent que par hasard sur une radiographie de routine. Quand il y en a : élancements à l'angle de la mâchoire, gêne à la mastication, gonflements gingivaux récidivants et mauvaise haleine dominent. Une canine de lait qui reste en bouche plus longtemps qu'attendu peut signaler l'échec d'éruption de la dent définitive dessous. Mouvement, rotation ou résorption radiculaire inexpliqués d'une dent voisine méritent aussi d'être notés. Tous ces constats ne viennent pas forcément d'une dent incluse — pour des plaintes similaires, vous pouvez aussi consulter notre page <a href=\"/fr/hizmet/disim-agriyor/\">causes du mal de dents<\/a>."
    },
    {
      "q": "Pourquoi demander un scanner — le panoramique ne suffit-il pas ?",
      "a": "Le panoramique montre que la dent est là et à peu près où — mais c'est une image en deux dimensions. Le scanner à faisceau conique montre, en trois dimensions, si la dent siège côté palais ou côté joue, et à quelle distance son apex se trouve du nerf mandibulaire ou du plancher sinusien. Votre chirurgien s'en sert pour planifier la ligne d'incision, la quantité d'os à retirer et l'éventuelle séparation de la dent, avant même de commencer. Plus la planification est fine, plus temps opératoire et traumatisme tissulaire restent limités."
    },
    {
      "q": "Comment se déroule l'extraction, et par quelles étapes ?",
      "a": "L'acte commence sous anesthésie locale ; une sédation peut s'ajouter chez les patients très anxieux ou quand plusieurs dents sont incluses. L'anesthésie prise, il vous reste en général une sensation de pression et de poussée dans la zone. Le chirurgien soulève la gencive en un lambeau à la mesure de la zone. L'os couvrant la dent s'amincit ensuite sous refroidissement — l'ostéotomie. Si la position de la dent interdit une sortie d'un bloc, le chirurgien la sectionne en fragments à la fraise refroidie, ce qui réduit la charge sur l'os autour. L'alvéole se nettoie, les débris osseux se rincent au sérum, les bords vifs se lissent et le lambeau se suture sans tension. Sur les sites plus étendus, un matériau résorbable limitant le saignement peut se placer dans l'alvéole. Quand le plan est de guider la dent vers la bouche plutôt que de la retirer, l'approche chirurgicale diffère — nous le couvrons à la question canine ci-dessous. En fin d'acte, vous recevez une compresse stérile à mordre et des consignes de suite écrites."

      "q": "Combien de temps cela prend-il, et combien de séances ?",

    {

    },
    {
      "q": "Quels sont les risques et complications possibles ?",

    },
    {
      "q": "Quand n'est-elle pas réalisée, ou reportée ?",
      "a": "En cas d'infection active qui s'étend dans la zone, votre praticien contrôle d'abord l'inflammation et reporte la chirurgie. Diabète non contrôlé, troubles de la coagulation, anticoagulants ou traitements de la densité osseuse, antécédent de radiothérapie tête et cou : tous demandent préparation supplémentaire et concertation entre spécialistes. Pour une chirurgie non urgente pendant la grossesse, l'équipe attend en général l'après-accouchement. Pour les dents profondément incluses, sans symptôme, sans kyste et sans pression sur une racine voisine, la surveillance reste aussi une option sur la table. Votre chirurgien tranche en lisant constats d'examen et scanner ensemble."
    },
    {
      "q": "À quoi faire attention les premières 24 heures ?",
      "a": "Mordre sans pause sur la compresse trente à quarante-cinq minutes aide le saignement à s'arrêter. Évitez ce jour-là rinçage, crachat et paille — l'aspiration peut déloger le caillot. Ne brossez pas la ligne de suture, n'y touchez ni de la langue ni du doigt ; brossez normalement les dents voisines. Ne commencez les rinçages que le jour où votre praticien donne le feu vert, en général après les premières 24 heures. La glace sur la joue par intervalles limite le gonflement ; tabac et alcool retardent tous deux la cicatrisation. Nourriture tiède ou froide, et molle. Prenez l'antalgique prescrit, et l'antibiotique éventuel, exactement comme indiqué."

    }
