  "lead": "Sur les dents blanches, tout le monde semble avoir entendu une recette maison, ou reçu un « conseil » d'un proche. Hélas, une bonne part de ce prétendu savoir n'est que du ouï-dire — et une partie peut même abîmer vos dents. Dans cet article, nous passons en revue, un par un, huit des mythes que nous entendons le plus sur le blanchiment dentaire, et nous expliquons simplement les faits derrière chacun.",

    {
      "h2": "Citron et bicarbonate blanchissent-ils vraiment les dents ?",
      "html": "<p><strong>Mythe 1 : citron et bicarbonate blanchissent les dents.<\/strong> La recette peut sembler inoffensive en cuisine — pas pour vos dents. Le bicarbonate est une poudre abrasive, le citron un acide fort ; ensemble, ils amincissent la surface de l'émail comme du papier de verre. L'éclat perceptible les premiers jours n'est en réalité que la surface abrasée qui réfléchit la lumière autrement. L'émail s'amincissant, la couche jaune de dentine dessous transparaît davantage, et les dents prennent avec le temps un ton plus sombre. Autrement dit, la recette fait l'exact inverse de sa promesse.<\/p><p>La deuxième idée reçue s'y rattache de près. <strong>Mythe 2 : les recettes naturelles sont inoffensives.<\/strong> Fraise écrasée, vinaigre de cidre, charbon actif... l'étiquette « naturel » rassure, mais la plupart de ces mélanges sont acides ou abrasifs. L'émail usé ne se renouvelle pas — le prix des expériences de cuisine peut donc devenir irréversible.<\/p><p>Si la coloration de vos dents est une tache de surface due au thé, au café ou au tabac, la solution commence en clinique, pas à la maison. Un <a href=\"/fr/hizmet/dis-tasi-temizligi/\">détartrage-polissage<\/a> professionnel peut retirer une part significative de ce type de coloration. Pour comprendre d'où viennent les colorations, voyez notre page sur les <a href=\"/fr/hizmet/dislerimde-lekeler-var/\">taches sur les dents<\/a>.<\/p>"

    {
      "h2": "Le blanchiment dentaire abîme-t-il l'émail ?",
      "html": "<p><strong>Mythe 3 : le blanchiment abîme l'émail.<\/strong> Cette inquiétude se nourrit de problèmes qui viennent en réalité de l'usage incontrôlé. Les gels utilisés lors d'un <a href=\"/fr/hizmet/dis-beyazlatma/\">blanchiment dentaire<\/a> mené en clinique n'agissent pas en abrasant l'émail — ils décomposent les molécules de couleur dans l'émail et la dentine. Le mécanisme n'a rien à voir avec l'abrasion mécanique des recettes maison type citron-bicarbonate.<\/p><p>En cadre clinique, votre praticien examine d'abord dents et gencives, et règle force du gel, temps d'application et nombre de séances sur cette évaluation. Les gencives se protègent d'une barrière spéciale, et la réponse de la dent se surveille tout au long de l'acte. Les problèmes d'émail, eux, viennent surtout de l'usage prolongé et non encadré de produits très concentrés achetés en ligne. Bref : le problème n'est pas la méthode — c'est de l'utiliser sans supervision.<\/p>"

    {
      "h2": "La sensibilité après un blanchiment est-elle définitive ?",
      "html": "<p><strong>Mythe 4 : la sensibilité après le blanchiment est définitive.<\/strong> Un bref picotement sur une gorgée d'eau froide suffit à détourner bien des gens du traitement. En réalité, cette sensation est passagère dans la plupart des cas et censée s'apaiser en quelques jours. Le gel stimule temporairement les fins tubules de la dentine ; aucun changement durable de la structure de la dent. Le schéma typique : sensibilité plus nette le premier jour ou deux, puis décrue graduelle les jours suivants. Pendant cette courte période, éviter les extrêmes très chauds et très froids, remettre les boissons acides à quelques jours et brosser doucement réduisent les facteurs qui stimulent les tubules.<\/p><p>Après l'acte, votre praticien peut partager soins protecteurs et conseils visant à réduire la sensibilité. Si elle dure plus que prévu, une autre cause peut se cacher dessous ; dans ce cas, décrire votre <a href=\"/fr/hizmet/disim-sizliyor/\">sensibilité dentaire<\/a> à votre praticien aide à clarifier la situation.<\/p>"

      "h2": "Couronnes et plombages blanchissent-ils aussi ?",
      "html": "<p><strong>Mythe 5 : couronnes et plombages blanchissent aussi.<\/strong> Les gels de blanchiment n'agissent que sur la structure dentaire naturelle. Les restaurations comme la <a href=\"/fr/hizmet/zirkonyum/\">zircone<\/a> et les <a href=\"/fr/hizmet/porselen-lamina/\">facettes en céramique<\/a>, avec les <a href=\"/fr/hizmet/dolgu/\">plombages<\/a> existants, ne sont pas touchées par ces gels — leur couleur reste exactement la même.<\/p><p>Ce détail fixe aussi l'ordre du plan. Le blanchiment se termine d'abord, et la teinte des restaurations à venir se choisit ensuite sur le nouveau ton des dents. Si un plombage ou une couronne déjà en bouche paraît sombre après le blanchiment, votre praticien passe en revue avec vous des options comme l'accord de teinte au <a href=\"/fr/hizmet/bonding/\">bonding<\/a> ou le remplacement de la restauration. La voie choisie dépend largement de l'état de la restauration : différence de teinte petite et plombage sain — l'accord de surface suffit dans la plupart des cas ; différence évidente, restauration usée ou limite dégradée — le remplacement passe devant.<\/p>"

    {
      "h2": "Combien de temps dure l'effet du blanchiment ?",
