      "h2": "Wann sollte ein Baby zum ersten Zahn-Check?",
      "html": "<p>In vielen Familien kommt der Zahnarzttermin erst in den Sinn, wenn die erste Beschwerde da ist. Der in der Kinderzahnheilkunde breit akzeptierte Ansatz zeigt aber auf ein viel früheres Datum: ein kurzer Kennenlern-Check, wenn der erste Milchzahn durchbricht — spätestens zum ersten Geburtstag. Ziel dieses Besuchs ist keine Behandlung; angesehen werden das Durchbruchsmuster der Zähne und das Kariesrisiko, und für die Familie entsteht ein maßgeschneiderter Fahrplan von der Ernährung bis zur Reinigung.<\/p><p>Das frühe Kennenlernen hat einen weiteren Vorteil: Das Kind lernt die Praxis über eine kurze Fahrt im Stuhl und etwas Spiel kennen — nicht über Schmerzen. Diese erste positive Erfahrung macht die Kontrollen der Folgejahre spürbar leichter. Mit dem Größerwerden kommen bei Bedarf einfache vorbeugende Maßnahmen wie eine <a href=\"/de/hizmet/dis-tasi-temizligi/\">professionelle Zahnreinigung<\/a> in diese Routine dazu.<\/p><p>Der Kontrollabstand ist nicht für jedes Kind gleich. Für Kinder mit niedrigem Risiko gelten zwei Besuche im Jahr im Allgemeinen als ausreichend, während bei höherem Kariesrisiko eine engere Begleitung empfohlen werden kann. Die meisten Besuche bestehen aus nichts weiter als Pflege, Information und kleinen vorbeugenden Handgriffen.<\/p>"
