      "h2": "Ist es im Erwachsenenalter zu spät für Kieferorthopädie?",
      "html": "<p>Bei Kieferorthopädie denken die meisten zuerst an Schulkinder — doch ein erheblicher Teil derer, die heute eine Behandlung beginnen, sind Erwachsene. Solange Zahnfleisch und Kieferknochen gesund sind, lässt sich Zahnbewegung auch später im Leben planen. Anders gesagt: Die Tür zur Kieferorthopädie ist mit dreißig, vierzig oder auch fünfzig nicht zu.<\/p><p>Was Erwachsene meist jahrelang warten lässt, ist nicht der fehlende Bedarf, sondern die Vorstellung, mit Metallbrackets herumzulaufen. Viele, die sich wegen <a href=\"/de/hizmet/dislerim-yamuk/\">eng stehender Zähne<\/a> oder <a href=\"/de/hizmet/dislerim-ayrik/\">Zahnlücken<\/a> <a href=\"/de/hizmet/gulerken-rahat-hissetmiyorum/\">beim Lächeln nicht wohlfühlen<\/a>, gewöhnen sich an, auf Fotos mit geschlossenen Lippen zu lächeln. Die Verbreitung der Aligner-Technologie hat dieses Bild verändert: Die Behandlung kann heute von außen fast unbemerkt laufen.<\/p><p>Einen Unterschied zur Behandlung in der Kindheit gibt es dennoch: Weil das Wachstum abgeschlossen ist, lässt sich die Kieferentwicklung nicht mehr lenken, und manche Bewegungen brauchen mehr Zeit. Der Wachstumsvorteil der <a href=\"/de/hizmet/cocuk-ortodontisi/\">Kieferorthopädie für Kinder<\/a> fehlt bei Erwachsenen — die Planung verlangt entsprechend feinere Berechnung.<\/p>"
