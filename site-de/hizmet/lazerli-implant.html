      "q": "Wie lange dauert die Behandlung – und verkürzt der Laser sie?",
      "a": "Der chirurgische Teil dauert bei einem einzelnen Implantat meist zwanzig bis vierzig Minuten; bei mehreren Lagern länger. Die Einheilung – also die Verwachsung des Implantats mit dem Knochen – braucht üblicherweise zwei bis vier Monate im Unterkiefer und drei bis sechs im Oberkiefer. Der Laser kann dem Weichgewebe beim Verschluss helfen, verkürzt aber nicht die biologische Zeitachse der Knochenverwachsung. Unkontrollierte Allgemeinerkrankungen und die Knochenqualität vor Ort können die Gesamtzeit verlängern. In geeigneten Fällen kann die Versorgungsphase vorgezogen werden – Voraussetzung ist eine ausreichende Primärstabilität im Moment des Einsetzens: Eindrehmoment und Knochendichte müssen das geforderte Niveau erreichen. Bleiben die Messwerte darunter, wird auf die Belastung verzichtet. Details zur Frühbelastung stehen auf unserer Seite zu den <a href=\"/de/hizmet/1-gunde-implant/\">Sofortimplantaten<\/a>."
