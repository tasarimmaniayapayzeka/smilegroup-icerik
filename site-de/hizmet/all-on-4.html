  "breadcrumb": [

  ],
  "lead": "Einen komplett zahnlosen Kiefer mit nur vier Implantaten fest zu versorgen – das ist der Kerngedanke des All-on-4-Konzepts. Diese Seite betrachtet nüchtern die Logik der angulierten Implantate, Planungsgrößen wie Freiendglied und Abstützungsbreite, die Behandlungsschritte, den Heilungsverlauf, die Grenzen und die möglichen Risiken. Öffnen Sie unten die Überschrift, deren Details Sie interessieren.",
  "faqs": [
    {
      "q": "Was ist die All-on-4-Implantatbehandlung?",
      "a": "Die „Vier“ im Namen steht für die Zahl der tragenden Implantate – nicht für die Zahl der Zähne darauf. In einen komplett zahnlosen Kiefer werden vier Implantate gesetzt, und darauf entsteht eine einteilige festsitzende Versorgung, die alle Zähne dieses Kiefers trägt. Zwei Implantate stehen vorne gerade, zwei sind nach hinten anguliert. Da es sich um eine einteilige Konstruktion handelt, verteilt sich die gesamte Last der Versorgung auf diese vier Stützen. Das <a href=\"/de/hizmet/tek-dis-implant/\">Einzelzahnimplantat<\/a>, das für jeden fehlenden Zahn ein eigenes Implantat vorsieht, folgt insofern einer anderen Logik. Weil Ober- und Unterkiefer unterschiedliche Knochenstrukturen haben, wird jeder Kiefer für sich geplant."
    },
    {
      "q": "Warum werden die Implantate schräg gesetzt?",
      "a": "Der Knochen im hinteren Kieferbereich baut nach Zahnverlust schneller ab. Die Angulation umgeht im Oberkiefer die Kieferhöhle und im Unterkiefer den Nervkanal – so lässt sich im vorhandenen Knochen ein längeres Implantat verwenden und die hintere Stütze weiter nach hinten verlagern. In den meisten Plänen neigt der Chirurg die hinteren Implantate um 30 bis 45 Grad. Das vergrößert den Abstand zwischen vorderster und hinterster Stütze – die sogenannte anteroposteriore Abstützungsbreite. Eine breitere Abstützung verkürzt den ungestützten Teil der Versorgung hinter dem letzten Implantat, das <em>Freiendglied<\/em> (Cantilever); ein kürzeres Freiendglied hilft, Kaukräfte wirksamer auf die Stützen zu übertragen. In manchen Fällen sinkt dadurch auch der Bedarf an Zusatzchirurgie wie dem <a href=\"/de/hizmet/sinus-lifting/\">Sinuslift<\/a>. Der gewählte Winkel richtet sich nach dem Abstand zwischen Kieferhöhlenboden und Nervkanal."
    },
    {
      "q": "Für wen ist die Behandlung geeignet?",
      "a": "In Betracht kommt das Konzept für Erwachsene, die in einem Kiefer keine Zähne mehr haben oder deren Restzähne nicht zu retten sind. Wer eine herausnehmbare Vollprothese trägt und mit deren Halt unzufrieden ist, gehört in dieselbe Beurteilung. Der entscheidende Faktor liegt im hinteren Mundbereich: Wo die Knochenhöhe auf Molarenhöhe abgenommen hat, die Kieferhöhle abgesunken oder der Nervkanal nah an die Oberfläche gerückt ist, spielt der angulierte Vier-Implantat-Plan seine Stärke aus. Vorne muss zwischen beiden Kieferhälften genug Knochenvolumen vorhanden sein. Vorausgesetzt werden außerdem ein operationstauglicher Allgemeinzustand und eine dauerhaft durchhaltbare Mundhygiene."
    },
    {
      "q": "Welche Schritte durchläuft die Behandlung?",
      "a": "Der Fahrplan beginnt mit einer gründlichen Untersuchung und einer 3D-Aufnahme (DVT); beurteilt werden Knochendichte sowie Sinus- und Nervanatomie, die Implantatpositionen werden digital geplant. Beim OP-Termin wählt das Team das passende Anästhesieverfahren, entfernt nicht erhaltungsfähige Zähne und setzt die vier Implantate in den geplanten Winkeln. Werden messbare Schwellen wie das Eindrehmoment erreicht, kann noch in derselben Sitzung ein festsitzendes Provisorium eingesetzt werden; wird die Schwelle verfehlt, wird die Belastung verschoben. Eine Sofortbelastung ist also nicht in jedem Fall möglich – die Details zu diesem Belastungsweg stehen auf unserer Seite zu den <a href=\"/de/hizmet/1-gunde-implant/\">Sofortimplantaten<\/a>. Nach abgeschlossener Einheilung folgt die Abformung, und der Zahntechniker fertigt die endgültige Versorgung im Labor."
    },
    {
      "q": "Wie lange dauert der gesamte Prozess?",

    },
    {
      "q": "Vier Implantate oder sechs?",

    },
    {
      "q": "Worin unterscheidet sich das von der Ganzkiefer-Implantatbehandlung?",
      "a": "Die beiden Begriffe meinen nicht dasselbe. Die <a href=\"/de/hizmet/full-agiz-implant/\">Ganzkiefer-Implantatbehandlung<\/a> ist eine breite Beschreibung für den Wiederaufbau eines oder beider Kiefer mit Implantaten; unter diesem Dach finden sich unterschiedliche Implantatzahlen, festsitzende oder herausnehmbare Versorgungsarten und implantatgetragene Deckprothesen. All-on-4 ist ein klar umrissenes Konzept: ein einzelner Kiefer, vier Implantate, eine einteilige festsitzende Versorgung. Mit der Implantatzahl ändern sich Planung, Zeitplan und Pflegeaufwand. Kurz: Ganzkiefer ist der Oberbegriff – All-on-4 ein präzise definierter Ansatz darunter."
    },
    {
      "q": "Lässt sich die Versorgung herausnehmen und wieder einsetzen?",
      "a": "Selbst herausnehmen und wieder einsetzen können Sie diese Konstruktion nicht; die Suprastruktur ist in der Regel verschraubt, befestigt auf den Verbindungselementen der Implantate. Die Schraubenkanäle werden mit Kompositmaterial verschlossen; da sich dieses mit der Zeit verfärben kann, wird es bei Kontrollen gegebenenfalls erneuert. Nur Ihre Zahnärztin oder Ihr Zahnarzt nimmt die Versorgung ab und setzt sie wieder ein – wenn Kontrolle, Reinigung oder Reparatur es verlangen. Dass eine verschraubte Konstruktion überhaupt abnehmbar ist, ist in manchen Fällen gerade der Grund, sie zu wählen: Wartung und Reparatur lassen sich leichter planen."
    },
    {
      "q": "Aus welchen Materialien besteht die Versorgung?",

    },
    {
      "q": "Mit welchen funktionellen Veränderungen können Sie rechnen?",
      "a": "Die vier Implantate sind so positioniert, dass sie eine festsitzende Versorgung für den ganzen Kiefer tragen. Die feste Suprastruktur soll das Kauen spürbar verbessern; wie groß der Zugewinn ausfällt, hängt von Knochenqualität und Versorgungstyp ab. Im Oberkiefer ist eine Konstruktion möglich, die den Gaumen frei lässt. Angulierte Implantate können in manchen Fällen den Bedarf an Zusatzchirurgie wie dem <a href=\"/de/hizmet/kemik-grefti/\">Knochenaufbau<\/a> verringern. Ihre tägliche Mundpflege und Ihr Allgemeinzustand prägen die erreichte Funktion unmittelbar. Bei gaumenfreier Konstruktion brauchen Geschmacksempfinden und Sprache einige Wochen zur Umgewöhnung."
    },
    {
      "q": "Welche Risiken und Nachteile gibt es?",
      "a": "Wie jeder chirurgische Eingriff trägt auch diese Behandlung Risiken. Nach der Operation können Schwellung, Bluterguss und vorübergehende Sprechschwierigkeiten auftreten. Möglich sind Infektionen, Knochenabbau an einem Implantat und das Ausbleiben der Verwachsung. Arbeiten nahe dem Nervkanal im Unterkiefer können Taubheit oder veränderte Empfindung verursachen – meist vorübergehend, gelegentlich bleibend. Im Oberkiefer kann es zu Komplikationen an der Kieferhöhle kommen. Da das System auf vier Stützen ruht, kann der Verlust eines Implantats die gesamte Versorgung betreffen; in dem Fall wird die Versorgung vorübergehend abgenommen und nach Ausheilung entweder ein neues Implantat gesetzt oder die Stützenzahl geändert. Im Zahnfleisch und Knochen rund um ein Implantat können sich entzündliche Veränderungen entwickeln – die <em>Periimplantitis<\/em> –, die über Sondierung und Röntgen überwacht wird. In der Provisoriumszeit sind steifes Sprechgefühl, vermehrter Speichelfluss und Eingewöhnungsprobleme beim Essen häufig. Mit der Zeit können sich Schrauben lockern, Kunststoff brechen und künstliche Zähne abnutzen."
    },
    {
      "q": "In welchen Situationen ist die Behandlung nicht möglich?",
      "a": "Die Gegenanzeigen gliedern sich in zwei Gruppen. Eine kürzlich erfolgte Strahlentherapie im Kopf-Hals-Bereich und eine unkontrollierte Blutgerinnungsstörung sind dauerhafte Hindernisse; auch bestimmte Medikamente, die in den Knochenstoffwechsel eingreifen, gehören hierher. Die zweite Gruppe bilden ein schlecht eingestellter Diabetes, aktive Infektionen im Mund und starkes Rauchen – manches davon ist vorübergehend, und nach Stabilisierung kann der Plan neu aufgenommen werden. Reicht der vordere Knochen zwischen beiden Kieferhälften selbst für die angulierte Platzierung nicht aus, ändert sich der Plan: Aufbau oder eine andere Stützenzahl kommen in Betracht. Bei starkem, schlecht kontrolliertem Zähnepressen treten Brüche und Abnutzung an der Versorgung häufiger auf – mehr dazu auf unserer Seite <a href=\"/de/hizmet/dislerimi-sikiyorum/\">Zähnepressen<\/a>. Bei jungen Patientinnen und Patienten mit unvollständigem Kieferwachstum wird der Eingriff verschoben. Das alles lässt sich nur über klinische Untersuchung und Krankengeschichte klären."
    },
    {
      "q": "Worauf sollten Sie nach der Operation achten?",
      "a": "In den ersten Tagen: weiche Kost, nichts Hartes oder Klebriges. Rauchen und Alkohol verlangsamen die Gewebeheilung – nach der Operation eine Pause von beidem. Anstrengung und Druck auf das Operationsgebiet in den ersten Tagen begrenzen, da Blutung und Schwellung sonst zunehmen können. Unter der einteiligen Vier-Stützen-Versorgung bleibt ein schmaler Spalt zwischen Zahnfleisch und Suprastruktur – reinigen Sie ihn täglich mit Interdentalbürste und Munddusche. Professionelle Reinigung und Schraubenkontrolle in den vereinbarten Abständen, meist mehr als einmal jährlich. Bei Lockerung, Blutung, üblem Geruch oder Schmerzen sofort die Klinik kontaktieren."

      "q": "Wovon hängt die Lebensdauer der Versorgung ab?",

    }

  "closing": "Bei vollständigem Zahnverlust formt sich der Plan nach der Verteilung Ihres Knochenangebots und dem Zustand des Gegenkiefers. Ihre 3D-Aufnahmen und Ihre Krankengeschichte werden geprüft, bevor die geeigneten Optionen mit Ihnen besprochen werden. Zwischen dem Vier-Stützen-Konzept und dem <a href=\"/de/hizmet/all-on-6/\">Sechs-Stützen-Ansatz<\/a> entscheidet die Knochenhöhe im hinteren Kiefer. Für eine Beurteilung vereinbaren Sie einen Termin über unsere <a href=\"/de/kontakt/\">Kontaktseite<\/a>.",
