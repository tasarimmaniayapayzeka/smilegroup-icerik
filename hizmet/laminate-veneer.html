    { q: "Laminate veneer nasıl yapılır ve kaç seans sürer?", a: `Laminate veneer uygulaması çoğunlukla birkaç seansta tamamlanır. İlk randevuda hekim dişleri inceler, ölçü alır ve dijital ya da alçı model üzerinde tasarımı planlar. Sonraki aşamada minede çok ince bir hazırlık yapılır; gerektiğinde geçici kaplamalar takılabilir. Laboratuvar porselenleri hazırladıktan sonra prova gelir, renk ve uyum onaylanınca laminalar özel yapıştırıcıyla sabitlenir. Bazı vakalarda mockup adı verilen ön deneme, sonucu önceden görmenize yardımcı olur. Toplam süre, vakanın kapsamına göre kişiden kişiye değişir.` },

    { q: "Laminate veneer öncesi diş beyazlatma gerekir mi?", a: `Bazı durumlarda hekim, laminate öncesinde beyazlatma önererek renk uyumunu güçlendirir. Laminalar sabit bir renk tonunda hazırlandığından komşu doğal dişlerin tonu genel sonucu etkiler. Bu nedenle <a href="/hizmet/dis-beyazlatma/">diş beyazlatma</a>, tasarımın rengi belirlenmeden önce planlanabilir. Her vakada gerekli değildir; karar, gülüşün bütününe ve mevcut diş renklerine göre verilir. Renk seçimini hekiminizle birlikte netleştirmeniz daha sağlıklı olur.` }
