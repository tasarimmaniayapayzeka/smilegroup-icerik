  lead: "All-on-4 ve All-on-6, dişlerinin tamamını kaybetmiş kişilerde sabit bir çözüm sunan gelişmiş implant yöntemleridir. Bu tedaviler, tek çenedeki tüm dişleri az sayıda implant üzerine yerleştirilen sabit protezle yeniden kazandırmayı amaçlar. Uygunluk her hasta için ayrı değerlendirilir ve nihai planı hekiminiz belirler.",
  faqs: [
    { q: "All-on-4 nedir?", a: `All-on-4, bir çenedeki dişlerin tamamının yalnızca dört <a href="/hizmet/dis-implanti/">diş implantı</a> üzerine sabitlendiği bir tedavi yöntemidir. Öndeki iki implant düz, arkadaki iki implant ise açılı yerleştirilir; böylece mevcut kemik en verimli şekilde kullanılır. Bu yaklaşım, çok sayıda diş eksikliği olan hastalara sabit ve estetik bir çözüm sunar. Yöntem her ağız yapısına birebir uymayabilir, bu yüzden kişiye özel bir muayene gerekir.` },
    { q: "All-on-4 ile All-on-6 arasındaki fark nedir?", a: `İki yöntem arasındaki temel fark, kullanılan implant sayısında ortaya çıkar. All-on-4 tek çenede dört implant kullanırken, All-on-6 altı implantla daha geniş bir destek alanı oluşturur. Kemik hacmi ve yoğunluğu yeterli olan hastalarda hekim, yükü dağıtmak için All-on-6'yı tercih edebilir. Daha sınırlı kemiği olan kişilerde ise dört implantlı tasarım öne çıkar. Hangi seçeneğin uygun olduğuna, tomografi ve klinik muayene sonrasında hekiminiz karar verir.` },
    { q: "All-on-4 tedavisi kimlere uygundur?", a: `All-on-4, dişlerinin çoğunu ya da tamamını kaybetmiş yetişkinler için değerlendirilen bir seçenektir. Hareketli protez kullanmakta zorlanan, damaksız ve sabit bir çözüm isteyen kişiler bu yöntemden yararlanabilir. Genel sağlık durumu, diş eti sağlığı ve kemik yapısı uygunluğu doğrudan etkiler. Kontrolsüz diyabet veya ağır sigara kullanımı gibi durumlar iyileşmeyi zorlaştırabilir. Bu nedenle son kararı, ayrıntılı bir muayeneden sonra hekiminiz verir.` },
    { q: "All-on-4'te aynı gün diş takılır mı?", a: `Uygun koşullar oluştuğunda geçici protez çoğunlukla implantların yerleştirildiği gün takılabilir. Bu yaklaşım <a href="/hizmet/hemen-yukleme-implant/">hemen yükleme implant</a> mantığına dayanır ve hastanın dişsiz kalmadan kliniğe veda etmesini sağlar. İlk protez geçici olduğundan, iyileşme tamamlandıktan sonra kalıcı protezle değiştirilir. Ancak aynı gün yükleme her hasta için mümkün değildir; kemik kalitesi ve implantın ilk tutunması belirleyicidir. Hekim, ölçümler yeterli gelmezse yüklemeyi ileri bir tarihe erteleyebilir.` },
    { q: "All-on-4'te kaç implant kullanılır?", a: `All-on-4 yönteminde tek çene için dört adet implant kullanılır. Bu dört implant, üzerine sabitlenen köprü sayesinde on ila on dört dişlik bir protezi taşıyabilir. Arka bölgedeki implantların açılı yerleştirilmesi, ek cerrahi işlemlere olan ihtiyacı çoğu vakada azaltır. Bazı hastalarda dayanıklılığı artırmak için implantları birbirine bağlayan titanyum bar tasarımı da tercih edilebilir. Kullanılacak implant sayısı ve tasarım, çenenizin durumuna göre planlanır.` },
    { q: "Kemik yetersizse All-on-4 mümkün müdür?", a: `Kemik hacmi sınırlı olduğunda bile All-on-4 birçok hastada uygulanabilir. Açılı implant tekniği, mevcut kemiğin arka bölgesini daha etkin kullanarak greft ihtiyacını sıklıkla ortadan kaldırır. Yine de kemik miktarı çok azaldığında ek işlemler gündeme gelebilir; bu durumda <a href="/hizmet/kemik-grefti/">kemik grefti</a> veya üst çenede <a href="/hizmet/sinus-lifting/">sinüs lifting</a> uygulaması planlanabilir. Kemik yapınızın bu tedaviye elverip elvermediğini üç boyutlu tomografi netleştirir. Değerlendirmeyi ve uygun tekniği hekiminiz belirler.` },
    { q: "All-on-4 protezinin ömrü ne kadardır?", a: `Protezin kullanım süresi, ağız bakımına ve düzenli kontrollere bağlı olarak kişiden kişiye değişir. İyi bakılan implantlar uzun yıllar işlevini koruyabilir; ancak hiçbir tedavi için ömür boyu kalıcılık sözü verilemez. Protezin üst kısmı zamanla aşınabilir ve gerektiğinde yenilenebilir. Sigara, diş sıkma alışkanlığı ve ihmal edilen hijyen ise süreyi kısaltan etkenlerdir. Düzenli hekim kontrolü, olası sorunları erken fark etmenin en güvenli yoludur.` },
    { q: "All-on-4 bakımı nasıl yapılır?", a: `All-on-4 protezinin bakımı, doğal dişlerdekine benzer bir titizlik gerektirir. Günde iki kez fırçalama, ara yüz fırçaları ve ağız duşu ile implant çevresi temiz tutulur. Köprünün altında biriken bakteri plağı, diş eti sağlığını doğrudan etkilediği için ihmal edilmemelidir. Altı ayda bir yapılan profesyonel kontrol ve temizlik, protezin sağlığını korur. Bakım alışkanlıklarınızı hekiminiz ağız yapınıza göre kişiselleştirir.` },
    { q: "Tedavi sonrası iyileşme ve beslenme nasıl olur?", a: `İlk günlerde yumuşak ve ılık besinler tercih edilerek implant bölgesi korunur. Cerrahiden sonra hafif şişlik ya da hassasiyet görülebilir; bu belirtiler genellikle kısa sürede geriler. Sert, çok sıcak ve yapışkan gıdalardan başlangıçta uzak durmak iyileşmeyi destekler. Kemik ile implantın kaynaşması haftalar içinde tamamlanır ve bu dönemde beslenme kademeli olarak normale döner. Hekiminizin verdiği ilaç ve beslenme önerilerine uymak, sürecin sorunsuz ilerlemesine katkı sağlar.` },
    { q: "All-on-4 ile klasik total protez arasındaki fark nedir?", a: `En belirgin fark, All-on-4'ün çeneye sabitlenmesi, klasik protezin ise hareketli olmasıdır. Geleneksel <a href="/hizmet/total-protez/">total protez</a> damak üzerine oturur ve zamanla kayma yapabilirken, All-on-4 implantlara vidalanarak yerinde kalır. Bu sabitlik, çiğneme gücünü ve konuşma rahatlığını artırır. Ayrıca sabit çözüm, damak hissini azaltarak daha doğal bir kullanım sunar. Hangi seçeneğin sizin için uygun olduğunu, beklentileriniz ve ağız yapınız doğrultusunda hekiminiz değerlendirir.` }
