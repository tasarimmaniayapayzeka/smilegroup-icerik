<script>
window.ARTICLE = {
  slug: "dis-implanti",
  title: "Diş İmplantı Tedavisi",
  breadcrumb: ["Anasayfa", "Tedavilerimiz", "Diş İmplantı Tedavisi"],
  lead: "Diş implantı, eksik bir dişin yerine çene kemiğine yerleşen titanyum bir kök ile üzerine gelen protetik dişin birlikte oluşturduğu kalıcı bir çözümdür. Aşağıdaki başlıklar; tedavinin nasıl planlandığını, kimlere uygun olduğunu ve iyileşmenin nasıl ilerlediğini soru-cevap biçiminde açıklar. Her başlığa tıklayarak ilgili bölümü açabilirsiniz.",
  faqs: [
    { q: "Diş implantı nedir ve nasıl çalışır?",
      a: `Diş implantı, kaybedilen dişin kökünü taklit eden titanyum bir vidadır. Hekiminiz bu vidayı çene kemiğine yerleştirir; implant, birkaç ay içinde kemikle kaynaşır. Uzmanlar bu biyolojik kaynaşmayı <em>osseointegrasyon</em> olarak adlandırır. Süreç tamamlanınca implantın üstüne bir dayanak (abutment) ve doğal görünümlü bir kaplama gelir. Böylece hem çiğneme gücü hem de gülüş estetiği geri döner. Klasik köprülerden farklı olarak implant, komşu sağlam dişleri aşındırmadan tek başına durur ve çene kemiğini uyararak kemik erimesini yavaşlatır.` },
    { q: "Kimler diş implantı yaptırabilir?",
      a: `Çene gelişimini tamamlamış, genel sağlığı uygun ve ağız bakımına özen gösteren yetişkinler çoğu durumda uygun adaydır. Kontrolsüz şeker hastalığı, yoğun sigara kullanımı veya tedavi edilmemiş diş eti iltihabı süreci etkileyebilir. Bu yüzden hekiminiz; ağız içi muayene ve üç boyutlu tomografiyle kemik kalınlığınızı, diş eti sağlığınızı ve genel durumunuzu değerlendirir. Diş eti sorunları öne çıkıyorsa, implanttan önce <a href="/hizmet/dis-eti-hastaligi-tedavisi/">diş eti hastalığı tedavisi</a> gündeme gelebilir. Uygunluk kararını yalnızca muayene sonrası hekim verir.` },
    { q: "Diş implantı tedavisi kaç aşamada ve ne kadar sürede tamamlanır?",
      a: `Tedaviyi genellikle dört ana adımda tamamlarız. Önce dijital planlama yaparız: ölçü, tomografi ve gülüş analizi. Ardından hekim, implantı kısa bir cerrahi işlemle çene kemiğine yerleştirir. Sonraki dönemde implant kemikle kaynaşır; bu iyileşme kişiden kişiye değişse de ortalama iki ila dört ay sürer. Son adımda implantın üzerine dayanak ve kalıcı kaplama gelir. Toplam süre; eksik diş sayısına, kemik durumuna ve ek işlem gerekip gerekmediğine göre değişir. Planlamadan bitişe kadar her aşamayı kontrollü ilerletiriz.` },
    { q: "Tek diş, çoklu diş ve tam çene implantı arasındaki fark nedir?",
      a: `Doğru yöntemi, eksik diş sayısı ve boşluğun yeri belirler. Tek bir diş eksikse <a href="/hizmet/tek-dis-implanti/">tek diş implantı</a> çoğu zaman yeterli olur. Yan yana birkaç diş eksikse hekim <a href="/hizmet/coklu-implant/">köprülü (çoklu) implant</a> önerebilir. Tüm çenede diş yoksa <a href="/hizmet/all-on-4/">All-on-4 veya All-on-6</a> gibi sabit protez çözümleri devreye girer. Üç yaklaşım da aynı biyolojik temele dayanır; değişen tek şey, taşınan diş sayısı ve implantların çeneye konumlandırılmasıdır.` },
    { q: "Diş implantı mı köprü mü, hangisi daha koruyucu?",
      a: `İki yöntem de eksik dişi tamamlar, ancak mantıkları ayrışır. Köprü, boşluğun iki yanındaki dişlerden destek alır ve bu sağlam dişlerin aşındırılmasını gerektirir. İmplant ise komşu dişlere dokunmadan gücünü doğrudan çene kemiğinden alır. Bu yönüyle implant, sağlam dişleri korur ve tek diş boşluklarında çoğu zaman daha koruyucu bir seçenek sayılır. Yine de köprünün daha uygun olduğu durumlar vardır; kemik hacminiz, diş eti sağlığınız ve beklentileriniz kararı birlikte şekillendirir.` },
    { q: "Yeterli çene kemiği yoksa implant yapılabilir mi?",
      a: `Kemik hacmi yetersiz olsa bile çoğu vakada çözüm bulunur. Hekim, implant için sağlam bir zemin oluşturmak amacıyla <a href="/hizmet/kemik-grefti/">kemik grefti</a> uygulayabilir. Üst çenenin arka bölgesinde kemik yüksekliği azaldıysa <a href="/hizmet/sinus-lifting/">sinüs lifting</a> gündeme gelir. Bu hazırlık işlemleri, implantın uzun vadeli tutunmasını ve stabilitesini destekler. Kısacası kemik eksikliği tek başına engel değildir; hekiminiz önce zemini güçlendirir, ardından implant planını yapar.` },
    { q: "Aynı gün (hemen yükleme) implant mümkün mü?",
      a: `Bazı uygun vakalarda hekim, implantı yerleştirdiği gün geçici bir dişi de takabilir; buna hemen yükleme deriz. <a href="/hizmet/hemen-yukleme-implant/">Aynı gün implant</a> için kemik yoğunluğunun ve ağız sağlığının elverişli olması gerekir. Her hasta bu yönteme uygun olmayabilir; bu nedenle karar, tomografi ve muayene sonrası verilir. Uygun olmayan durumlarda klasik iki aşamalı yöntem hem daha güvenli hem de daha öngörülebilir bir sonuç sunar.` },
    { q: "Diş implantı ağrır mı, iyileşme nasıl olur?",
      a: `İşlemi lokal anestezi altında yaptığımız için hastalar çoğunlukla işlem sırasında ağrı hissetmez. Sonraki birkaç günde hafif şişlik veya hassasiyet olağandır; bunları hekiminizin önerdiği basit önlemlerle rahatça yönetebilirsiniz. İlk hafta soğuk uygulama, yumuşak beslenme ve düzenli ağız bakımı iyileşmeye yardımcı olur. Her hastanın iyileşme hızı farklı olduğundan, kesin bir gün vermek yerine kişiye özel bir takvim çıkarırız. Kaygınız varsa, işlem öncesi konfor yaklaşımlarını hekiminizle konuşabilirsiniz.` },
    { q: "İmplant sonrası nelere dikkat etmeli, ne yenir?",
      a: `İlk günlerde ılık ve yumuşak besinleri tercih edin; çok sıcak, sert ve çıtır gıdalardan bir süre uzak durun. Sigara ve alkol iyileşmeyi yavaşlatabileceği için erken dönemde önerilmez. Ağız hijyeninize her zamankinden daha çok özen gösterin; hekiminizin tarif ettiği şekilde nazikçe fırçalayın ve gerekirse ağız gargarası kullanın. Dikiş, kontrol ve ilaç kullanımı için randevularınızı aksatmayın. Bu basit alışkanlıklar, implantın sağlıklı kaynaşmasını doğrudan destekler.` },
    { q: "İmplant tedavisinin olası riskleri nelerdir, nasıl önlenir?",
      a: `Her cerrahi işlemde olduğu gibi implant tedavisinde de küçük riskler bulunur; şişlik, geçici hassasiyet veya nadiren enfeksiyon görülebilir. İyi bir planlama, steril koşullar ve hekim önerilerine uyum bu riskleri belirgin biçimde azaltır. Sigara ve ihmal edilen ağız bakımı, implant çevresinde iltihaba (peri-implantitis) zemin hazırlayabilir. Bu nedenle düzenli kontrol ve günlük temizlik büyük önem taşır. Olası bir sorunu erken fark etmek, çözümü de kolaylaştırır.` },
    { q: "İmplant üstüne hangi diş kaplaması gelir?",
      a: `Kaplama seçimi, dişin ağızdaki konumuna ve estetik beklentinize göre değişir. Görünür ön bölgede ışığı doğal geçiren <a href="/hizmet/zirkonyum-dis-kaplama/">zirkonyum kaplama</a> ya da cam seramik öne çıkar. Arka bölgede ise çiğneme kuvvetine dayanıklı monolitik seçenekleri tercih ederiz. Birden fazla implant söz konusuysa, renk ve form uyumu için <a href="/hizmet/gulus-tasarimi/">gülüş tasarımı</a> süreci devreye girer. Böylece implant üstü dişleriniz, doğal dişlerinizle bütünlük içinde görünür.` },
    { q: "Diş implantının ömrü ne kadardır?",
      a: `İyi bakılan implantlar uzun yıllar işlev görebilir; birçok durumda bu süre on yılın üzerine çıkar. Kalıcılık büyük ölçüde ağız hijyeninize, sigara alışkanlığınıza ve düzenli kontrollerinize bağlıdır. Günlük fırçalama, diş arası temizliği ve altı ayda bir kontrol implantın sağlığını korur. İmplantın metal kısmı sağlam kalsa bile üzerindeki kaplama zamanla yenilenebilir. Yani ömrü, tedavi kadar tedavi sonrası bakım da belirler.` },
    { q: "İmplantlı hastaya MR (emar) çekilir mi?",
      a: `Titanyum implantlar manyetik değildir; bu nedenle implantlı hastalar genellikle güvenle MR (emar) çektirebilir. Yine de görüntüleme öncesinde ağzınızda implant bulunduğunu ilgili sağlık personeline bildirmeniz doğru olur. Böylece gerekli ayarları yaparak en net görüntüyü elde ederler.` }
  ],
  closing: `Uygunluğunuzu netleştirmenin en sağlıklı yolu, muayene ve tomografiye dayalı bir ön değerlendirmedir. Sorularınız için <a href="/iletisim/">İletişim</a> sayfamızdan bize ulaşabilirsiniz.`,
  editor: { date: "24.07.2026", name: "Dt. [Ad Soyad]" }
};
</script>
