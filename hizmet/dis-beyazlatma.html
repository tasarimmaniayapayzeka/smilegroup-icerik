  lead: "Diş beyazlatma, dişlerin doğal tonunu kontrollü ağartma maddeleriyle birkaç ton açan estetik bir uygulamadır. Smile Group'ta işlem hekim muayenesiyle başlar; mine ve diş eti sağlığı değerlendirildikten sonra size uygun yöntem belirlenir. Böylece hem doğal görünen bir sonuç hem de diş sağlığının korunması hedeflenir.",
  faqs: [
    { q: "Diş beyazlatma nedir ve nasıl yapılır?", a: `Diş beyazlatma, mine ve dentin katmanındaki renk pigmentlerini ağartma jeliyle çözerek dişleri açan bir işlemdir. Hekim önce dişlerinizi inceler, ardından jeli uygular ve çoğu klinik uygulamasında etkiyi ışık kaynağıyla hızlandırır. Ev tipi yöntemde ise kişiye özel hazırlanan plak ve düşük yoğunluklu jel belirli sürelerle kullanılır. Renklenmenin nedeni ve derecesi kişiden kişiye değiştiği için yöntem seçimi muayeneye bağlıdır.` },
    { q: "Ofis tipi diş beyazlatma mı, evde beyazlatma mı daha uygun?", a: `Ofis tipi diş beyazlatma klinikte hekim kontrolünde yapılır ve genellikle tek ya da birkaç seansta belirgin sonuç verir. Evde uygulanan yöntemde ise size özel hazırlanan ısırma plağı ve daha düşük yoğunluklu jel kullanılır; sonuç birkaç haftaya yayılır. Klinik uygulaması, yoğun renklenmelerde ve hızlı sonuç bekleyen kişilerde öne çıkar. Ev yöntemi ise daha kademeli bir açılma sağlar. Hangi seçeneğin size uyduğuna diş yapınız ve beklentiniz doğrultusunda hekiminiz karar verir.` },
    { q: "Diş beyazlatma zararlı mı?", a: `Doğru koşullarda uygulanan diş beyazlatma, mineye kalıcı hasar bırakmayan kontrollü bir işlemdir. Ağartma maddesi hekim gözetiminde ve uygun konsantrasyonda kullanıldığında güvenli kabul edilir. Bilinçsiz ürünler, aşırı sık tekrarlar ya da çürük veya diş eti sorunu varken yapılan uygulamalar hassasiyet ve tahriş riskini artırır. Bu nedenle işlem öncesi ağız sağlığının değerlendirilmesi önemlidir. Gebelik gibi bazı durumlarda uygulama ertelenebilir; kararı muayene sonrası hekiminiz verir.` },
    { q: "Diş beyazlatma kalıcı mı, etkisi ne kadar sürer?", a: `Diş beyazlatma kalıcı değildir; sonuç ortalama altı ay ile iki yıl arasında korunur. Sürenin uzunluğu beslenme alışkanlıkları, sigara kullanımı ve ağız bakımıyla doğrudan ilişkilidir. Kahve, çay ve kırmızı şarap gibi renklendirici içecekler beyazlığın daha çabuk solmasına yol açar. Düzenli fırçalama ve periyodik kontrollerle etki daha uzun sürdürülebilir. İhtiyaç halinde belirli aralıklarla tazeleme uygulaması planlanabilir.` },
    { q: "Diş beyazlatma kaç seans sürer?", a: `Ofis tipi uygulama çoğunlukla 45-60 dakikalık tek seansta tamamlanır, bazı durumlarda ikinci bir seans önerilir. Evde yapılan yöntemde ise plak her gün belirli sürelerle takılır ve tam sonuç genellikle bir ila üç haftada belirginleşir. Renklenmenin derinliği, seans sayısını etkileyen temel unsurdur. Yoğun tetrasiklin lekelerinde ağartma tek başına yeterli olmayabilir. Böyle durumlarda <a href="/hizmet/laminate-veneer/">laminate veneer</a> gibi alternatifler gündeme gelebilir.` },
    { q: "Diş beyazlatma sonrası hassasiyet olur mu?", a: `Diş beyazlatma sonrası geçici hassasiyet görülebilir, ancak bu durum çoğunlukla birkaç gün içinde kendiliğinden geriler. Soğuk ve sıcak gıdalara karşı kısa süreli duyarlılık en sık karşılaşılan etkidir. Hekiminiz şikayeti azaltmak için florür içerikli jeller veya duyarlılık giderici diş macunları önerebilir. İşlemden sonraki ilk günlerde çok sıcak ya da çok soğuk tüketimden kaçınmak konforu artırır. Uzun süren veya şiddetli durumlarda ise kliniğinizle iletişime geçmelisiniz.` },
    { q: "Diş beyazlatma kimlere uygun, kimlere uygun değil?", a: `Diş beyazlatma, diş ve diş eti sağlığı yerinde olan yetişkinler için uygun bir seçenektir. Sağlıklı minesi bulunan ve dış kaynaklı renklenmesi olan kişiler genellikle memnun edici sonuç alır. Aktif çürük, ileri diş eti hastalığı ya da aşırı mine aşınması varsa önce bu sorunların tedavisi gerekir. On sekiz yaş altı bireylerde, gebelerde ve emziren annelerde uygulama önerilmeyebilir. Uygunluğunuzu belirlemek yalnızca klinik muayeneyle mümkündür.` },
    { q: "Kaplama ve dolgulu dişlerde beyazlatma yapılır mı?", a: `Beyazlatma yalnızca doğal diş dokusunda etki eder; kaplama, dolgu ve protezlerin rengini değiştirmez. Bu nedenle ön bölgede <a href="/hizmet/zirkonyum-dis-kaplama/">zirkonyum diş kaplama</a> ya da kompozit uygulaması varsa, beyazlatma sonrası renk uyumsuzluğu ortaya çıkabilir. Küçük renk ve şekil farklarında <a href="/hizmet/bonding/">bonding</a> ile düzeltme tercih edilebilir. Mevcut restorasyonların yeni tona uyumlanması gerekebilir. Bu planlamayı hekiminiz baştan yaparak beklenmedik sonuçların önüne geçer.` },
    { q: "Diş beyazlatma öncesi nelere dikkat edilmeli?", a: `Diş beyazlatmadan önce dişlerin temiz ve sağlıklı olması, sonucun kalitesini doğrudan etkiler. Hekim; plak, tartar ve yüzey lekelerini kontrol eder, gerekirse önce <a href="/hizmet/dis-tasi-temizligi/">diş taşı temizliği</a> uygular. Çürük veya diş eti iltihabı tespit edilirse bunlar ağartmadan önce tedavi edilir. İşlemin hemen öncesinde renklendirici gıdalardan bir süre uzak durmak da faydalı olur. Bu hazırlık adımları jelin mineye daha eşit etki etmesini sağlar.` },
    { q: "Diş beyazlatma gülüş estetiğiyle nasıl birleştirilir?", a: `Diş beyazlatma, kapsamlı bir estetik planın parçası olarak gülüş görünümünü belirgin biçimde tazeler. Yalnızca renk değil, dişlerin şekli ve dizilimi de gülüşün algısını etkiler. Renkle birlikte biçim de değişmeliyse <a href="/hizmet/gulus-tasarimi/">gülüş tasarımı</a> kapsamında bütünsel bir plan oluşturulur. Küçük şekil kusurlarında ise <a href="/hizmet/estetik-kompozit-dolgu/">estetik kompozit dolgu</a> desteği tercih edilebilir. Hangi kombinasyonun size uygun olduğunu hekiminiz yüz hatlarınıza göre değerlendirir.` }
