    { q: "Hemen yükleme implant nedir?", a: `Hemen yükleme implant, çene kemiğine yerleştirilen implantın üzerine kısa süre içinde geçici bir dişin sabitlenmesini ifade eder. Klasik uygulamada implantın kemikle kaynaşması beklenir; bu yöntemde ise uygun vakalarda bekleme süresi belirgin biçimde kısalır. Böylece hasta, tedavi sürecini dişsiz geçirmek zorunda kalmaz. Ancak bu yaklaşım her ağız yapısına uymaz ve titiz bir ön değerlendirme ister. Sürecin temelini anlamak için <a href="/hizmet/dis-implanti/">diş implantı</a> sayfasındaki bilgiler yol gösterir.` },

    { q: "Klasik implanttan farkı nedir?", a: `Temel fark, dişin takılma zamanlamasında ortaya çıkar. Klasik yöntemde implant kemikle kaynaşana kadar birkaç ay beklenir; hemen yüklemede ise geçici diş çok daha erken bağlanır. İkisinde de nihai hedef, sabit ve işlevsel bir dişe ulaşmaktır. Zamanlama değişse de osseointegrasyon, yani kemik kaynaşması yine tamamlanmalıdır. Hangi yöntemin uygun olduğunu hekim, kemik durumunu ve genel sağlığı değerlendirerek belirler.` },

    { q: "İşlem sonrası nelere dikkat edilmeli?", a: `İşlemin ilk günlerinde geçici dişe binen kuvveti azaltmak önem taşır. Yumuşak gıdalar tercih edilmeli, sert kabuklu ve yapışkan besinlerden uzak durulmalıdır. Ağız hijyenini korumak, diş eti sağlığını ve kaynaşma sürecini destekler. Sigara ve alkol iyileşmeyi olumsuz etkileyebilir. Hekimin önerdiği kontrol randevularına düzenli gitmek, olası sorunların erken fark edilmesini sağlar.` },
    { q: "İyileşme süreci nasıl ilerler?", a: `İyileşme, implantın çene kemiğiyle kaynaşmasıyla adım adım ilerler. Bu süreç genellikle birkaç ay sürer ve kişiden kişiye değişir. İlk haftalarda hafif şişlik veya hassasiyet görülebilir; bu durum çoğunlukla geçicidir. Kemik yoğunluğu, ağız bakımı ve genel sağlık iyileşme hızını etkiler. Sürecin sağlıklı ilerlemesi; düzenli kontroller ve hekim önerilerine uyumla yakından bağlantılıdır.` },
