  faqs: [
    { q: "Çoklu (köprülü) implant nedir?", a: `Çoklu implant, yan yana birden fazla eksik dişin implant destekli bir köprüyle tamamlanmasıdır. Çene kemiğine yerleştirilen implantlar, üzerlerine sabitlenen köprünün taşıyıcı ayaklarını oluşturur. Böylece aradaki dişler için ayrı implant açmaya gerek kalmaz. Tekli boşluklarda uygulanan <a href="/hizmet/dis-implanti/">diş implantı</a> mantığı, burada birden çok dişi kapsayacak şekilde genişletilir. Sonuçta hem estetik hem de çiğneme işlevi birlikte geri kazanılır.` },
    { q: "Köprülü implant kaç eksik diş için uygundur?", a: `Köprülü implant, genellikle yan yana iki ya da daha fazla dişin eksik olduğu durumlarda tercih edilir. Tek bir dişin kaybında çoğunlukla <a href="/hizmet/tek-dis-implanti/">tek diş implantı</a> yeterli olur. Ancak boşluk büyüdükçe her dişe ayrı implant koymak yerine köprü çözümü daha pratik hale gelir. Kaç dişin bu yöntemle tamamlanacağını, ağız içi muayene ve röntgen sonrasında hekim belirler. Çenenin tamamı dişsizse <a href="/hizmet/all-on-4/">All-on-4</a> gibi farklı yaklaşımlar da değerlendirilebilir.` },
    { q: "İmplant üstü köprü ile klasik köprü arasındaki fark nedir?", a: `En temel fark, köprünün nereye dayandığıdır. Klasik köprüde boşluğun iki yanındaki sağlam dişler aşındırılır ve köprüye ayak yapılır. İmplant üstü köprüde ise destek, komşu dişlerden değil çene kemiğine yerleştirilen implantlardan gelir. Bu sayede sağlıklı dişler törpülenmeden korunur. Diş desteğine dayanan <a href="/hizmet/kron-kopru/">kron köprü</a> uygulaması yine de birçok durumda geçerli bir seçenektir. İki yöntem arasındaki tercihi ağız yapınız ve komşu dişlerin durumu belirler.` },
    { q: "Çoklu implant için kaç adet implant gerekir?", a: `Gerekli implant sayısı, eksik diş sayısına ve kemik durumuna göre değişir. Örneğin üç dişlik bir boşluk, çoğu zaman iki implant üzerine kurulan bir köprüyle kapatılabilir. Her eksik dişe bire bir implant yerleştirmek her zaman gerekli değildir. Planlama sırasında çenenin taşıma kapasitesi ve dişlerin konumu birlikte incelenir. Uygun sayı, tomografi ve muayene bulgularına göre kişiye özel olarak belirlenir.` },
    { q: "Köprülü implant tedavisi kaç aşamada tamamlanır?", a: `Tedavi genellikle birkaç aşamada ilerler. İlk randevuda muayene, görüntüleme ve planlama yapılır. Ardından implantlar cerrahi olarak çene kemiğine yerleştirilir. İyileşme sürecinde implantların kemikle kaynaşması beklenir; bu dönem kişiden kişiye farklılık gösterir. Kaynaşma tamamlandığında ölçü alınır ve köprü sabitlenir. Toplam süre, kemik durumuna ve ek işlem gerekip gerekmediğine bağlı olarak değişir.` },
    { q: "Yetersiz kemik varsa köprülü implant yapılabilir mi?", a: `Kemik hacmi yetersiz olduğunda çoğu durumda ön hazırlıkla tedavi yine mümkün olur. Eksik dişler uzun süre tamamlanmadığında çene kemiği zamanla erir. Böyle durumlarda implant öncesinde <a href="/hizmet/kemik-grefti/">kemik grefti</a> uygulanarak zemin güçlendirilebilir. Kemiğin miktarı ve yoğunluğu tomografiyle ölçülür. Uygun bir tedavi planının çıkarılması, bu bulguların hekim tarafından değerlendirilmesine bağlıdır.` },
    { q: "Köprülü implantın avantajları nelerdir?", a: `En belirgin avantaj, sabit ve doğala yakın bir çözüm sunmasıdır. Köprü çene kemiğine dayandığı için çiğneme sırasında güçlü bir destek sağlar. Takılıp çıkarılan protezlerin aksine ağızda sabit durur. Ayrıca komşu sağlıklı dişlerin aşındırılmasına çoğu durumda gerek kalmaz. Konuşma ve gülümseme gibi günlük işlevler de doğal biçimde geri kazanılır.` },
    { q: "Köprülü implantın ömrü ne kadardır?", a: `İmplant destekli köprüler, doğru bakımla uzun yıllar sağlıklı biçimde kullanılabilir. Ömrü etkileyen başlıca etkenler ağız hijyeni, düzenli kontroller ve genel sağlık durumudur. Sigara ve diş sıkma gibi alışkanlıklar süreci olumsuz etkileyebilir. Düzenli muayenelerle olası sorunlar erken fark edilir. Yine de her hasta için sabit bir süre vermek doğru olmaz; kullanım koşulları sonucu belirler.` },
    { q: "İmplant destekli köprü nasıl temizlenir?", a: `Temizlik, günlük fırçalama ve diş arası bakımının birleşiminden oluşur. Köprünün altında kalan bölge, ara yüz fırçaları veya köprü altı ipleriyle temizlenmelidir. Bu bölgede biriken plak, dişeti sağlığını doğrudan etkiler. Hekiminizin önerdiği aralıklarla yapılan profesyonel temizlik de bakımın bir parçasıdır. Düzenli bakım, hem köprünün hem de çevresindeki dokuların sağlığını korur.` }
