  faqs: [
    { q: "Tek diş implantı nedir?", a: `Tek diş implantı, kaybedilen bir dişin yerine tek başına yerleştirilen yapay diş kökü ve üzerine yapılan kaplamadır. Çene kemiğine yerleştirilen titanyum vida, doğal kökün görevini üstlenir. Kemikle kaynaştıktan sonra üzerine bir kron tamamlanır ve boşluk kapanır. Komşu dişlerin aşındırılmasına gerek kalmadan tek dişi yeniden kazandırır. Genel <a href="/hizmet/dis-implanti/">diş implantı</a> ilkeleriyle aynı temele dayanır; farkı yalnızca tek bölgeye odaklanmasıdır. Hekim, ağız yapınızı değerlendirerek uygunluğunuzu belirler.` },
    { q: "Tek diş eksikliğinde implant mı köprü mü tercih edilmeli?", a: `Tek diş eksikliğinde implant, komşu dişlere zarar vermediği için çoğu durumda öne çıkar. Köprü seçeneğinde yanlardaki sağlam dişler aşındırılır; implant ise yalnızca boşluğa uygulanır. Bu yönüyle komşu dişleri korur ve kemiğin erimesini yavaşlatır. Yine de her ağız yapısı farklıdır. Kemik hacmi, dişeti sağlığı ve genel durumunuz kararı etkiler. <a href="/hizmet/kron-kopru/">Kron köprü</a> tedavisi bazı hastalarda daha pratik olabilir. Hangi yöntemin size uyduğunu hekiminiz muayene ve röntgen sonrası birlikte planlar.` },
    { q: "Tek diş implantı nasıl yapılır, aşamaları nelerdir?", a: `Tek diş implantı, planlama ile başlayan birkaç aşamalı bir tedavidir. Hekim önce ağzınızı muayene eder ve tomografi ile kemiği inceler. Ardından lokal anestezi altında titanyum vidayı çene kemiğine yerleştirir. Vida kemikle kaynaşırken (osseointegrasyon) birkaç ay beklenir. İyileşme tamamlanınca ölçü alınır ve üstyapı hazırlanır. Son aşamada kaplama vidaya sabitlenir ve diş göreve hazır olur. Estetik bölgelerde <a href="/hizmet/zirkonyum-dis-kaplama/">zirkonyum diş kaplama</a> doğal bir görünüm sağlar. Tüm süreci hekiminiz adım adım yönlendirir.` },
    { q: "Tek diş implant tedavisi ne kadar sürer?", a: `Tek diş implant tedavisi genellikle birkaç ay içinde tamamlanır. İmplant vidasının yerleştirilmesi çoğunlukla yarım saatlik bir işlemdir. Asıl süreyi, vidanın kemikle kaynaşması için beklenen iyileşme dönemi belirler. Bu dönem alt çenede yaklaşık iki ilâ üç ay, üst çenede ise biraz daha uzun olabilir. Kemik ve dişeti sağlığınız bu takvimi değiştirir. Bazı uygun vakalarda <a href="/hizmet/hemen-yukleme-implant/">hemen yükleme implant</a> ile süre kısalabilir. Kesin zaman planını hekiminiz size özel olarak çıkarır.` },
    { q: "Tek diş implantı ağrır mı?", a: `Tek diş implantı işlemi lokal anestezi altında yapıldığı için sırasında ağrı hissedilmez. İşlem boyunca bölge tamamen uyuşturulur ve hasta rahat eder. Etkinin geçmesiyle hafif bir sızı veya şişlik görülebilir; bu durum birkaç gün içinde geriler. Hekiminizin önerdiği ağrı kesiciler bu dönemi konforlu kılar. Soğuk uygulama ve dinlenme iyileşmeyi destekler. Çoğu hasta ertesi gün günlük yaşamına döner. Beklenmedik bir şikâyette hekiminizle iletişime geçmeniz doğru olur.` },
    { q: "Tek diş implantı için kemik yeterli mi?", a: `Tek diş implantı için çene kemiğinin belirli bir yoğunlukta ve hacimde olması gerekir. Diş uzun süre eksik kaldığında bölgedeki kemik zamanla erir. Hekim, tomografi ile kemik miktarını ölçer ve implantın sağlam tutunacağından emin olur. Kemik yetersizse önce güçlendirme yapılır. Bu amaçla uygulanan <a href="/hizmet/kemik-grefti/">kemik grefti</a> eksik hacmi tamamlar ve zemini hazırlar. Greft sonrası iyileşme beklenir, ardından implant yerleştirilir. Kemik durumunuzun uygunluğunu yalnızca hekiminiz muayeneyle değerlendirir.` },
    { q: "Tek diş implantının ömrü ne kadardır?", a: `Tek diş implantı, doğru bakım ve düzenli kontrolle uzun yıllar işlevini korur. Titanyum vida, ağız içi koşullarına dayanıklı bir malzemedir. Ömrünü belirleyen asıl etken günlük ağız hijyeni ve dişeti sağlığıdır. Düzenli fırçalama, diş ipi kullanımı ve hekim kontrolleri implantın çevresini sağlıklı tutar. Sigara ve ihmal edilen bakım süreyi kısaltabilir. Üstteki kaplama zamanla yenilenebilse de implant kökü kalıcı olarak yerinde kalır. Bakım alışkanlıklarınız sonucu doğrudan etkiler.` },
    { q: "Ön diş implantı nasıl yapılır?", a: `Ön diş implantı, gülüş estetiğini doğrudan etkilediği için daha hassas bir planlama ister. Hekim, dişeti çizgisini ve komşu dişlerin rengini gözeterek işlemi tasarlar. İmplant vidası uygun açıyla yerleştirilir; böylece kaplama doğal bir çıkış profili kazanır. İyileşme döneminde geçici bir diş estetiği koruyabilir. Kalıcı aşamada renk ve form komşu dişlerle uyumlanır. Bu bölgede ışığı doğal yansıtan kaplamalar tercih edilir. Ön bölge tedavisinin ayrıntılarını hekiminiz yüz hatlarınıza göre planlar.` },
    { q: "Tek diş implantı bakımı nasıl olmalı?", a: `Tek diş implantının bakımı, doğal dişlerinkine benzer ve düzenlilik ister. İmplant bölgesini günde iki kez yumuşak fırçayla temizlemeniz gerekir. Diş ipi veya arayüz fırçası, kaplamanın çevresindeki artıkları uzaklaştırır. Dişeti sağlığı implantın uzun ömrü için belirleyicidir; bu yüzden kanama veya şişliği ihmal etmeyin. Hekiminizin önerdiği aralıklarla kontrole gitmeniz erken uyarı sağlar. Profesyonel temizlik, gözle görülmeyen birikimleri giderir. Bakım rutininizi hekiminizle birlikte ağzınıza göre şekillendirin.` }
