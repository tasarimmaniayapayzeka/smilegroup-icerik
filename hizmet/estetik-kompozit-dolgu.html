    { q: "Estetik kompozit dolgu nedir?", a: `Estetik kompozit dolgu, diş renginde reçine esaslı bir malzemeyle yapılan modern bir dolgudur. Hekim, çürükten temizlenen boşluğu katman katman doldurur ve her katmanı özel bir ışıkla sertleştirir. Malzemenin doğal ton seçenekleri sayesinde dolgu, komşu dişlerle uyum sağlar. Böylece hem ön hem arka dişlerde estetik bir sonuç elde edilir. Yalnızca küçük şekil düzeltmeleri gerektiğinde ise <a href="/hizmet/bonding/">bonding</a> yöntemi öne çıkar.` },

    { q: "Estetik kompozit dolgu ne kadar dayanır?", a: `Kompozit dolgunun ömrü ağız bakımına ve dişin yerine göre değişir. Düzenli fırçalama ve diş ipi kullanımıyla dolgular uzun yıllar işlevini koruyabilir. Sert cisimleri çiğnemek, diş gıcırdatmak veya bakımsızlık ömrü kısaltabilir. Arka dişlerde çiğneme yükü fazla olduğundan aşınma daha erken görülebilir. Kontrollerde hekim, dolgunun durumunu değerlendirir ve gerektiğinde yeniler. Düzenli <a href="/hizmet/dis-tasi-temizligi/">diş taşı temizliği</a> de dolguların çevresini sağlıklı tutar.` },
    { q: "Kompozit dolgu nasıl yapılır?", a: `İşlem çoğu durumda tek seansta tamamlanır. Hekim önce çürüğü temizler ve boşluğu hazırlar. Ardından dişe bağlayıcı bir ajan uygular ve kompozit malzemeyi ince katmanlar halinde yerleştirir. Her katman mavi ışıkla sertleştirilir; bu ışık malzemenin yalnızca donmasını sağlar. Son aşamada dolgu şekillendirilir ve parlatılır. Çürük diş sinirine ulaşmışsa öncesinde <a href="/hizmet/kanal-tedavisi/">kanal tedavisi</a> gerekebilir.` },
    { q: "Kompozit dolgu leke yapar, renklenir mi?", a: `Kompozit dolgular zamanla hafif renklenebilir. Çay, kahve, sigara ve koyu renkli gıdalar bu değişimi hızlandırır. İyi cilalanmış bir dolgu yüzeyi renklenmeye daha dirençli olur. Renk farkı belirginleştiğinde hekim, dolgunun yüzeyini yenileyebilir ya da dolguyu değiştirebilir. Doğal dişlerin tonunu açmak isteyenler için <a href="/hizmet/dis-beyazlatma/">diş beyazlatma</a> ayrı bir seçenektir; ancak dolgular beyazlatıcı maddeden etkilenmez.` },
    { q: "Kimlere estetik kompozit dolgu uygulanır?", a: `Estetik kompozit dolgu, çürük veya küçük kırık nedeniyle madde kaybı olan pek çok kişiye uygulanabilir. Ön dişlerdeki küçük boşlukların kapatılmasında da sıkça tercih edilir. Diş etleri sağlıklı ve çürüğü sınırlı hastalar bu yöntemden hızlı sonuç alır. Çok geniş madde kaybı olan dişlerde ise <a href="/hizmet/inlay-onlay/">inlay onlay</a> gibi laboratuvar üretimi çözümler gündeme gelebilir. Uygunluğu her hasta için hekim ayrı değerlendirir.` },
    { q: "Dolgu sonrası hassasiyet olur mu?", a: `İşlemden sonra kısa süreli hassasiyet görülebilir. Sıcak veya soğuk gıdalarda hafif bir duyarlılık birkaç gün sürebilir ve çoğunlukla kendiliğinden azalır. Bu durum, dişin işleme verdiği doğal bir yanıttır. Hassasiyet artar, uzun sürer veya ağrıya dönüşürse hekime başvurmak gerekir. Çürüğün derinliği, hassasiyet süresini etkileyen önemli bir etkendir.` },
    { q: "Kompozit dolgu sonrası nelere dikkat edilmeli?", a: `Dolgu ışıkla sertleştirildiği için işlemin hemen ardından yemek yiyebilirsiniz. Yine de ilk saatlerde çok sert ve yapışkan gıdalardan kaçınmak yerinde olur. Günlük fırçalama, diş ipi ve düzenli hekim kontrolü dolgunun ömrünü uzatır. Diş sıkma alışkanlığı olanlara gece plağı önerilebilir. İyi ağız bakımı hem dolguyu hem de komşu dişleri korur.` },
    { q: "Ön diş estetiğinde kompozit dolgu mu bonding mi tercih edilir?", a: `İkisi de diş rengi kompozit malzeme kullanır; fark uygulama amacındadır. Kompozit dolgu öncelikle çürük ve madde kaybını onarır. Bonding ise küçük şekil, aralık ve renk düzeltmelerine odaklanır. Daha kapsamlı gülüş değişimi isteyen hastalarda <a href="/hizmet/bonding/">bonding</a> veya porselen çözümler değerlendirilebilir. Doğru yöntem, dişin durumuna ve hastanın beklentisine göre planlanır.` },
