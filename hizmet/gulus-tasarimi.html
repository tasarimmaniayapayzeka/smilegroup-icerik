  lead: "Gülüş tasarımı, dişlerin, diş etlerinin ve dudak çizgisinin yüz hatlarınızla uyumlu biçimde planlandığı bütüncül bir estetik yaklaşımdır. Hekim; diş rengini, boyunu, sıralamasını ve gülümseme oranlarını birlikte değerlendirir, ardından size özel bir yol haritası hazırlar. Aşağıda sürecin nasıl işlediğini, hangi tedavilerin devreye girdiğini ve merak edilen ayrıntıları adım adım açıklıyoruz.",
  faqs: [
    { q: "Gülüş tasarımı nedir ve neyi kapsar?", a: `Gülüş tasarımı, gülümsemenizi oluşturan tüm unsurları tek bir plan altında toplayan estetik bir çalışmadır. Hekim yalnızca dişlere değil; diş eti seviyesine, orta hatta ve dudakların hareketine de bakar. Diş rengi, uzunluğu, biçimi ve aralarındaki simetri bu bütünün parçalarıdır. Uzmanlar bu yaklaşımı <em>smile design</em> olarak da adlandırır. Amaç, yüz oranlarınıza oturan doğal bir sonuç elde etmektir; herkese aynı kalıbı uygulamak değildir. Kişisel beklentiler ve estetik alışkanlıklar da bu planın içinde yer alır.` },
    { q: "Dijital gülüş tasarımı (DSD) nasıl planlanır?", a: `Dijital gülüş tasarımı, fotoğraf ve video kayıtlarınız üzerinden gülümsemenizin bilgisayar ortamında tasarlanmasıdır. Hekim yüz ölçünüzü alır, ağız içi taramayı yazılıma aktarır ve önerilen değişiklikleri ekranda gösterir. Uzmanlar bu yönteme kısaca <em>DSD</em> der. Böylece tedaviye başlamadan önce olası sonucu görebilir, ayrıntıları hekiminizle birlikte konuşabilirsiniz. Dijital plan yol gösterir; ancak nihai kararı ağız yapınızı inceleyen hekim verir. Bu simülasyon, beklentilerle sonucun birbirine yakınlaşmasına yardımcı olur.` },
    { q: "Gülüş tasarımında hangi tedaviler kullanılır?", a: `Gülüş tasarımı, tek bir işlem değil, birden fazla tedavinin bir araya geldiği bir çatıdır. Plana göre <a href="/hizmet/laminate-veneer/">laminate veneer</a>, <a href="/hizmet/zirkonyum-dis-kaplama/">zirkonyum diş kaplama</a> veya <a href="/hizmet/bonding/">bonding</a> devreye girebilir. Renk sorunlarında çoğu zaman <a href="/hizmet/dis-beyazlatma/">diş beyazlatma</a> tek başına yeterli olur. Diş eti seviyesi öne çıkıyorsa hekim <a href="/hizmet/pembe-estetik/">pembe estetik</a> uygulamalarını değerlendirir. Hangi yöntemin seçileceği, dişlerinizin durumuna ve beklentinize göre kişiye özel belirlenir.` },
    { q: "Gülüş tasarımı kimlere uygundur?", a: `Gülüş tasarımı, diş ve diş eti sağlığı uygun olan yetişkinlerde geniş bir kullanım alanı bulur. Renk değişimi, diş aralıkları, kırık veya aşınmış dişler ve hafif çapraşıklıklar sık görülen nedenlerdir. Belirgin sıralama bozukluğu olan kişilerde hekim önce <a href="/hizmet/seffaf-plak/">şeffaf plak</a> tedavisini önerebilir. Aktif diş eti iltihabı ya da çürük varsa bunların öncelikle giderilmesi gerekir. Uygunluğu netleştiren tek yol, ağzınızı inceleyen hekimin değerlendirmesidir.` },
    { q: "Gülüş tasarımında prova (mock-up) aşaması var mıdır?", a: `Evet, birçok planda dişlere kalıcı işlem yapılmadan önce geçici bir prova aşaması uygulanır. Hekim, tasarladığı modeli ağzınıza geçici malzemeyle yerleştirir; yeni gülümsemeyi aynada kendiniz görürsünüz. Bu adıma <em>mock-up</em> denir ve beklentilerin açıkça konuşulmasına olanak tanır. Renk, boy veya biçimle ilgili isteklerinizi bu noktada iletmeniz sonucu doğrudan etkiler. Prova aşaması, olası sürprizleri en aza indiren önemli bir adımdır.` },
    { q: "Gülüş tasarımı ne kadar sürer?", a: `Gülüş tasarımının süresi, seçilen tedavilere ve diş sayısına göre değişir. Yalnızca beyazlatma ve bonding içeren planlar birkaç seansta tamamlanabilir; kaplama içeren çalışmalar ise birkaç haftaya yayılabilir. Hekim ölçü, prova ve uygulama aşamalarını sizin takviminize göre planlar. Kesin süre, ilk muayenede ağız yapınız değerlendirildikten sonra belirginleşir. Adımların doğru sırayla ilerlediği bir süreç, aceleye getirilen bir çalışmadan daha sağlıklı sonuç verir.` },
    { q: "Gülüş tasarımı sonuçları ne kadar kalıcıdır?", a: `Gülüş tasarımının kalıcılığı, uygulanan yönteme ve ağız bakımınıza bağlıdır. Porselen kaplamalar uzun yıllar biçimini koruyabilir; bonding ve beyazlatma ise zamanla yenilenmeye ihtiyaç duyabilir. Gece diş sıkma, sert gıdalar ve düzensiz bakım ömrü kısaltan başlıca etkenlerdir. Düzenli kontroller ve iyi bir temizlik alışkanlığı sonucun korunmasına yardımcı olur. Süre kişiden kişiye değiştiğinden hekiminiz size gerçekçi bir öngörü sunar.` },
    { q: "Gülüş tasarımı ağrılı bir işlem midir?", a: `Gülüş tasarımının çoğu aşaması lokal anestezi altında konforlu biçimde yürütülür. Beyazlatma ve prova gibi adımlar genellikle rahatsızlık vermez; kaplama için diş yüzeyi hazırlanırken bölge uyuşturulur. İşlem sonrasında birkaç gün hafif hassasiyet görülebilir, bu his çoğunlukla kısa sürede geriler. Ağrı eşiği kişiden kişiye farklılık gösterdiği için hekim size uygun konfor yöntemini planlar. Endişelerinizi muayenede paylaşmanız, süreci belirgin biçimde kolaylaştırır.` },
    { q: "Erkeklerde gülüş tasarımı nasıl planlanır?", a: `Erkeklerde gülüş tasarımı, daha köşeli diş formları ve doğal renk tonları gözetilerek planlanır. Hekim, yüz hatlarınıza ve dudak yapınıza göre çok parlak yerine daha doğal bir görünüm hedefleyebilir. Aşınmış ya da kısalmış dişler erkeklerde sık karşılaşılan bir durumdur. Böyle durumlarda boy ve biçim düzeltmesi öne çıkar. Tasarımın cinsiyete ve kişiye göre uyarlanması, sonucun doğal durmasını sağlayan önemli bir ayrıntıdır.` },
    { q: "Gülüş tasarımı sonrası bakım nasıl olmalı?", a: `Gülüş tasarımından sonra düzenli ağız bakımı, sonucun uzun ömürlü olmasını sağlar. Günde iki kez fırçalama, diş ipi kullanımı ve altı ayda bir kontrol temel alışkanlıklardır. Diş sıkma sorunu olan kişilerde hekim gece plağı önerebilir. Aşırı renkli içecekler ve sert gıdalar kaplamaları yorabilir; ölçülü tüketim burada işe yarar. İmplant gibi ek tedaviler yapıldıysa <a href="/hizmet/dis-implanti/">diş implantı</a> bölgesinin bakımı da ihmal edilmemelidir.` }
