    { q: "Pembe estetik nedir?", a: `Pembe estetik, diş etlerinin biçimini, seviyesini ve rengini düzenleyerek gülüşün zeminini iyileştiren tedavilerin ortak adıdır. Dişler beyaz estetiği oluştururken, diş etleri de gülümsemenin pembe çerçevesini kurar. Hekim önce diş eti sağlığını değerlendirir, ardından kişiye özel bir plan hazırlar. Bu yaklaşım, dişlerle diş etleri arasındaki oranı daha uyumlu hâle getirir. Böylece gülümseme bütünsel olarak ele alınır. Kapsamlı planlama için genellikle <a href="/hizmet/gulus-tasarimi/">gülüş tasarımı</a> sürecinden yararlanılır.` },

    { q: "Gummy smile nasıl tedavi edilir?", a: `Gummy smile tedavisi, altta yatan nedene göre şekillenir. Diş eti seviyesi fazlaysa, diş eti kenarı yeniden düzenlenir. Diş boyları kısa görünüyorsa, <a href="/hizmet/kron-boyu-uzatma/">kron boyu uzatma</a> ile dişin görünen bölümü uzatılır. Bazı durumlarda <a href="/hizmet/laminate-veneer/">laminate veneer</a> gibi kaplama tedavileri de plana eklenir. Hekim, yöntemleri tek tek veya birlikte değerlendirir. Böylece kişiye özel bir yol haritası çıkar. Amaç, dudak, diş ve diş eti arasında dengeli bir uyum sağlamaktır.` },
    { q: "Diş eti çekilmesi pembe estetikle düzeltilir mi?", a: `Diş eti çekilmesi, uygun vakalarda cerrahi yöntemlerle iyileştirilebilir. Çekilme, kök yüzeyinin açığa çıkmasına ve zamanla hassasiyete yol açar. Bu durumda açıkta kalan bölge, <a href="/hizmet/dis-eti-cekilmesi-greft/">diş eti çekilmesi ve greft</a> uygulamasıyla kapatılabilir. Hekim önce çekilmenin derecesini ve nedenini inceler. Uygunluk kişiden kişiye değişir. Erken değerlendirme, doku kaybının ilerlemesini önlemeye yardımcı olur.` },
    { q: "Lazerle diş eti şekillendirme nasıl yapılır?", a: `Lazerle diş eti şekillendirme, diş eti kenarının hassas biçimde düzenlendiği bir yöntemdir. Lazer, işlem bölgesinde daha konforlu bir çalışma alanı sağlar. Bu teknik, küçük seviye düzeltmelerinde tercih edilebilir. İşlem sırasında bölge lokal anesteziyle uyuşturulur. Her vaka lazere uygun olmayabilir; bu nedenle yöntem seçimi hekime bırakılır. Uygulamadan önce diş eti sağlığı ayrıntılı biçimde kontrol edilir.` },
    { q: "Diş eti estetiği kimlere uygundur?", a: `Diş eti estetiği, diş eti sağlığı elverişli olan kişilere uygulanabilir. Gülerken diş etleri fazla görünen, diş boyları orantısız kalan veya diş eti kenarı düzensiz olan kişiler bu tedavinin adayıdır. Öncelik her zaman sağlıklı bir zemindir. Bu yüzden iltihap ya da enfeksiyon varsa, önce <a href="/hizmet/dis-eti-hastaligi-tedavisi/">diş eti hastalığı tedavisi</a> planlanır. Hekim, genel ağız durumunu ve kişisel beklentileri birlikte değerlendirir.` },
    { q: "İşlem ağrılı mıdır?", a: `İşlem sırasında bölge lokal anesteziyle uyuşturulduğu için ağrı beklenmez. Uygulama sonrasında hafif bir hassasiyet görülebilir; bu his genellikle kısa sürede geçer. Hekim, gerektiğinde konforu artıracak önerileri sizinle paylaşır. İlk günlerde çok sıcak ve soğuk gıdalardan kaçınmak faydalı olur. Her kişinin iyileşme konforu farklıdır. Bu nedenle takip randevuları önem taşır.` },
    { q: "Pembe estetik sonrası iyileşme süreci nasıl ilerler?", a: `İyileşme süreci, uygulanan yönteme ve düzenlenen doku miktarına göre değişir. İlk günlerde diş etinde hafif kızarıklık ve hassasiyet olabilir. Yumuşak beslenme, bu dönemi belirgin biçimde kolaylaştırır. Ağız bakımına özen göstermek iyileşmeyi destekler. Hekim, düzenli fırçalama ve diş ipi kullanımını önerir. İşlem öncesinde yapılan <a href="/hizmet/dis-tasi-temizligi/">diş taşı temizliği</a> de dokunun sağlıklı iyileşmesine katkı sağlar.` },

    { q: "Pembe estetik sonuçları kalıcı mıdır?", a: `Sonuçların kalıcılığı, kişinin ağız bakımına ve doku yapısına bağlıdır. Düzenli bakım, elde edilen görünümün uzun süre korunmasına yardımcı olur. Yine de dokular zamanla doğal olarak değişebilir. Bu nedenle periyodik kontroller önerilir. Sigara ve yetersiz hijyen, diş eti sağlığını olumsuz etkiler. Hekim, kalıcılığı desteklemek için kişiye özel bakım önerileri sunar.` }
