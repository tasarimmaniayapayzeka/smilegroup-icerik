    { q: "Bonding nedir?", a: `Bonding, diş yüzeyine kompozit reçine adı verilen estetik dolgu maddesinin ince katmanlar hâlinde uygulandığı bir işlemdir. Hekim malzemeyi dişin doğal formuna göre şekillendirir ve özel bir ışıkla sertleştirir. Böylece kırık, aralık ya da renk farkı gibi kusurlar kapatılır. İşlem, dişin kendi dokusundan minimum ödün verilerek yapılır. Daha kapsamlı restorasyon gerektiren durumlarda <a href="/hizmet/estetik-kompozit-dolgu/">estetik kompozit dolgu</a> seçeneği de değerlendirilebilir.` },
    { q: "Bonding kimlere uygulanır?", a: `Bonding, ön dişlerinde küçük çatlak, kırık, diş arası boşluk veya biçim bozukluğu bulunan kişiler için uygundur. Hafif renklenmesini düzeltmek isteyenler de bu yöntemden yararlanabilir. Diş eti sağlığı yeterli ve çürük sorunu bulunmayan hastalarda sonuç daha kalıcı olur. Ağır çapraşıklık ya da ileri renk sorunlarında hekim farklı tedaviler önerebilir. Uygunluk, ağız içi muayenenin ardından kişiye özel biçimde belirlenir.` },
    { q: "Kompozit bonding nasıl uygulanır?", a: `Uygulama genellikle tek seansta tamamlanır. Hekim önce diş yüzeyini temizler ve pürüzlendirici bir jel sürer. Ardından kompozit reçineyi katman katman yerleştirip ışıkla sertleştirir. Son aşamada yüzey parlatılarak doğal bir görünüm elde edilir. Çoğu vakada diş kesimi yapılmaz ve anesteziye gerek kalmaz.` },
    { q: "Bonding işlemi ne kadar sürer?", a: `Tek bir diş için işlem ortalama 30 ila 60 dakika arasında sürer. Süre; dişin durumuna, kusurun büyüklüğüne ve çalışılacak diş sayısına göre değişir. Birden fazla dişte uygulama yapılacaksa seans biraz uzayabilir. Hazırlık aşaması kısa olduğundan hasta aynı gün günlük hayatına döner. Net süreyi muayene sırasında hekiminiz size aktarır.` },

    { q: "Bonding ile laminate veneer arasındaki fark nedir?", a: `En temel fark, kullanılan malzemede ve yöntemde ortaya çıkar. Bonding, doğrudan ağızda kompozit reçineyle şekillendirilir ve çoğunlukla diş kesimi gerektirmez. <a href="/hizmet/laminate-veneer/">Laminate veneer</a> ise laboratuvarda hazırlanan ince porselen tabakaların dişe yapıştırılmasıyla yapılır. Porselen yüzeyler lekelenmeye karşı daha dirençlidir; buna karşın süreç birden çok seans ister. Hangi seçeneğin uygun olduğuna hekim; beklentileriniz ve diş yapınız doğrultusunda karar verir.` },
    { q: "Bonding dişe zarar verir mi?", a: `Bonding, koruyucu diş hekimliği yaklaşımına uygun bir işlemdir ve sağlıklı dokuya çoğu zaman zarar vermez. Birçok vakada dişten madde kaldırılmadığı için doğal yapı korunur. Uygulama öncesinde diş eti ve çürük kontrolü yapılması, süreci daha güvenli kılar. Yanlış bakım ya da aşırı yük altında malzeme kırılabilir; ancak bu durum kolayca onarılır. Hekim, işlem boyunca dişin sağlığını önceler.` },
    { q: "Bonding leke yapar mı?", a: `Kompozit malzeme zamanla çay, kahve, sigara ve benzeri renklendiricilerden etkilenebilir. Bu nedenle bonding sonrası ağız bakımı ve düzenli temizlik önem taşır. Yüzeydeki yüzeysel renklenmeler çoğunlukla parlatma işlemiyle giderilir. Farklı bir renk çözümü arayan hastalar <a href="/hizmet/dis-beyazlatma/">diş beyazlatma</a> yöntemini hekimiyle konuşabilir. Beyazlatmanın bonding öncesinde yapılması, renk uyumu açısından tercih edilir.` },
