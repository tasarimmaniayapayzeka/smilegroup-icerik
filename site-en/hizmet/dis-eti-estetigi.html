  "lead": "A smile isn't just about the teeth — the gum's margin line, height and symmetry from one side to the other shape the visible frame around them. Gum aesthetics is the umbrella term for treatments that address issues such as excess gum showing when you smile, an uneven level on one side, or teeth that look longer because of gum recession. On this page you'll find the logic behind the treatment, its stages, its limits and what recovery involves.",

      "q": "What is gum aesthetics, and is it the same thing as pink aesthetics?",
