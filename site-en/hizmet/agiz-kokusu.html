    {
      "q": "What can bad breath be a sign of?",
      "a": "Halitosis is the medical name for breath that carries an unpleasant odour. It isn't a condition in its own right — it's an outward sign of something else going on. Most of the time that means bacterial load and soft-tissue health inside the mouth; less often, it goes hand in hand with a respiratory or digestive issue. There's no way to tell which cause is behind it from the smell alone; that distinction is made through a clinical examination and imaging where needed."
