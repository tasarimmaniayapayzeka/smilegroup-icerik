  ],
  "lead": "Teeth that overlap, or one tooth that sits further forward than the rest, are among the first things people notice when they look in the mirror — and among the things that bother them most. Crowding isn't a condition in itself; it's a finding that can have several different causes behind it. For some people it's purely a question of appearance, for others it also affects how easy their teeth are to clean and how the bite comes together. This page is designed to help you pin down your concern and see which kind of assessment might suit you.",

    {
      "q": "What exactly does it mean if my teeth look crooked?",
      "a": "In dentistry, this is usually referred to as <em>crowding<\/em>: the teeth don't find enough space as they line up along the jaw, so they shift in front of or behind one another. In some people it's limited to a single rotated tooth; in others, it involves the whole front group of teeth and the bite. The source of the crookedness is sometimes the position of the tooth itself, and sometimes the relationship between the upper and lower jaws — these are not the same thing, and telling them apart requires a clinical examination and imaging."

      "q": "What are the most common causes of dental crowding?",
      "a": "The most common cause is a mismatch between tooth size and jaw width — when teeth are inherited as larger than average and the jaw is narrow, there's less room for them to line up in. Losing baby teeth early to decay or trauma can let the back teeth drift forward, narrowing the space left for the permanent tooth. Prolonged thumb-sucking, tongue thrusting, dummy use, and mouth-breathing caused by a blocked nose are other well-known contributing factors. Pressure from erupting wisdom teeth is also debated as a possible cause."

      "q": "Why do teeth start shifting later on in adulthood?",
      "a": "Crowding doesn't always start in childhood. A slow tightening of the lower front teeth over the years is common and is linked to chewing forces and changes in the supporting tissues. When a lost tooth's space isn't managed, the neighbouring teeth tip into the gap, the opposing tooth over-erupts, and the alignment is thrown off. People who've previously had orthodontic treatment and then stopped wearing their retainer also tend to see their teeth drift back towards their original position."

      "q": "Is this purely a cosmetic issue, or does it affect oral health too?",

      "q": "What symptoms can go along with crooked teeth?",
      "a": "Consistently missing the same spots when you brush, tartar that keeps building up in the same area, and bleeding during cleaning are commonly reported findings. Some people also notice that their teeth don't seem to meet properly when biting, chew mainly on one side, or keep biting their cheek. Noticeable wear on the front teeth, morning jaw tiredness, and difficulty with certain sounds are also worth paying attention to."
    },

      "q": "When should I see a dentist — are there any signs considered urgent?",

      "q": "What can I do at home, and what should I never attempt?",

      "q": "Which treatments might be considered?",
