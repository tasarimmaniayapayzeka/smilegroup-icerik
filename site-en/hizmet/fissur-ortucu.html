  "lead": "The chewing surfaces of the back teeth have grooves that are too narrow and deep for a toothbrush bristle to reach. A fissure sealant is a preventive treatment that fills these grooves with a flowable material, cutting down on bacteria and food build-up. It's most often used on newly erupted permanent molars.",

      "q": "What is a fissure sealant, and what does it do?",
      "a": "In dentistry, a <em>fissure<\/em> is the narrow, deep groove that runs between the cusps on the enamel surface. These grooves are often finer than a hair — a bristle can't get in, but bacteria can. The dentist flows a resin-based or glass-ionomer-based material into the grooves; resin sealants are then set hard with a curing light, while some glass-ionomer versions set on their own. The surface is left flatter and easier to keep clean by brushing. The idea is to physically seal off the at-risk area before decay has a chance to start."

      "q": "Who is it used for, and at what age?",
      "a": "In children, the first target is usually the six-year molar. This tooth comes through at the very back of the mouth at around age six, without any baby tooth having to fall out first — many parents mistake it for a baby tooth and put off having it checked. The right time to seal it is once the tooth has fully come through and can be kept dry and isolated from saliva. The same timing principle applies to the second permanent molars, which erupt at around age twelve. Waiting a few months while a tooth is only partly through reduces the risk of placing a sealant that will need redoing soon after. The dentist times the appointment around the child's eating habits and how well they can cooperate with brushing."

      "q": "What steps does the application involve?",

      "q": "What's the difference between a filling and a fissure sealant?",
      "a": "The two procedures come in at different points. A fissure sealant covers a sound surface before any cavity has formed, and the dentist doesn't remove any tooth structure. A <strong>filling<\/strong>, on the other hand, requires decayed tissue to be cleaned out and the resulting space reshaped — so it's used for a different indication. If there's a limited amount of decay right at the base of a groove, the dentist may do a small amount of preparation and then place a sealant — this approach is known as an extended fissure sealant. In short, a sealant is preventive; a <a href=\"/en/hizmet/dolgu/\">filling<\/a> is restorative."

      "a": "Partial or complete loss of the material over time is the most common problem, and it isn't rare. Children often don't notice when a sealant has come off, since it doesn't create any obvious sensation, so it usually only comes to light at a routine check-up. A partially lost sealant can leave a rough edge where plaque tends to build up more. If the area under a lost piece goes unnoticed, decay can progress underneath without being spotted. Working in a damp field weakens the bond, so the sealant comes away sooner. Material left slightly high can cause discomfort when chewing, and the child may start avoiding chewing on that side. If there's undetected decay underneath, the sealant will simply cover it and the problem can go quiet for a while — which is why the dentist takes an X-ray first if a groove looks suspicious. Marked sensitivity to resin-based materials is very rare, but do mention any known allergy to your dentist."
