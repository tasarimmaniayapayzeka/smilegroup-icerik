  "lead": "When you're missing several teeth in a row, it isn't always necessary to place a separate implant for every gap. Multiple-tooth implant-supported bridge treatment aims to build a single restoration resting on fewer implants than the number of teeth being replaced. The questions below cover what the technique involves, how it's carried out, its limitations, its risks, and what aftercare it needs.",
  "faqs": [
    {
      "q": "What is a multiple-tooth implant-supported bridge?",
      "a": "The key question with this design isn't how many teeth are missing, but how many supporting posts can carry that span. A multiple-tooth implant bridge is a treatment approach where a run of adjacent gaps is closed with a single fixed restoration. Your dentist places implants only at the points chosen to act as supports within the gap, then rests the bridge on these posts. There are no implants under the teeth in between — these are carried by the body of the bridge, known as the <em>pontic<\/em>. This distinction has a practical consequence: chewing force is transmitted to the bone only at the implant sites, so the bone under the pontic receives no such stimulation and can continue to lose volume there. The technique is also commonly known as an <em>implant-supported bridge<\/em>. The aim is to restore chewing function and comfortable speech with a fixed structure."

      "q": "When is an implant-supported bridge chosen over a single tooth implant or full-mouth treatment?",
      "a": "Three separate approaches tackle the same kind of gap from different angles, so where's the line drawn? If there's just one gap, a <a href=\"/en/hizmet/tek-dis-implant/\">single tooth implant<\/a> may be enough. If the jaw is completely edentulous, or the support from the remaining teeth is severely compromised, <a href=\"/en/hizmet/full-agiz-implant/\">full-mouth implant treatment<\/a> or the <a href=\"/en/hizmet/all-on-4/\">All-on-4 technique<\/a> comes into play. An implant-supported bridge sits between the two: several teeth are missing in a row, but there are still sound, restorable teeth elsewhere in the jaw. A conventional tooth-supported <a href=\"/en/hizmet/porselen-kron-kopru/\">porcelain crown and bridge<\/a>, by contrast, relies on a different support principle, where neighbouring teeth carry the span. This design is considered particularly when the last teeth at the back have been lost and there's no tooth left behind the gap to anchor a conventional bridge — what's known as a free-end saddle, one of the situations where an implant-supported bridge often comes up. The rough rule is this: if the remaining teeth can carry the chewing load, a localised bridge is favoured; if they can't, a full-mouth plan takes priority. The threshold is set not just by the number of missing teeth, but by how much bone support the remaining teeth have."

      "q": "How is an implant-supported bridge carried out?",
      "a": "Your dentist starts with a detailed examination and a 3D scan, choosing implant positions to work as the bridge's supporting posts. At the surgical appointment, the area is numbed, and in most cases several implants are placed into the bone in the same session. During healing, a temporary bridge that doesn't load the implants is generally used to close the gap in appearance and function. In some cases, if the implants show sufficient <em>primary stability<\/em> at that first session, your dentist may bring forward an implant-supported temporary bridge instead — a decision that depends on bone density and the stability measured during surgery. Once fusion is complete, an impression is taken from all the supporting implants together, since the bridge will sit on every post at once. At the framework try-in, your dentist checks for a passive fit: the bridge needs to sit in place without putting strain on any one post. If the fit isn't right, the framework is sectioned, soldered back together, or remade. In the final stage, your dentist secures the bridge with screws or cement and schedules the first check-up."

      "q": "What are the risks and possible complications?",
