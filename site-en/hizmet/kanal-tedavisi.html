  "lead": "When deep decay or an injury reaches the core of a tooth, dentists follow a path aimed at saving it rather than taking it out. This field, known as endodontics, deals with cleaning and filling the root canals. On this page, you'll find the stages of treatment, how many appointments it takes, why a crown is often needed afterwards, and the possible risks.",
  "faqs": [
    {
      "q": "What is root canal treatment, and what happens inside the tooth?",
      "a": "Beneath the tooth's hard outer layers sits the <em>pulp<\/em>, the tissue that holds its blood vessels and nerves. When decay or an injury reaches this tissue, inflammation sets in. Your dentist removes the damaged tissue from the root canals, cleans and shapes the canals, and seals them with a biocompatible filling material. The aim is to stop the infection and keep the tooth in your mouth."
    },
    {
      "q": "What symptoms point to a need for root canal treatment?",
      "a": "Prolonged sensitivity to hot and cold, throbbing that starts on its own, pain that gets worse at night, and discomfort when pressure is put on the tooth are all common warning signs. Pain triggered by a hot drink and eased by cold water is another typical finding. Gum swelling, an abscess, or a tooth darkening in colour all point towards a problem with the pulp. In some cases there are no symptoms at all, and the problem only shows up on a routine X-ray. Our <a href=\"/en/hizmet/disim-agriyor/\">my tooth hurts<\/a> and <a href=\"/en/hizmet/disim-sizliyor/\">my tooth is sensitive<\/a> pages go into these complaints in more detail."
    },
    {
      "q": "Who is it suitable for, and which teeth is it used on?",
      "a": "Teeth with fully formed roots, adequate bone support around them, and enough structure left to carry a sound restoration afterwards are suitable for this treatment. A different approach is taken with baby teeth. The outlook is better for teeth where any crack doesn't extend down into the root surface, that aren't mobile, and that still have a solid connection to the jawbone. Gum health and the bone support around the root are also part of the assessment. Molars can be treated just as readily as front teeth."
    },
    {
      "q": "What are the stages of treatment?",
      "a": "Your dentist first studies the canal anatomy on an X-ray and numbs the area. A rubber sheet is then placed to keep the tooth free of saliva — this isolation is there to stop bacteria in the mouth reaching the canal. After removing the decayed tissue and reaching the pulp chamber, they clean and widen the canals to a set working length using fine instruments called files. The canal length is confirmed with an apex locator device and an X-ray. Throughout this stage, the canals are flushed with disinfectant solutions. Once the canals are dry, the root filling material is placed to create a watertight seal. In the final step, the top of the tooth is closed with either a temporary or permanent <a href=\"/en/hizmet/dolgu/\">filling<\/a>. The root canal stage ends here — the restoration on top of the tooth is planned as a separate step, and in back teeth this usually means a full-coverage restoration, covered in more detail under the crown question below."
    },
    {
      "q": "How many appointments does it take, and how long does each one last?",
      "a": "For single-rooted teeth with limited inflammation, treatment is usually completed in one appointment. Teeth where the inflammation has spread into the bone, where there's an abscess, or where the canals are curved may need two or three appointments. Between visits, your dentist places an antibacterial dressing in the canals and seals the tooth with a temporary filling. A single appointment generally lasts between thirty and ninety minutes. Because molars can have three or four canals, appointment times for these teeth tend to sit towards the upper end of that range."
    },
    {
      "q": "What does it feel like during treatment — does it hurt?",
      "a": "Because the tooth is numbed with a local anaesthetic, most patients feel pressure and vibration during treatment rather than pain. Keeping your mouth open for a long stretch can leave the jaw muscles feeling tired. In teeth with heavy inflammation, it can be harder to get the area fully numb, and your dentist will try additional anaesthetic techniques to work around this. The numbness itself lasts a few hours after treatment finishes. If you feel uncomfortable at any point, you can raise your hand to ask for a short break."
    },
    {
      "q": "Is pain or throbbing normal afterwards, and how long does it last?",
      "a": "Once the anaesthetic wears off, mild sensitivity lasting a few days is normal. This tenderness, which is most noticeable when chewing or touching the tooth, usually eases within two to seven days. Painkillers recommended by your dentist can help you get through this period comfortably. If you notice a distinct high spot when biting, the filling may need adjusting. Swelling, fever, difficulty swallowing, or throbbing that keeps getting worse can point to something different — contact the clinic straight away if you notice any of these."
    },
    {
      "q": "Why is a crown recommended in most cases afterwards?",
      "a": "A tooth that's had root canal treatment no longer has its network of blood vessels and nerves, and once you add the access cavity opened to reach them, the tooth's hard structure is reduced and it becomes <strong>more prone to fracture<\/strong>. At the back of the mouth, where chewing force is at its highest, a filling on its own often can't provide enough strength. That's why a full-coverage <a href=\"/en/hizmet/kaplama/\">crown<\/a> is recommended for premolars and molars. A crown works by capping the remaining structure and spreading chewing force across the tooth. On front teeth, where less structure has usually been lost, a composite restoration can be enough on its own. Depending on how much tooth structure remains, <a href=\"/en/hizmet/porselen-kron-kopru/\">porcelain crown<\/a> options are considered. In some cases, a post placed inside the canal provides extra support for the restoration on top. The type of restoration and its timing are planned around where the tooth sits in the mouth, how many sound walls remain, and how it meets the opposing teeth. Leaving a tooth with a temporary restoration for too long sets the stage for leakage and cracking."
    },
    {
      "q": "What are the risks and possible complications?",
      "a": "Like any treatment, endodontics has its limits. Possible complications include a file breaking inside the canal, perforation of the root wall, filling material extending beyond the root tip, and an extra canal that goes unnoticed. In lower molars, numbness can develop because the root tips sit close to the nerve; this is uncommon, but in some cases it can last a long time or become permanent. If irrigation solution is pushed beyond the root tip, it can irritate the surrounding tissue. Months after treatment, inflammation at the root tip can flare up again. A tooth left fragile without a proper restoration can crack down through the root and become impossible to save. To reduce these risks, tell your dentist about any medication you're taking, and keep up with your X-ray follow-ups."
    },
    {
      "q": "When is it not carried out, or postponed?",
      "a": "A vertical crack running down the length of the root, advanced bone loss, a tooth too broken down to carry a restoration afterwards, and canals that are anatomically blocked can all make treatment unviable. In these cases, your dentist raises other options, such as extraction followed by a prosthetic replacement. Treatment may be postponed in situations such as active, uncontrolled infection, recent heart surgery, very limited mouth opening, or late-stage pregnancy. For patients on blood thinners or with a suppressed immune system, your dentist plans extra precautions before treatment."
    },
    {
      "q": "What's the difference between root canal treatment and tooth extraction?",
      "a": "Root canal treatment aims to keep your natural tooth in place; extraction removes a tooth that can't be saved. Because a natural tooth root stimulates the jawbone, keeping the tooth helps maintain bone volume in that area. After an extraction, filling the gap with an implant or a bridge comes into the picture, and that process is spread across several stages. Root canal treatment concerns a single tooth, whereas a post-extraction plan can also involve the neighbouring teeth. How much tooth structure remains, how sound the root is, and the bone support available all determine which path is right. Our <a href=\"/en/hizmet/dis-cekimi/\">tooth extraction<\/a> page covers this option in detail."
    },
    {
      "q": "What happens if treatment fails — can it be redone?",
      "a": "Pain that doesn't settle, a recurring sinus tract opening on the gum, and a dark area at the root tip on X-ray that isn't shrinking all suggest that treatment hasn't gone the way it should have. Before deciding on retreatment, your dentist may request an additional X-ray or 3D imaging. In these cases, they remove the old root filling, clean the canals again and refill them — this is called retreatment. Root-end surgery is carried out where needed. Retreatment can take longer than the original procedure, and it isn't possible in every case."
    },
    {
      "q": "What determines how long a treated tooth lasts?",
      "a": "How long the tooth goes on functioning depends on several factors together: how well-sealed the root filling is, whether the restoration on top was fitted promptly and fits well, how much sound structure remains, and gum health. A night-time clenching habit increases chewing load and raises the risk of fracture; a night guard can help reduce that load. A tooth that's had its nerve removed isn't immune to decay and can still develop new decay at its margins. Regular brushing, cleaning between the teeth, and <a href=\"/en/hizmet/dis-tasi-temizligi/\">scale and polish<\/a> appointments all help extend this lifespan."
    },
    {
      "q": "What should you be careful of afterwards?",
      "a": "Don't eat until the numbness has worn off, as you could bite your lip or cheek without noticing. In the first few days, avoid putting too much load on the treated side, and steer clear of hard, sticky food. If you have a temporary filling, don't miss your follow-up appointment. Smoking slows healing down. Keep brushing and flossing as you normally would."
    }
  ],
