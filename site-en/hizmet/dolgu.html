  "lead": "Tooth decay causes a permanent loss of structure in the enamel and dentine — the body has no way of making up that lost tissue on its own. A filling repairs the cavity left once the decay has been cleaned out, using a suitable material, and restores the tooth's chewing function. This page covers filling treatment for decay, the material options available, the sensitivity that can follow, and how a filling gets replaced over time.",
  "faqs": [
    {
      "q": "What is a filling, and when is one needed?",
      "a": "As decay progresses, it hollows out a cavity in the tooth that fills with bacteria. Your dentist removes the damaged tissue and fills the cavity with a biocompatible material — this is what we mean by a filling. The aim is to keep the tooth functioning normally and to slow the lesion's progress towards the pulp, the tooth's nerve tissue. For very early lesions confined to the enamel, your dentist may decide that monitoring and preventive care are enough on their own. For colour and shape corrections done for cosmetic reasons, see our <a href=\"/en/hizmet/estetik-dolgular/\">cosmetic fillings<\/a> page."

      "q": "How is decay cleaned out, and what are the stages of a filling?",
      "a": "Your dentist first works out the true extent of the decay through a clinical examination and, where needed, an X-ray. After a local anaesthetic, they remove the softened dentine with a drill or hand instruments, preserving as much sound tissue as possible. The cavity is then washed, dried, and given a protective lining depending on how deep it is. In cases close to the pulp, they may choose a capping material such as calcium hydroxide. A rubber sheet called a rubber dam may be used for isolation, since composite doesn't bond well to a damp surface. For cavities that involve the contact area between teeth, a matrix band and wedge are placed to shape the contact point and edge with the neighbouring tooth. With composite, your dentist applies an etchant and a bonding agent, builds up the material in thin layers, and hardens each layer separately with a curing light. In the final step, they check the bite with articulating paper, adjust any high spots, and polish the surface — polishing is a step that shouldn't be skipped, since it cuts down on plaque build-up."
    },

      "q": "What types of filling are used?",
      "a": "Composite resin is widely used today, because it matches the natural tooth colour and can be placed in a single visit. Glass ionomer cement releases fluoride and can be placed even where the area can't be kept completely dry, which is why it's used for baby teeth, root-surface decay and temporary restorations. Amalgam, meanwhile, has had its use restricted in many countries following the Minamata Convention, and isn't the material of choice for children or during pregnancy. Alongside these fillings, which are built up in layers directly in the mouth, <a href=\"/en/hizmet/inlay-onlay-dolgular/\">inlay and onlay fillings<\/a> are also part of the material options — these are made in the lab from an impression and then cemented onto the tooth. Shape and colour corrections on front teeth are covered separately under <a href=\"/en/hizmet/bonding/\">bonding<\/a>."
    },
    {
      "q": "Who can have a filling — is it suitable for children too?",
      "a": "A filling can be considered at any age where decay develops, from baby teeth right through to adult teeth. In children, your dentist most often chooses glass ionomer or composite; <a href=\"/en/hizmet/fissur-ortucu/\">fissure sealants<\/a> may also form part of the same preventive plan. In people with poor oral hygiene, your dentist assesses gum health before going ahead with a filling. During pregnancy, the second trimester is generally considered the more suitable time."

      "q": "How long does a filling appointment take?",
      "a": "For a small, single-surface cavity, the procedure is usually completed in twenty to thirty minutes. Restorations that involve several surfaces, including the contact points between teeth, can take up to forty-five minutes. How long it takes is directly related to where the decay is and how deep it goes. The anaesthetic itself can leave your lip and tongue numb for a few hours afterwards. For patients who need several teeth treated, your dentist may split the plan across a few appointments."

      "q": "Why does sensitivity or aching happen after a filling?",
      "a": "Sensitivity to cold and to biting is common in the first few days after treatment, and it usually settles within a few days. The cause is often the heat generated by the drill, exposed dentine tubules, or a bite contact that's been left slightly too high. If there's a high spot, your dentist can adjust the contact in a short appointment, and the complaint usually resolves quickly after that. If the pain gets worse at night, starts on its own, or is triggered by heat, pulp inflammation may be behind it, and <a href=\"/en/hizmet/kanal-tedavisi/\">root canal treatment<\/a> may be needed. We also cover ongoing sensitivity on our <a href=\"/en/hizmet/disim-sizliyor/\">my tooth is sensitive<\/a> page."

      "q": "What should you be careful of, and when can you eat again?",

    },

      "q": "What are the risks and downsides?",

      "q": "What is secondary decay, and how is it spotted?",
