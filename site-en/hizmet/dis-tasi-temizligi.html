  "lead": "Scaling, more commonly known as scale and polish or tartar removal, is a clinical procedure that clears hardened plaque deposits from the tooth surface. It sits under both cosmetic and general dental health, since it affects the appearance of your smile just as much as the health of your gum tissue. The sections below cover the stages of the procedure, the sensitivity that can follow it, and the concerns patients raise most often.",

    {
      "q": "What is scale and polish (scaling)?",
      "a": "Soft bacterial plaque that builds up on the tooth surface hardens within a few days as it mixes with minerals in your saliva, turning into a yellowish layer that brushing alone can't remove. Your dentist clears this layer away in a controlled way, working above the gum line and, where needed, inside the gum pocket too. The aim isn't just to improve appearance — a rough tartar surface makes it easier for bacteria to take hold, which also sets the stage for gum inflammation. That's why this procedure often comes up as the first step when a patient reports <a href=\"/en/hizmet/dis-etim-kaniyor/\">bleeding gums<\/a>."

      "q": "Why does tartar form, and what speeds up the build-up?",
      "a": "Calcium and phosphate in saliva crystallise plaque that's been left in place within a short time, so any area of plaque that isn't cleaned away is a candidate for tartar. The inner surface of the lower front teeth and the cheek-facing surface of the upper molars build up faster, because they sit close to the salivary gland ducts. Smoking, tea and coffee increase both the build-up and the staining. A dry mouth, crowded teeth and skipping interdental cleaning are other common contributing factors. <a href=\"/en/hizmet/dislerimde-lekeler-var/\">Staining on the tooth surface<\/a> is often seen alongside this build-up."

      "q": "What are the stages of cleaning with an ultrasonic device?",
      "a": "Your dentist first examines your gums, pocket depth and how much tartar is present, imaging any build-up below the gum line with an X-ray where needed. The tip of the ultrasonic device then makes contact with the tartar using high-frequency vibration, cracking the hardened layer and lifting it off the surface. A simultaneous flow of water both prevents overheating and clears away the dislodged fragments. Your dentist finishes off any fine deposits left in tight interdental spaces and on root surfaces using hand instruments called <em>curettes<\/em>. Deposits that extend deep into the gum pocket can go beyond the scope of routine scaling; this picture can fall under more extensive gum treatment, which your dentist plans separately. In the final stage, they polish the teeth with a brush and special paste — polishing reduces surface roughness, making it harder for new plaque to take hold. A fluoride gel is added where needed. Local anaesthetic isn't required in most cases."

      "q": "Who is it recommended for, and which symptoms need an appointment?",

      "q": "What are the risks and possible complications?",
