  "lead": "A single missing tooth can, over time, affect your chewing balance and the overall look of your smile. This page explains the scope of single tooth implant treatment, its stages, the possible risks, and what aftercare involves. Click on the heading you're interested in to open that section.",

    {
      "q": "What is a single tooth implant?",
      "a": "An artificial root placed in the jawbone to replace a missing tooth, together with the restoration fitted on top of it, forms a single-unit replacement. The screw positioned in the bone is most often titanium or a titanium alloy; a zirconia option can be considered in some cases too. A restoration made specifically for you is then fitted onto the root — in most cases once healing is complete, though in some suitable cases this happens sooner. What stands out about this method is that the gap is closed with a single unit, without touching the healthy teeth on either side. If more than one tooth is missing side by side, <a href=\"/en/hizmet/coklu-dis-koprulu-implant/\">multiple-tooth implant-supported bridge<\/a> planning comes into play instead."

      "q": "For a single missing tooth, is an implant or a bridge the better choice?",
