  "lead": "Full-mouth implant treatment isn't a single technique. It's an umbrella term for the different implant and denture designs used when a jaw has no natural teeth left at all. On this page, we've brought together which approach suits which situation, how the process unfolds, the healing timeline, and the limitations worth knowing about. Open any of the questions below to go straight to what you're after.",

    {
      "q": "What is full-mouth implant treatment?",
