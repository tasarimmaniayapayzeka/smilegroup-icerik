  "lead": "The gap between your front teeth might have stayed exactly the same for years — or it might have become noticeably wider only in the last few months. These are not the same thing: the first is usually a structural trait, while the second can be a sign of a process affecting the gums. This page is here to help you tell the difference and take the right next step.",

      "q": "Is the gap between my teeth normal, or is it a sign of something?",

      "q": "What causes a gap to form between the teeth?",
