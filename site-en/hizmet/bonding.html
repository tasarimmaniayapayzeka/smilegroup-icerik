  "lead": "Bonding is a cosmetic technique in which tooth-coloured composite resin is bonded directly to the tooth surface and shaped by hand. For small chips, worn biting edges, narrow gaps between teeth and irregularities in the form of a single tooth, it's usually completed in a single visit. Cutting into sound enamel is either unnecessary altogether or kept to an absolute minimum.",

      "q": "What is bonding, and which dental problems is it used for?",
      "a": "Composite resin is a light-cured material that bonds to the enamel surface with the help of an adhesive system. Your dentist builds it up in layers, cures each one, and shapes it to match the tooth's natural form. The situations it comes up in most often are small chips in the front teeth, worn edges, narrow gaps between teeth, and a single tooth looking shorter than its neighbour. It's best suited to limited, targeted corrections rather than changes across the whole mouth. <a href=\"/en/hizmet/dislerim-ayrik/\">Gaps between teeth<\/a> and <a href=\"/en/hizmet/dislerim-asindi/\">worn teeth<\/a> are typical reasons patients come in for it."

      "q": "Who is a suitable candidate for bonding?",

      "q": "What's the difference between a cosmetic filling and bonding?",
