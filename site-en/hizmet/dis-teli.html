  "lead": "Fixed brace treatment moves teeth in a controlled way using small brackets bonded to each tooth, linked together by an archwire. At Smile Group, the choice between metal and ceramic brackets is planned only after we've assessed your bite and how your teeth line up. On this page, you'll find how the treatment works, how long it takes, what it means for everyday life, and what happens during retention.",

      "q": "What is brace treatment, and how do fixed brackets work?",
