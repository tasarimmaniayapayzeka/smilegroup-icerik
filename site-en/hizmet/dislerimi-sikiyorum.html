  "lead": "Most people don't notice they're clenching their teeth — it's the tired feeling in your jaw in the morning, or a dull pressure settling into your temples by midday, that gives it away. Unlike grinding, clenching is silent and can carry on through the day as well as at night. This page explains what your symptoms might point to and at what stage it makes sense to see a dentist.",

      "q": "Are clenching and grinding the same thing? What's the difference?",
