  "lead": "Struggling to bite into food, avoiding anything hard, or always chewing on the same side quietly narrows your day-to-day life. There's no single cause behind this complaint — anything from a simple bite adjustment to a missing tooth, a cracked tooth or a jaw joint problem can produce the same result. This page is here to help you understand what's going on and choose the right next step.",

      "q": "What are the most common causes of difficulty chewing?",
      "a": "The most common causes are: a new filling or crown sitting high on the bite, a reduced chewing surface from one or more missing teeth, a denture that's become loose or no longer fits well, a crack in a tooth that isn't visible to the eye, restriction coming from the jaw joint, and unconsciously loading one side because of a painful tooth. Possible causes also include a wisdom tooth that's still coming through or stuck in the bone, with inflammation of the surrounding gum, or a tooth with advanced decay or infection at the root tip. These can trigger each other; telling them apart is done through a clinical examination and radiography where needed. When the complaint started is also a clue: difficulty that begins right after a procedure usually points to a contact point in the bite, while difficulty that settles in gradually over weeks suggests tooth loss, a denture fit issue, or a joint-related process."
