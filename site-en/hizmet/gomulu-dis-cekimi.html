    {
      "q": "What is impacted tooth extraction, and which teeth does it apply to?",
      "a": "A tooth that should normally appear in the mouth can fail to complete its eruption because of a blockage from bone or soft tissue. Removing a tooth like this — by lifting the gum and, where needed, thinning the bone around it — is what's meant by impacted tooth extraction. Where a standard <a href=\"/en/hizmet/dis-cekimi/\">tooth extraction<\/a> deals with a tooth that's visible in the mouth, this procedure calls for a surgical approach. It's seen most often with wisdom teeth, but upper canines, lower premolars and supernumerary teeth can also stay impacted."

      "q": "Why does a tooth stay impacted?",
