  "lead": "Invisalign is an orthodontic system in which tooth movement is planned on computer and carried out using a series of clear aligners, worn one after another. The basic principle is simple: each aligner moves a tooth a small step closer to its target position. Above all, the result depends on how many hours a day the patient actually wears them.",
  "faqs": [
    {
      "q": "What is Invisalign, and how does the system actually work?",
      "a": "It's the process behind the name that really matters: an intraoral scan, three-dimensional planning, and a series of aligners manufactured to match. The orthodontist scans the starting position of your teeth, maps out the target position digitally, and breaks the distance between the two into dozens of small intermediate steps. The manufacturing centre then produces a separate thermoplastic aligner for each step. As you work through the aligners in order, your teeth move gradually towards the planned position. You can find the general principles behind the clear aligner approach on our <a href=\"/en/hizmet/seffaf-plakla-ortodonti/\">clear aligner orthodontics<\/a> page."
    },
    {
      "q": "How do the aligners actually move a tooth?",
      "a": "Each aligner is manufactured with a geometry that's slightly different from the tooth's current position; once it's seated, that small mismatch transmits a gentle, continuous force to the tooth and the bone around it. Bone tissue responds to this force by breaking down on one side and rebuilding on the other, gradually remodelling itself. The amount of movement per aligner is kept to a matter of tenths of a millimetre, since the orthodontist aims to keep the force within what the tooth can safely tolerate. That's why the number of aligners in a case can run into the dozens, depending on how complex it is."
    },
    {
      "q": "What happens during digital treatment planning?",
      "a": "The dentist first takes a three-dimensional digital scan of your jaws with an intraoral scanner, then adds X-rays and photographs to the record. The orthodontist uses this data to assess how your teeth line up, how your bite comes together, and how much space is needed. The planning software then simulates the tooth movements step by step. Where necessary, the orthodontist builds arch expansion, small amounts of interproximal reduction, or extraction into the plan. Once approved, the plan goes to the manufacturing centre, where technicians produce the aligner series to match it. The simulation is a target image rather than a guarantee — because the biological response in the mouth doesn't progress at exactly the same rate in every patient, the plan can be updated at check-ups along the way."
    },
    {
      "q": "What is an attachment, and why is it bonded to the tooth?",
      "a": "An attachment is a small composite bump bonded to the enamel surface to help the aligner get a better grip on the tooth; the dentist places these in a single visit using a template, and removes them the same way once treatment is finished. For more demanding movements — rotation, vertical extrusion, or root movement — attachments are usually essential. They're matched closely to your tooth colour, but they can still be noticeable up close, and they can pick up staining from dark drinks over time. If an attachment comes off, the aligner may not seat properly, so letting the clinic know straight away helps avoid delays."
    },
    {
      "q": "Who is Invisalign a suitable option for?",
      "a": "Mild to moderate crowding, gaps between the teeth, and mild relapse after previous orthodontic treatment are the situations where this system is most often used. Adults who'd rather avoid the look of metal brackets, and professionals who spend a lot of time presenting or in meetings, often lean towards the aligner option. Versions of the system suitable for children and teenagers exist too, though growth direction and the state of the baby teeth need a separate assessment in these age groups. If you'd like to put a name to what's bothering you, our <a href=\"/en/hizmet/dislerim-yamuk/\">crooked teeth<\/a> and <a href=\"/en/hizmet/dislerim-ayrik/\">gaps between teeth<\/a> pages may help point you in the right direction."
    },
    {
      "q": "In which cases might it not be enough on its own?",
      "a": "Clear aligners move teeth. They don't grow the jaw, and they don't change the position of the jawbone itself. In advanced skeletal bite problems and marked jaw discrepancies, the system may not reach the target on its own. In these cases, orthodontics is planned alongside jaw surgery. Moving roots in parallel over a long distance, bringing an impacted tooth into the arch, and correcting severely rotated premolars are also among the movements aligners can struggle with. In some cases, the dentist adds short-term brackets or mini-screw support to the aligner treatment. We cover the surgical side of jaw relationships on our <a href=\"/en/hizmet/ortognatik-cerrahi/\">orthognathic (jaw) surgery<\/a> page."
    },
    {
      "q": "When is treatment not carried out, or postponed?",
      "a": "If there's active decay, untreated gum inflammation, or a heavy build-up of tartar, the dentist won't start orthodontic treatment straight away. These issues are dealt with first, and only then does the scanning stage begin. In periodontal disease with advanced bone loss, the orthodontist reconsiders the whole plan, since moving teeth could cause further loss of support. For patients who say upfront that they won't be able to wear the aligners for the required hours, a fixed system can be the more realistic option. Uncontrolled systemic conditions, certain medications that affect bone metabolism, and severe night-time grinding are other factors that can delay the start of treatment. <a href=\"/en/hizmet/dis-tasi-temizligi/\">A scale and polish<\/a> is the first step in most treatment plans."
    },
    {
      "q": "How many hours a day do the aligners need to be worn?",
      "a": "The aligners need to stay in for around <strong>20 to 22 hours a day<\/strong> — every hour except eating and brushing counts towards this. Cutting that time short throws off the fit between tooth and aligner, so the next one in the series won't seat properly. Weeks where wear time slips tend to stretch out the overall timeline, and sometimes mean an extra set of aligners has to be made. On days when wear time has been shorter, getting the aligner back in becomes noticeably harder, and the pressure you feel in the first few hours is more intense too. Putting the aligner straight back in its case whenever you take it out — rather than wrapping it in a napkin — cuts down on the number that get lost."
    },
    {
      "q": "How often are the aligners changed, and how do check-ups work?",
      "a": "In most plans, each aligner is worn for somewhere between seven and fourteen days. You move on to the next set yourself, at home, and usually come into the clinic every six to ten weeks. At these appointments, the dentist checks that the attachments are still in place and that your gums are healthy. New sets of aligners are handed over as needed, and any sharp edges are smoothed down. Switching to a new aligner in the evening makes it easier to sleep through the initial pressure. Coming to your check-up with the aligners already in lets the dentist assess the fit straight away."
    },
    {
      "q": "How long does Invisalign treatment take?",
      "a": "Treatment time depends on how many teeth need to move and what type of movement is involved. Limited corrections can be finished in a few months, while cases needing a full-arch bite correction can run past a year. More attachments and a higher number of teeth needing root movement both increase the number of aligners, and with it, the overall timeline. Where the upper and lower arches progress at different speeds, the finish date can be pushed back. The digital plan produced after your scan sets out the expected timeline along with the number of aligners involved."
    },
    {
      "q": "What are the risks and downsides?",
      "a": "In the first few days after switching to a new aligner, pressure, mild discomfort and temporary changes to speech are common. The edges of the aligner can irritate the tongue and cheek lining; the dentist can smooth the edge down if needed. Bacterial plaque builds up more easily around attachments, and if cleaning isn't kept up, the risk of white staining on the enamel and of decay both increase. Some shortening of the root tips is a possibility with any orthodontic treatment; in most cases the clinical impact stays limited, but the shortening that does occur is permanent, which is why the orthodontist limits the amount of movement in patients considered at higher risk. In some cases, gum recession, an unexpected gap in the bite, or a planned movement not being fully achieved can also come up. Being able to take the aligner out looks like an advantage, but in patients who struggle with the discipline it requires, it becomes a serious downside. Replacing lost or broken aligners also costs time. In that situation, most plans call for going back to the previous aligner and letting the clinic know the same day. In patients with severe grinding, aligners wear through quickly — we cover this in more detail on our <a href=\"/en/hizmet/dislerimi-sikiyorum/\">teeth clenching<\/a> page."
    },
    {
      "q": "What should you keep in mind for aligner hygiene?",
      "a": "The basic rule is to rinse the aligners in lukewarm water every time you take them out, and clean them gently with a soft brush; don't use toothpaste, as the abrasives in it will scratch the surface. Keep them away from hot water, since the thermoplastic material can warp with heat, and coloured mouthwashes can leave the surface looking cloudy. Over time, a whitish film from saliva and mineral deposits builds up on the inside of the aligner; using manufacturer-approved cleaning tablets a few times a week cuts down on this build-up and the odour that comes with it. Washing the case regularly with soapy water stops a damp film from forming inside it."
    },
    {
      "q": "What happens if an aligner doesn't seat properly?",
      "a": "Staying on track means the movement happening in your mouth is keeping pace with the plan. Signs that things have fallen out of step include the attachment wells not filling up completely, the aligner lifting off the back molars, or it not seating fully without you pressing it into place. For small deviations, the dentist extends how long you wear the current aligner and uses a chewie to help it settle. If the gap is bigger, a new scan is taken and an additional series is planned for the remaining movements. The habit most likely to throw tracking off is eating with the aligners in — take them out for anything except water. Drinking coloured drinks like tea, coffee or cola with the aligners in both stains the surface and traps sugar against the tooth. If you can't brush after eating, rinsing your mouth thoroughly before putting the aligner back in is the next best option."
    },
    {
      "q": "Why is retention needed after treatment?",
      "a": "Once teeth have moved into their new positions, they tend to drift back until the surrounding ligaments and bone have fully adapted. That's why the orthodontist recommends a retainer, or a thin wire bonded to the back of the teeth, as soon as treatment finishes. To begin with, the retainer is worn all day; in later months, it's usually cut back to nights only. Patients who stop wearing their retainer can see mild crowding return over the following years. You can find the classic approach using fixed appliances on our <a href=\"/en/hizmet/dis-teli/\">braces<\/a> page, and if you have questions about how comfortable your smile feels, our <a href=\"/en/hizmet/gulerken-rahat-hissetmiyorum/\">I don't feel comfortable smiling<\/a> page may help."
    }
