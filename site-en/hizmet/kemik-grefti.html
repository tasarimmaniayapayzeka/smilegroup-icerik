  "lead": "A bone graft is a surgical preparation used before implant treatment to rebuild lost volume in the jawbone. On this page, we've brought together the types of graft available, how the procedure is carried out, the healing process, and the possible risks. Tap any of the headings below to open the answer to what you're wondering about.",

    {
      "q": "What is a bone graft?",
      "a": "Your dentist places a material that mimics the structure of bone into the area that's lost volume — commonly known as a bone graft. This material acts as a scaffold, providing a framework for the surrounding living bone to grow into. A graft isn't a treatment in its own right; it's a preparatory step within the wider plan, aimed at building a solid base for the implant to sit on. It's most often used as a preparatory stage for treatments such as a <a href=\"/en/hizmet/tek-dis-implant/\">single tooth implant<\/a>. In patients with enough bone volume already, your dentist skips this step and moves straight to implant planning. Whether a graft is needed is decided individually for each patient, after examination and radiological assessment."

      "q": "What causes the jawbone to lose volume?",
      "a": "After a <a href=\"/en/hizmet/dis-cekimi/\">tooth extraction<\/a>, the bone loses the chewing force that used to stimulate it and gradually loses volume — a process known as <em>resorption<\/em>. In areas left empty for a long time, the bone both thins and drops in height. Advanced gum disease also erodes the bone supporting the teeth; <a href=\"/en/hizmet/dis-etim-kaniyor/\">bleeding gums<\/a> is one of the early warning signs of this process. Trauma, cysts and long-term denture wear can lead to similar losses. Bone loss usually isn't down to a single cause — several factors tend to combine."

      "q": "What types of graft material are used?",
      "a": "There are four main graft groups, based on where the material comes from and how it's produced. An autogenous graft is bone taken from your own body; because this needs a second surgical site, some pain and swelling can occur where the bone was taken from. Allograft material comes from human tissue banks, while xenograft comes from processed animal sources. Synthetic grafts are manufactured in a laboratory from biocompatible mineral, ceramic or bioglass-based raw materials. All of these materials are regulated as medical devices and must meet the relevant standards before they're used in clinical practice. No single type is considered superior in every case: particle grafts are better suited to filling a space, while block grafts are better for gaining width."

    {
      "q": "What happens step by step during the procedure?",
      "a": "Your dentist first measures bone height and width using a 3D scan. On the day of the procedure, the area is numbed with local anaesthetic, and for patients with higher anxiety levels, sedation may also be raised as an option. A small incision is made in the gum to expose the deficient area. The graft material is then placed into the space, covered with a protective membrane, and the site is stitched closed. If the remaining bone allows the implant to achieve sufficient <em>primary stability<\/em>, your dentist places the graft and the implant in the same session; if stability can't be achieved, the implant is placed separately, once the graft has matured. In patients with extensive bone loss, plans that use the available bone at different angles, such as <a href=\"/en/hizmet/all-on-4/\">All-on-4 implants<\/a>, come into consideration instead."

      "q": "How long does healing take, and when is the implant placed?",

    },

      "q": "Which technique is chosen when volume is insufficient?",

      "q": "What benefits can be expected?",

      "q": "What risks and complications can occur?",

    },

      "q": "What should you watch out for in the first few days after a graft?",
