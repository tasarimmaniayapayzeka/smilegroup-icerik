  "lead": "You may have noticed in the mirror that your teeth look shorter, that the edges have become translucent, or that small notches have appeared along the gum line. Wear doesn't come from a single cause — clenching, acid exposure, incorrect brushing and how chewing forces are distributed each leave a different kind of mark. This page explains what each clue might point to and guides you towards the right next step.",
  "faqs": [
    {
      "q": "When we say your teeth are worn down, what exactly is being lost?",
      "a": "Wear means the enamel, and the dentine beneath it, gradually thinning over time. Enamel doesn't regenerate — wherever it thins, the yellowish dentine underneath becomes visible, so the tooth looks both shorter and darker. Because the loss progresses slowly, most people only notice once the edges of their front teeth turn translucent, or fillings start standing proud of the tooth. Appearance alone doesn't tell you the cause — two teeth that have worn down by the same amount can have completely different stories behind them."

      "q": "What are the possible causes of tooth wear?",
      "a": "Four main mechanisms stand out among the possible causes. Attrition, caused by tooth-on-tooth contact, is common in people who clench during the day or grind at night. Erosion, from acid exposure, is linked to fizzy drinks, citrus fruit, vinegar, reflux and vomiting. Abrasion, caused by a hard brush and horizontal brushing strokes, is the third category. The fourth is abfraction — wedge-shaped loss at the gum line, caused by chewing forces flexing the tooth. In most patients, these don't occur in isolation; they overlap with one another."
    },

      "q": "What are the tell-tale signs of wear from clenching (attrition)?",

      "q": "What symptoms go along with wear, and what should I look out for?",

      "a": "The idea that 'enamel repairs itself' comes first — enamel contains no living cells, so tissue that's been lost doesn't come back. Early on, the surface can be strengthened with mineral support, but that isn't the same as restoring lost tissue. The second myth is that brushing harder gets you a cleaner result: more pressure doesn't mean more cleaning, it means more loss. The third is putting tooth wear down to ageing alone — advanced wear can show up in people in their twenties too. The claim that herbal mixtures or anti-wear toothpastes repair tissue isn't supported either."
