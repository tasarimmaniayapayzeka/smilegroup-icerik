    {
      "q": "What are inlay and onlay fillings?",
      "a": "Their job is to rebuild a sound chewing surface on a back tooth that's been weakened by decay or a fracture. In dentistry, this group is called an <em>indirect restoration<\/em>, because the piece is made in a lab rather than in the mouth. The dentist takes an impression of the remaining sound structure, the lab uses it to prepare a custom piece, and at a second appointment the dentist bonds the piece to the tooth using special cements. The material is usually porcelain or composite. The method sits somewhere between a filling and a crown — instead of repairing the tooth with a paste-like filling material, the dentist restores it with a pre-shaped, rigid piece."
