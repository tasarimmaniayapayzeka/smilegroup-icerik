  "lead": "A porcelain crown is a fixed restoration that covers a single damaged tooth completely; a bridge closes the gap left by a missing tooth by drawing support from the teeth on either side. This page looks at how a bridge works, how the supporting teeth are prepared, how you clean underneath the pontic, and where the treatment's limits lie.",
  "faqs": [
    {
      "q": "What is a porcelain crown and bridge, and what's the difference between a crown and a bridge?",
      "a": "A crown is a cap-shaped restoration that fits over a tooth whose own root is still in place but which has lost a significant amount of its structure. A bridge answers a different problem: it closes the gap left by an extracted or lost tooth, drawing its support from the teeth on either side. The technician makes the bridge as a single piece, with the crown sections that sit on the supporting teeth joined to the pontic that spans the gap. That's why a bridge isn't a single-tooth procedure — it's a unit of at least three connected parts. You can read about other crown-based restoration options on our <a href=\"/en/hizmet/kaplama/\">crowns<\/a> page."

      "q": "Who is a suitable candidate for this treatment?",
      "a": "People with sound roots and adequate bone support in the teeth either side of the gap may be suitable for this treatment. If the teeth that will act as supports already have large fillings or have had <a href=\"/en/hizmet/kanal-tedavisi/\">root canal treatment<\/a>, a bridge can also serve as a protective cap for them at the same time. A fixed bridge may also be considered for patients whose bone volume at the gap site is insufficient for surgery, or who are postponing surgery for medical reasons. The deciding factor here is the bone height at the site of the missing tooth; the periodontal bone support holding the abutment teeth in place is a separate matter. Your dentist assesses candidacy together with X-rays, a gum examination and a bite analysis."

      "q": "What's the difference between a bridge and implant-supported solutions?",

    },

      "q": "When is this treatment not carried out, or postponed?",

      "q": "How long does sensitivity last after the bridge is cemented?",
