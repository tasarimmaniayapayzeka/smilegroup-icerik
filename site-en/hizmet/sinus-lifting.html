  "lead": "For people planning implants in the back of the upper jaw, bone height is often limited — a sinus lift is a surgical preparation aimed at increasing that measurement. This page covers the difference between the open and closed technique, how long the procedure takes, the healing timeline, and the possible risks, each as a separate topic. Click or tap any heading to open the explanation.",
  "faqs": [
    {
      "q": "What is a sinus lift?",
      "a": "The maxillary sinus is an air-filled cavity beneath the cheekbone, sitting close to the roots of the upper back teeth. The thin membrane lining this cavity is called the Schneiderian membrane. During surgery, your dentist carefully lifts this membrane from its floor and fills the space created underneath with graft material, with the aim of increasing the vertical space available for an implant. The procedure is also known as sinus augmentation or sinus floor augmentation. For a single missing tooth, this preparation is often the first step in a <a href=\"/en/hizmet/tek-dis-implant/\">single tooth implant<\/a> plan."

      "q": "When is a sinus lift needed?",
      "a": "After tooth loss, the jawbone gradually resorbs while the sinus cavity expands downward — combine the two, and the space available for an implant narrows. In areas left without teeth for a long time, this bone loss progresses further, and advanced gum disease speeds it up. In some people, the sinus cavity is naturally large from birth and doesn't leave enough space to begin with. Your dentist uses a 3D scan to measure existing bone height to the millimetre and examine the sinus anatomy on the same images, which also show the bony partitions inside the sinus and the thickness of the membrane. Relying on a panoramic X-ray alone can be misleading in this area. Where several teeth are missing at the back of the mouth, <a href=\"/en/hizmet/coklu-dis-koprulu-implant/\">multiple-tooth implant-supported bridge<\/a> planning forms part of the same assessment."
    },

      "q": "How is the open (lateral window) technique carried out?",
      "a": "Also known as the lateral window or external approach, this technique involves your dentist lifting the gum and opening a small window in the side wall of the jaw. Using fine hand instruments, they gently lift the membrane and fill the resulting space with graft material in layers, then close the area with stitches. Your dentist considers this route when remaining bone height is significantly reduced. If the membrane is very thin, a protective barrier membrane may be placed to reduce the risk of the graft dispersing. This approach can achieve more height gain in some cases, though healing takes longer. Where both sides need treatment, your dentist can address both sinuses in a single session, or may prefer to space the sessions out to limit swelling and difficulty eating. Stitches are usually removed after seven to ten days. For more on graft options, see our <a href=\"/en/hizmet/kemik-grefti/\">bone graft<\/a> page."
    },
    {
      "q": "With the closed (internal) technique, can the implant be placed in the same session?",
      "a": "This approach, also known as the internal or osteotome technique, doesn't require a separate window. Your dentist works through the implant site itself and lifts the sinus floor from within. The amount of lift achievable is limited, usually staying between three and four millimetres. Your dentist favours this method when remaining bone height is five millimetres or more, though that measurement alone isn't considered sufficient grounds on its own. In areas of lower bone density, the site is compacted rather than widened. Because tissue trauma is limited, swelling tends to be milder in most cases. During surgery, your dentist assesses whether sufficient primary stability has been achieved to place the implant in the same session; if stability isn't sufficient, the implant is left for a second session. The membrane can still tear with the closed technique, and because it's harder to see from within, your dentist may choose to stop the procedure if this happens. Where same-session placement is possible, the treatment timeline can be shortened. The final choice between the two techniques is guided by both the scan findings and what's observed during surgery."

    },

      "q": "How long do healing and new bone formation take?",
      "a": "Swelling, bruising and a small amount of bleeding from the nose can appear in the first few days; these usually settle within three to seven days. The graft material integrating with your own bone tissue takes much longer. Graft taken from your own bone tends to integrate faster, while material of bovine or synthetic origin forms bone more slowly. With the open technique, dentists usually expect a waiting period of four to nine months. Once this waiting period is over, your dentist places the implant, and a second process begins: in a grafted upper jaw, the implant fusing with the bone usually takes four to six months, which can be longer than in natural bone. These two periods run one after the other, so working out the total timeline means adding them together. During the waiting period, your dentist may cover the area with a temporary restoration. Your general health, the type of graft, and your oral hygiene all affect this timeline. Your dentist monitors new bone formation with a follow-up scan, usually taken at the end of the waiting period, just before the implant appointment."

    },
    {
      "q": "What are the risks and possible complications of a sinus lift?",
      "a": "Like any surgical procedure, this one carries certain risks. The most common is a tear in the sinus membrane, which occurs at a rate that's far from negligible; your dentist can usually repair small tears in the same session, while larger tears mean stopping the procedure, letting the area heal, and rescheduling the surgery for a few months later. Infection, a flare-up of sinusitis, prolonged swelling or nasal congestion can develop. In some cases, these can progress to chronic sinusitis or a persistent opening between the mouth and sinus (an oroantral fistula), which requires further surgery. With the open technique, injury to the blood vessel running along the side wall can cause bleeding. With the closed technique, the tapping instrument used can trigger temporary dizziness and imbalance (BPPV). Graft particles, or the implant itself, can migrate into the sinus, in which case the material may need to be removed surgically. In some cases, the graft material doesn't form as much new bone as expected, and the procedure needs repeating. Temporary changes in smell have also been reported. Membrane thickness, a history of sinusitis, and general health are the main factors affecting the level of risk."

    }
