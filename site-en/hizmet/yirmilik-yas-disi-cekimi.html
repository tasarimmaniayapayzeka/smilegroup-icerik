  "lead": "Wisdom teeth sit right at the back of the mouth and, in most people, start to come through between the ages of 17 and 25. In some mouths they settle into place without causing any trouble at all; in others, a lack of space or the wrong angle of eruption creates a risk of infection, pain and damage to the neighbouring tooth. This page sets out, in detail, which wisdom teeth can simply be monitored, which ones need extracting, and how the process works.",

      "q": "What is a wisdom tooth, and why does it behave differently from other teeth?",

      "q": "Who ends up needing a wisdom tooth removed?",
