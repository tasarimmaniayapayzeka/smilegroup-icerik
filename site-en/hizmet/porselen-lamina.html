  "lead": "A porcelain veneer is a thin ceramic shell bonded only to the front surface of the tooth. It's an aesthetic approach aimed at addressing colour, shape and narrow-gap problems while leaving the back and chewing surfaces of the tooth untouched. On this page, we cover the stages of treatment, the trial process, its limitations, and its irreversible side in detail.",
  "faqs": [
    {
      "q": "What is a porcelain veneer, and which surface of the tooth does it go on?",
      "a": "Also known as a leaf porcelain veneer, this restoration is usually made from ceramic shells just a few tenths of a millimetre thick. The dentist fixes the shell to the visible front surface of the tooth and its biting edge using specialist bonding systems; the back surface and chewing areas are mostly left untouched. Because ceramic's semi-translucent structure lets light through in a way similar to natural enamel, the aim is a result that doesn't draw attention when you smile. The treatment covers the front teeth mainly; different restoration types come into play for teeth further back. You can see the options set out side by side on our <a href=\"/en/hizmet/kaplama-materyalleri-karsilastirma/\">crown and veneer materials comparison<\/a> page."
    },
    {
      "q": "Who is this a suitable option for?",
      "a": "Internal discolouration that doesn't respond well enough to whitening, small chips and notches on the front teeth, surface shape irregularities, and narrow gaps between the front teeth are common reasons patients come in. Shape correction is also possible for incisors that look short because of a length mismatch. With mild rotation or very limited crowding, ceramic can visually balance out the alignment; with noticeable crowding, the dentist will consider an orthodontic route first. A complaint of <a href=\"/en/hizmet/dislerim-ayrik/\">gaps between the teeth<\/a> is one of the most typical examples in this group."

      "q": "Why is this considered an irreversible procedure?",
      "a": "Enamel is tissue the body can't regenerate; even a thin layer, once removed, doesn't grow back. Because of this, a tooth that's had a veneer fitted stays covered by a restoration from then on — if the ceramic fractures or reaches the end of its working life, a new one is made, but the tooth never returns to an uncovered surface. Before deciding, patients are expected to understand this permanence clearly. No-prep designs are a separate scenario and aren't covered by this permanence. Rather than rushing into it out of aesthetic eagerness, comparing the no-reduction alternatives first is a sounder place to start."
    },
    {
      "q": "What stages does treatment involve?",
      "a": "The process starts with an examination, photographs and an impression; the dentist deals with gum health, the bite and any decay first. Shade planning also belongs to this stage: because bonded ceramic isn't affected by whitening agents, if whitening is being considered, it's planned to be completed before the veneers are made. The target shape is then designed on a model. After the trial stage, the dentist prepares the enamel surface to a limited extent, sends the impression to the technician, and fits temporary restorations. The technician builds up the ceramic in layers or shapes it by milling from a block. At the final appointment, the dentist checks the shade match, etches the surface, and bonds the veneers. The whole process runs within <a href=\"/en/hizmet/gulus-tasarimi/\">smile design<\/a> planning."
    },
    {
      "q": "What's the point of the trial (mock-up) stage?",
      "a": "A mock-up is the new design applied directly onto the teeth using a temporary material. The patient can see the length, width and smile line in the mirror before any tooth is reduced, and anything they'd like changed is adjusted in the mouth rather than on paper. How much the teeth show during speech and smiling is also assessed at this stage. Because this is where expectation and technical limits meet face to face, the trial is the best moment to revise the plan."
    },
    {
      "q": "How much tooth structure is removed?",
      "a": "In classic crown treatment, the tooth is reduced all the way round; with veneers, preparation is generally limited to the front surface and biting edge. The aim is to keep the thickness removed within the enamel as much as possible, since the durability of the bond depends heavily on this detail. If a tooth sits further back in the arch, the dentist may be able to remove less structure; if it sits further forward, the amount of reduction can increase and dentine can become exposed. For some well-positioned teeth, no-prep or minimal-prep designs can be planned, though this doesn't apply to every mouth. Because preparation that extends into dentine raises the likelihood of sensitivity, analysing the tooth's position matters."
    },
    {
      "q": "What's the difference from composite veneers?",
      "a": "Both methods cover the front surface of the tooth, but the material and production route differ. With composite, the dentist shapes the filling material in the mouth in the same visit; with porcelain, the technician produces the ceramic in the lab and it's bonded at a second appointment. Ceramic surfaces behave differently when it comes to staining and shine, while composite can stand out in some cases for how easily it can be repaired or added to. The choice depends on expectations, tooth structure and how much time you'd prefer to spend. You can find more detail on our <a href=\"/en/hizmet/kompozit-lamina/\">composite veneers<\/a> page."

      "q": "What are the risks and possible disadvantages?",
      "a": "Because ceramic is thin, it can fracture on impact, when biting a hard object, or under excessive chewing load; a fractured veneer repaired inside the mouth rarely matches the original in colour and shine, so it usually has to be replaced instead. Sensitivity to hot and cold is common after reduction; the typical pattern is for it to be noticeable in the first few days and ease off within a few weeks, though in some cases it takes longer. If the bond weakens, the restoration can come away. Plaque that builds up at the margins can lay the ground for gum inflammation or decay at the edge; marginal leakage isn't something patients tend to notice on their own — it tends to show up as a thin dark line at the margin, sensitivity that doesn't settle, or on probing at a check-up appointment. Less commonly, pulp inflammation can develop and root canal treatment may be needed; this is a permanent change. Colour mismatch or a shape different from what was expected can't easily be corrected once the ceramic has been bonded."
    },
    {
      "q": "When is it not carried out, or postponed?",
      "a": "Untreated decay, active gum inflammation and poor oral hygiene are the primary barriers; the dentist won't move on to the aesthetic stage until these are resolved. If enamel is significantly worn, there may not be enough surface left for reliable bonding. Uncontrolled clenching and grinding markedly raises the risk of fracture; planning isn't considered appropriate until a protective night guard is in place. In teeth with large fillings or ones that have become brittle after root canal treatment, full-coverage restorations are considered instead. Treatment is postponed in young patients whose oral development isn't complete and in cases of significant crowding. If there's a complaint of <a href=\"/en/hizmet/dislerimi-sikiyorum/\">teeth clenching<\/a>, this is addressed first."
    },

      "q": "How long does it take, and how many visits are needed?",

    },
    {
      "q": "How should aftercare be managed?",
      "a": "The period with temporary restorations in place has its own rules: because temporaries don't hold as firmly as the permanent veneers, sticky and hard foods should be avoided, and floss should be slid out sideways rather than pulled up; mild sensitivity is expected, and if a temporary comes off, the dentist should be told. After permanent bonding, brushing and interdental cleaning habits don't change; the margin where the veneer meets the gum is the area that needs the most attention. Because abrasive whitening toothpastes can dull the shine of the ceramic surface, dentists generally recommend gentler formulas instead. Avoiding biting ice, hard-shelled nuts, or pen tops with the front teeth reduces the risk of fracture."
    },

      "q": "What determines how long it lasts?",

    },
    {
      "q": "What are the limitations of porcelain veneers?",
      "a": "Ceramic is a covering; it doesn't actually move the position of the teeth. Where the appearance comes from severe crowding, a bite problem, or the jaw relationship, an orthodontic or surgical approach may be more appropriate. With very dark internal discolouration, a thin ceramic shell may not fully mask the underlying shade, and either increasing the thickness or moving to a different material becomes necessary. If gum levels are asymmetric, balance can't be achieved with veneers alone. For sound teeth with only a colour complaint, no-prep routes such as <a href=\"/en/hizmet/dis-beyazlatma/\">teeth whitening<\/a> are considered first. For more extensive plans, our <a href=\"/en/hizmet/hollywood-gulusu/\">Hollywood smile<\/a> and <a href=\"/en/hizmet/emax/\">E.max<\/a> pages offer further information."
    }
