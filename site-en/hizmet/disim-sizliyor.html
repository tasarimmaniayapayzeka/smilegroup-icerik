  "lead": "If you feel a sharp, fleeting twinge in a tooth that lasts a few seconds after cold water, hot soup or a sweet mouthful, this is usually assessed under the heading of dentine sensitivity. The cause can range from gum recession to enamel wear, from a recent filling to a cracked tooth. This page is here to help you recognise what you're dealing with and find the right next step.",

    {
      "q": "What does it mean when my tooth feels sensitive?",
      "a": "Sensitivity occurs when the dentine tissue beneath the enamel comes into contact with a trigger. Dentine is made up of microscopic tubules that run through to the tooth's nerve; when something cold, hot, sweet or sour changes the movement of fluid inside these tubules, the nerve endings fire off a brief, sharp signal. The feeling fades within a few seconds of the trigger being removed — and that brevity is the clearest thing that sets sensitivity apart from other dental complaints."

      "q": "How is this different from throbbing toothache?",

      "q": "What are the most common causes of tooth sensitivity?",
      "a": "The leading cause is root surface exposure due to gum recession. Behind this come enamel wear and acid erosion, early-stage decay, micro-cracks linked to clenching and grinding, temporary sensitivity following procedures such as whitening or a filling, and old restorations whose margins are no longer a good fit. More than one cause can be present in the same mouth at once, which means a single measure won't always be enough."

    {
      "q": "Why does a tooth become more sensitive once the root surface is exposed?",

    {
      "q": "Is sensitivity after whitening normal?",

    },
    {
      "q": "Which accompanying symptoms mean I should see a dentist?",
      "a": "How long the sensitivity lasts, and what comes with it, are what guide the assessment. A feeling that lasts for minutes after the trigger is gone, is gradually getting worse, increases at night, or is more pronounced with heat and eases with cold, is worth paying attention to. Sensitivity concentrated in a single tooth that sharpens when you bite, along with gum swelling, redness, a bad taste in the mouth, or a tooth darkening in colour, fall into the same group. If the complaint has lasted several weeks without easing, it's a good time to book an appointment. <strong>Swelling spreading across the face or under the jaw, restricted mouth opening, difficulty swallowing, fever, and pain that wakes you up and won't settle are signs that need assessing without delay — for this picture, go to your nearest dentist or A&E department.<\/strong> Use this list not as a diagnostic tool but as a simple guide for reviewing your own situation."

      "q": "What does the dentist assess during an examination?",
