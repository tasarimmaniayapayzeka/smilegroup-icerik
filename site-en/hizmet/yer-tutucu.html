  "lead": "Baby teeth do more than just chew — they also mark out the eruption path for the permanent tooth developing underneath. When a baby tooth is lost early, whether through decay, trauma or extraction, the neighbouring teeth start tipping into the gap. Space maintainers are small appliances designed to hold that space open until the permanent tooth is ready to come through.",

      "q": "What is a space maintainer, and what problem does it solve?",
