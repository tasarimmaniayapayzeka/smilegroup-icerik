  "breadcrumb": [

  ],
  "lead": "The idea of supporting a fixed restoration on a completely edentulous jaw with just four implants is at the heart of the All-on-4 concept. This page takes an objective look at the logic behind angled implants, planning measures such as the cantilever and the spread of support, the stages involved, the healing timeline, the limitations, and the possible risks. Click or tap any heading below to open the detail on the topic you're interested in.",
  "faqs": [
    {
      "q": "What is All-on-4 implant treatment?",
      "a": "The 'four' in the concept's name refers to the number of implants carrying the restoration, not the number of teeth on top. Your dentist places four implants in a completely edentulous jaw and builds a one-piece fixed restoration carrying all of that jaw's teeth on top of them. Two implants sit upright at the front, while two are angled towards the back. Because it's a single-piece design, the restoration's entire load is spread across these four supports. <a href=\"/en/hizmet/tek-dis-implant/\">Single tooth implant<\/a> treatment, which plans a separate implant for each missing tooth, follows a different logic in this respect. As the upper and lower jaw have different bone structures, your dentist plans each jaw separately."
    },
    {
      "q": "Why are the implants placed at an angle?",
      "a": "Bone at the back of the jaw tends to resorb faster after teeth are lost. Angling the implants steers around the sinus cavity in the upper jaw and the nerve canal in the lower jaw, which means your dentist can use a longer implant in the bone that's available and move the back support further back. In most plans, the surgeon tilts the back implants somewhere between 30 and 45 degrees. This widens the distance between the front-most and rear-most implants — what's known as the anteroposterior spread of support. A wider spread shortens the unsupported section of the restoration extending behind the last implant, known as the <em>cantilever<\/em>; a shorter cantilever can help chewing forces transfer more effectively to the supports. In some cases, this can also reduce the need for further surgery such as a <a href=\"/en/hizmet/sinus-lifting/\">sinus lift<\/a>. The angle used depends on the distance between the sinus floor and the nerve canal."
    },
    {
      "q": "Who is suitable for this treatment?",
      "a": "Your dentist considers this concept for adults who have no teeth left in one jaw, or whose remaining teeth can't be saved. People who wear a full removable denture and are unhappy with it slipping fall into the same assessment. The deciding factor sits at the back of the mouth: where bone height has reduced at the level of the molars, the sinus has dropped, or the nerve canal has moved close to the surface, the angled four-implant plan comes into its own. At the front, there needs to be enough bone volume between the two sides of the jaw. Your dentist also looks for general health that's fit for surgery, and oral hygiene that can be kept up long term."
    },
    {
      "q": "What stages does treatment go through?",
      "a": "The roadmap starts with a detailed examination and a 3D CT scan; your dentist studies bone density and the sinus and nerve anatomy, and plans the implant positions digitally. At the surgical appointment, the team chooses the appropriate anaesthetic method, extracts any teeth that can't be saved, and places the four implants at the planned angles. Once measurable thresholds such as placement torque are met, your dentist can fit a fixed temporary restoration in the same session; if that threshold isn't met, loading is postponed. Immediate loading isn't therefore possible in every case. Our <a href=\"/en/hizmet/1-gunde-implant/\">same-day implants<\/a> page covers this loading approach in more detail. Once healing is complete, your dentist takes an impression, and the technician prepares the permanent restoration in the laboratory."

    {
      "q": "How long does the process take?",
      "a": "The timeline is set by the gap between the day of surgery and the day the permanent restoration is fitted. The surgical stage is usually completed in a single appointment; placing all four implants in the same session is part of this concept's planning logic. What follows is <em>osseointegration<\/em> — the period during which the implants fuse with the bone. Integration time varies by jaw: usually two to four months in the lower jaw, and three to six months in the upper jaw. This difference is explained by the lower bone density typically found in the upper jaw. Because the one-piece restoration sits on all four supports at once, in most protocols your dentist won't have the permanent restoration made until every implant has integrated. A delay at just one support can extend the whole timeline. You'll spend this period in a fixed temporary restoration, during which speech and chewing habits settle back into place."
    },
    {
      "q": "Four implants or six?",
      "a": "The key difference is the number of implants carrying the jaw. All-on-4 uses four supports, while <a href=\"/en/hizmet/all-on-6/\">All-on-6<\/a> treatment places six implants. The two extra supports widen the front-to-back spread and shorten the restoration's rear extension. Six implants, on the other hand, need more bone height at the back and generally take longer to place surgically. Where the back of the jaw has resorbed significantly, the angled four-implant plan comes to the fore; where bone volume is well preserved, the six-support option comes onto the table. The bone height at the back of your jaw is what decides between the two options."
    },
    {
      "q": "How is it different from full-mouth implant treatment?",
      "a": "The two terms don't mean the same thing. <a href=\"/en/hizmet/full-agiz-implant/\">Full-mouth implant treatment<\/a> is a broad description covering the rebuilding of one or both jaws with implants; under that umbrella you'll find different implant numbers, fixed or removable restoration types, and implant-retained overdenture solutions. All-on-4 is a specific concept: it requires a single jaw, four implants, and a one-piece fixed restoration. As the implant count changes, so does the planning, the timeline and the maintenance needed. In short, full-mouth treatment is the umbrella term, and All-on-4 is one clearly defined approach that sits within it."
    },
    {
      "q": "Can the restoration be taken out and put back in?",
      "a": "With this design, you can't take the restoration out and put it back in yourself; the superstructure is usually screw-retained, fastened onto the connecting components on top of the implants. Your dentist seals the screw access holes with composite filling material; because these can discolour over time, they may need replacing at check-ups. Only your dentist removes and refits the restoration, when a check-up, clean or repair calls for it. The fact that a screw-retained design can be removed at all is, in some cases, a reason it's chosen for easier maintenance and repair planning."

      "q": "What materials are used for the restoration?",
      "a": "Three main approaches stand out for the restoration. A <em>hybrid restoration<\/em> is a design where acrylic teeth and pink acrylic gum tissue sit on a titanium framework; your dentist can carry out repairs on this in normal clinical conditions. With <a href=\"/en/hizmet/monolitik-zirkonyum/\">monolithic zirconia<\/a> restorations, the technician mills the restoration from a single block of zirconia, so there's no join anywhere on the surface. In <em>titanium bar<\/em>-supported designs, a metal bar forms the restoration's skeleton, with ceramic or composite teeth built on top. Your chewing habits, the condition of the teeth in the opposing jaw, and what you're hoping for aesthetically are all weighed up together when choosing."
    },
    {
      "q": "What functional changes can you expect?",

    },

      "q": "What are the risks and drawbacks?",

    },
    {
      "q": "In which situations can it not be carried out?",
      "a": "Your dentist looks at contraindications in two groups. A recent history of radiotherapy to the head and neck, and an uncontrolled bleeding disorder, are permanent barriers; certain medications that affect bone metabolism also belong in this group. Uncontrolled diabetes, active oral infection, and heavy smoking make up the second group. Some of these are temporary — once brought under control, your dentist can revisit the plan. If the front bone between the two sides of the jaw isn't sufficient even for angled placement, the plan changes, and grafting or a different number of supports comes into consideration. Where clenching is severe and poorly controlled, fractures and wear on the restoration show up more often; you can read more on our <a href=\"/en/hizmet/dislerimi-sikiyorum/\">teeth clenching<\/a> page. In young patients whose jaw growth isn't complete, your dentist postpones the procedure. Only a clinical examination and medical history can determine this."
    },

      "q": "What should you watch out for after surgery?",
      "a": "Stick to soft foods in the first few days, and avoid anything hard or sticky. Smoking and alcohol slow tissue healing, so take a break from both after surgery. Limit strenuous physical effort and anything that puts pressure on the area in the first few days, as bleeding and swelling can increase during this time. The underside of the one-piece, four-support restoration leaves a narrow gap between the gum and the superstructure — clean this every day with an interdental brush and an oral irrigator. Have professional cleaning and a screw check at the intervals your dentist sets, usually more than once a year. Contact the clinic straight away if you notice looseness, bleeding, a bad smell, or pain."
    },

      "q": "What determines how long the restoration lasts?",

    }
