  "lead": "A crown is the general term for a fixed restoration cemented over a tooth that's been damaged or whose appearance you'd like to change — from full-coverage caps to the thinner veneer-style restorations bonded to the front of a tooth. It brings together a wide range of materials, from zirconia and glass ceramic to porcelain and composite veneers. This page covers the general picture of crown treatment: the stages every type shares, and the factors that shape which option is right for you.",
  "faqs": [
    {
      "q": "What is a crown, and what does it do?",
      "a": "A <strong>crown<\/strong> is a restoration prepared and fitted over a tooth that has lost a significant amount of its structure, or whose appearance you'd like to change — it can take the form of a full cap or a thinner shell, depending on the type. Your dentist prepares the remaining tooth structure to a set thickness, and the restoration itself is made from the chosen material in the dental laboratory. The goal is a shape that supports normal chewing and blends in with the neighbouring teeth. A crown comes into the picture when a tooth can no longer stand on its own structure, or when the damage is too extensive for a filling to carry. The technical detail for each material is covered on its own dedicated page."
    },
    {
      "q": "What types of crown are there?",
      "a": "Several different material families are used in practice: <a href=\"/en/hizmet/zirkonyum/\">zirconia-based crowns<\/a> and the single-piece <a href=\"/en/hizmet/monolitik-zirkonyum/\">monolithic zirconia<\/a> option, <a href=\"/en/hizmet/emax/\">E.max<\/a> and <a href=\"/en/hizmet/empress/\">Empress<\/a> restorations from the <a href=\"/en/hizmet/cam-seramik/\">glass ceramic<\/a> family, <a href=\"/en/hizmet/porselen-lamina/\">porcelain veneers<\/a> prepared as thin shells for the front teeth, <a href=\"/en/hizmet/kompozit-lamina/\">composite veneers<\/a> built up directly in the mouth, and metal-supported <a href=\"/en/hizmet/porselen-kron-kopru/\">porcelain crown and bridge<\/a> work. Each family has its own light transmission, fracture resistance and tooth-preparation requirements."
    },
    {
      "q": "Who is it suitable for?",
      "a": "The decision is made by weighing up how much natural tooth structure remains alongside what you're hoping to achieve. A full crown tends to be the choice for teeth that are fractured, worn down, or left fragile after root canal treatment; thinner restorations are more often used for staining that whitening hasn't lifted, or for front teeth with a mismatched size or shape. Where the loss of structure is limited, your dentist looks at more conservative options first, such as a filling or an inlay/onlay. Treatment doesn't go ahead until gum health has been brought under control and any decay has been dealt with. A crown can be placed on a single tooth or across several teeth that make up the smile line; how many teeth are restored comes down to symmetry and colour matching."

    {
      "q": "What's the difference between a crown and a veneer?",
      "a": "The two approaches differ in how much of the tooth they cover. A crown wraps all the way around the tooth and includes the biting surface, so a larger area needs to be prepared. A veneer generally covers only the visible front surface with a thin layer and needs much less preparation. Which one is right depends on how much sound tooth structure remains, how the teeth meet when you bite, and the look you're hoping for. The two aren't interchangeable alternatives — they answer different clinical needs."
    },
    {
      "q": "What are the stages of treatment?",
      "a": "Treatment starts with an examination, X-rays and, where needed, digital planning. Before preparation begins, your dentist gives a local anaesthetic to the area, so you shouldn't feel any pain during the procedure, though the numbness itself can last a few hours. The tooth is then prepared to a set thickness depending on the type of restoration chosen, and an impression is taken using either an intraoral scanner or the conventional method. While the restoration is being made in the lab, you're fitted with a temporary one, which protects the tooth and gives you a chance to try out the shape in the meantime. Once the technician has finished the final restoration, it's tried in and the contact points and bite are checked one by one. Once the fit is confirmed, your dentist cements it in place and cleans away any excess cement. In more extensive cosmetic planning, this whole process sits within a wider <a href=\"/en/hizmet/gulus-tasarimi/\">smile design<\/a> plan."
    },
    {
      "q": "How long does it take, and how many appointments does it need?",

    },
    {
      "q": "What determines the choice of material?",
      "a": "The choice sits at the crossing point of several factors. Where the tooth is in the mouth matters a great deal, because light transmission is the priority at the front, while resistance to chewing force takes priority at the back. The amount and shade of the remaining tooth structure, the appearance of the neighbouring teeth, whether you clench or grind at night, and any history of metal allergy all feed into the assessment. Whether a bridge is planned also narrows down the range of suitable materials. No single material comes out on top across the board — each family has its own strength and aesthetic profile. To compare the strength and appearance of each group side by side, take a look at our <a href=\"/en/hizmet/kaplama-materyalleri-karsilastirma/\">crown & veneer materials compared<\/a> page."

    {
      "q": "Can a crown be fitted without cutting the tooth down?",
      "a": "In some cases, the amount of preparation can be kept to a minimum. If the tooth is naturally small, or there's a gap between teeth, a thin shell restoration can sometimes be planned with almost no reduction at all. But if the tooth sits further forward than its neighbours, or a dark stain needs to be covered, a certain amount of space has to be created. A restoration cemented without enough space made for it can look bulky and irritate the gum. Your dentist decides how much preparation is needed at the planning stage, not while trying the restoration in. The detail of preparation thresholds is covered on our <a href=\"/en/hizmet/porselen-lamina/\">porcelain veneers<\/a> page."

      "q": "What are the main benefits of this treatment?",

    },

      "q": "What are the risks and possible downsides?",
      "a": "A crown is an irreversible treatment — the tooth structure removed during preparation doesn't grow back. Sensitivity to hot and cold is common in the first few days and settles down in most cases, but if the nerve tissue is affected, root canal treatment can come into the picture. If the margin doesn't fit well, plaque can build up at the edge of the restoration, the gum can become inflamed, and decay can eventually start underneath. Ceramic restorations carry some risk of chipping or fracturing, and this risk rises noticeably in people who clench or grind at night. A bite contact left slightly too high can cause discomfort in the jaw joint and chewing muscles. Rarely, the cement can fail and the restoration can come loose. Removing a worn-out crown also causes some further loss of tooth structure. Careful planning and regular check-ups can reduce these risks, but none of them can be ruled out completely — which is why the possible outcomes need to be talked through in detail before you decide."
    },

      "q": "When is it not carried out, or postponed?",

    },

      "q": "Is sensitivity expected after getting a crown?",

    },

      "q": "What should you be careful of, and how do you look after a crown?",

    },
    {
      "q": "What determines how long it lasts, and can a crown be replaced?",
      "a": "There's no single figure for how long a restoration lasts in the mouth. The quality of the margin fit, the strength of the tooth underneath, gum health, how chewing forces are distributed, and your daily hygiene habits all have a direct effect on this. In someone who clenches their teeth, the same material can wear out sooner. If the gum recedes over the years, the crown margin can become visible, and replacement comes into the picture. Your dentist cuts away and removes the worn restoration, assesses the tooth underneath, and prepares it again if needed. Because every replacement means some further loss of tooth structure, extending the life of your existing crown is always the priority."
    }
