  "lead": "The Hollywood smile is one of the aesthetic topics patients bring up most often, yet very different treatment plans can sit under that same name. This page sets out the scope of the term, what a realistic expectation looks like, and the irreversible side of the procedure, in a balanced way. Tap any heading below to open the topic you're interested in.",

    {
      "q": "What is a Hollywood smile?",
      "a": "The term doesn't refer to a single treatment — it describes an aesthetic approach that addresses the colour, shape and alignment of the teeth together. It takes its name from the neat, bright smiles associated with the film industry. Two treatments carried out under the same name can involve entirely different procedures. Rather than a single defined clinical protocol, it's really a shorthand for the aesthetic outcome patients describe wanting."

      "q": "How is it different from smile design?",
      "a": "One describes the goal, the other describes the route to that goal. Describing the goal is easy; building the route that gets you there takes measurement and verification. In <a href=\"/en/hizmet/gulus-tasarimi/\">smile design<\/a>, the dentist assesses lip line, gum levels, facial proportions and bite together, using photos, impressions and digital simulation. During the trial stage, the look is tried out before any permanent treatment begins. You'll find the planning steps set out in detail on our digital smile design page. Rather than saying, 'give me a Hollywood smile' at your appointment, describe which tooth's colour or shape actually bothers you — your dentist builds the plan around that description."
