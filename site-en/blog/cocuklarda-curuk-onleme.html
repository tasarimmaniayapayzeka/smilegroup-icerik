  "lead": "There's no need to treat decay as inevitable just because baby teeth will fall out anyway; a few steps taken at the right time can change the picture considerably. In this guide, we look at the timing of the first dental check-up, baby bottle tooth decay, how brushing responsibility shifts with age, the effect of how often — rather than how much — sugar is eaten, and where preventive treatments fit in, all from a family's point of view. Our aim isn't to make you feel guilty — it's to help you build small, sustainable habits at home.",

      "h2": "When should a baby have their first dental check-up?",
      "html": "<p>In many families, a dental appointment only comes to mind once the first complaint appears. The approach widely accepted in paediatric dentistry, though, points to a much earlier date: a short introductory check-up when the first baby tooth comes through, or by the first birthday at the latest. The aim of this visit isn't treatment; the dentist looks at the pattern of tooth eruption, assesses decay risk, and draws up a roadmap tailored to the family, covering everything from diet to cleaning.<\/p><p>There's a further benefit to an early introduction: the child gets to know the practice through a short ride in the chair and some play, not through pain. This first positive experience noticeably makes check-ups easier in the years that follow. As children grow, simple preventive procedures such as a <a href=\"/en/hizmet/dis-tasi-temizligi/\">scale and polish<\/a> are added into this routine where needed.<\/p><p>The interval between check-ups isn't the same for every child. Two visits a year is generally considered enough for children at low risk, while your dentist may recommend closer follow-up for those at higher risk of decay. Most visits consist of nothing more than care, information and small preventive touches.<\/p>"

      "h2": "Why does baby bottle tooth decay progress so quickly?",
      "html": "<p>Picture a baby who falls asleep at night with milk or formula. Saliva flow drops during sleep, so the sugar in the milk sits around the front teeth for hours, creating an environment that suits decay-causing bacteria very well. Also known as early childhood caries, this picture usually starts on the upper front teeth; because the enamel on baby teeth is thin, it can spread within a short time.<\/p><p>We want to stress this: these habits don't come from bad parenting — more often than not, they come from trying to comfort the baby. To reduce the risk, you might consider switching to water only in the night-time bottle after any milk, never dipping a dummy in sweeteners like honey or syrup, and introducing a cup at around one year old. Wiping the gums with a clean piece of gauze before the teeth even come through is also a good place to start. For symptoms, how it develops and the treatment options, take a look at our <a href=\"/en/hizmet/biberon-curugu/\">baby bottle tooth decay<\/a> page.<\/p>"
    },
    {
      "h2": "Up to what age should parents brush their child's teeth for them?",
      "html": "<p>This is one of the questions families ask us most often. Brushing skill is directly tied to the development of the small muscles in the hand, so the job is handed over to the child gradually, as they get older:<\/p><ul><li><strong>From the first tooth to around age 3:<\/strong> The parent takes on brushing entirely; toothpaste is used as a smear no bigger than a grain of rice.<\/li><li><strong>Ages 3 to 6:<\/strong> The child has a go first, then the parent finishes off any surfaces that were missed with a brief once-over; a pea-sized amount of toothpaste is enough.<\/li><li><strong>Primary school years:<\/strong> The child uses the brush themselves, and the parent keeps up a role of supervising and reminding. Being able to tie their own shoelaces properly is a practical sign that a child's manual dexterity is up to the job.<\/li><\/ul><p>Once teeth start touching each other, adding flossing to the routine, with the parent's help, builds an extra layer of protection against decay between the teeth. Whatever the age, the basic rule stays the same: brushing twice a day, and nothing but water to eat or drink after the night-time brush.<\/p>"
    },
    {
      "h2": "With sugar, is quantity or frequency the real issue?",
      "html": "<p>What matters for decay isn't so much how much sugar a child eats, but how many times the teeth come into contact with it. After every sugary contact, the acid level in the mouth rises for a while, and it takes time for the enamel to recover. Snacking spread out across the day removes that chance to recover.<\/p><p>Here's a concrete example: a child who eats a whole chocolate bar straight after lunch gives their teeth a single acid wave to deal with; a child who eats the same chocolate bar piece by piece throughout the day puts the enamel under repeated strain. That's why, rather than banning sweet foods outright, it's a far more workable strategy to save them for the end of a meal, encourage water in between, and cut down on sticky snacks.<\/p><p>Reading labels is part of this strategy too. Plenty of products that look innocent — fruit yoghurt, breakfast cereal, ready-made fruit juice, honey and syrup — contain a surprising amount of sugar. Fresh fruit, on the other hand, offers a friendlier sweet alternative for the teeth, thanks to both its fibre content and the chewing it requires.<\/p>"

    {
      "h2": "When do preventive treatments come into play?",
      "html": "<p>Home care forms the foundation; preventive treatments carried out in the clinic are added on top of that foundation. Which treatment is considered, and when, depends on the child's age and level of risk:<\/p><ul><li><strong>Fluoride varnish:<\/strong> Aims to strengthen the enamel against acid attacks; it's applied at intervals set by the dentist, particularly in children at higher risk of decay. You can find more detail on our <a href=\"/en/hizmet/fluorid-uygulamasi/\">fluoride application<\/a> page.<\/li><li><strong>Fissure sealants:<\/strong> When the molars come through, the deep grooves in their chewing surface can be too narrow for bristles to reach; a <a href=\"/en/hizmet/fissur-ortucu/\">fissure sealant<\/a> covers these grooves and makes it harder for plaque to build up.<\/li><li><strong>Space maintainers:<\/strong> If a baby tooth is lost before its time, neighbouring teeth can tip into the gap; a <a href=\"/en/hizmet/yer-tutucu/\">space maintainer<\/a> preserves the space for the permanent tooth that will come through there.<\/li><\/ul><p>If decay has developed despite all this, a small <a href=\"/en/hizmet/dolgu/\">filling<\/a> at an early stage is enough in most cases; in more advanced situations, pulp treatments designed specifically for baby teeth may come into play. These treatments are based on similar principles to <a href=\"/en/hizmet/kanal-tedavisi/\">root canal treatment<\/a> in adults.<\/p>"

      "h2": "Which habits at home lower the risk of decay?",
      "html": "<p>Children copy what they see far more than what they're told. Turning the evening brush into a whole-family ritual — lining up together at the bathroom mirror and checking each other's teeth — builds a habit that sticks far better than most methods of persuasion. Making water the normal, everyday drink is another preventive step that takes little effort but has a big effect.<\/p><p>For children who put up resistance, turning it into a game works well: letting them choose their own brush and toothpaste flavour, brushing along to a two-minute song, stickers on a calendar. Small rewards keep motivation up, as long as they aren't sugary ones.<\/p><p>One last note: thumb-sucking and dummy use that carry on past age three can lead to changes in tooth alignment and jaw development. In that situation, an early <a href=\"/en/hizmet/cocuk-ortodontisi/\">children's orthodontics<\/a> assessment helps address a potential problem before it grows.<\/p>"
