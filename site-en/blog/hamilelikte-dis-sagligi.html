  "sections": [
    {
      "h2": "Why does pregnancy affect oral health so much?",
      "html": "<p>Rising oestrogen and progesterone in pregnancy widen the network of blood vessels in the gums and exaggerate the tissue's response to bacterial plaque. A build-up of plaque that wouldn't even have been noticed before pregnancy can now show up as clear redness and tenderness.<\/p><p>Everyday habits add to the picture too: more frequent snacking, a stronger pull towards sweet foods, brushing that slips because of nausea, a shifting balance in saliva. Each of these looks minor on its own, but stacked on top of each other across nine months, they leave the mouth more exposed to decay and gum problems.<\/p><p>Ideally, you'll have a dental check-up while you're planning a pregnancy, and complete preventive steps such as a <a href=\"/en/hizmet/dis-tasi-temizligi/\">scale and polish<\/a> beforehand if needed. But there's no need to wait once pregnancy has started, either — routine check-ups and cleaning can continue right through all nine months.<\/p>"

      "h2": "What is pregnancy gingivitis, and why does gum bleeding increase?",
      "html": "<p>Pink foam while brushing, a mark left behind in an apple after one bite — a significant proportion of expectant mothers notice bleeding, swelling and redness in the gums from the second month onwards. This picture is called <strong>pregnancy gingivitis<\/strong>; plaque is the real trigger, and hormones simply amplify the gum's response to it.<\/p><p>Seeing blood and stopping brushing altogether is a common mistake; the picture only gets worse the longer plaque is left in place. Gentle but regular cleaning with a soft brush, flossing and dental follow-up noticeably reduce symptoms for most expectant mothers. If bleeding is severe, or you notice a lump-like growth on the gum, don't put off booking a <a href=\"/en/hizmet/dis-etim-kaniyor/\">bleeding gums<\/a> assessment; most growths of this kind seen in pregnancy are benign, but it takes a dentist to make that distinction.<\/p><p>Inflamed gums can also show up in your breath; <a href=\"/en/hizmet/agiz-kokusu/\">bad breath<\/a> that increases during pregnancy is often an extension of this same picture, and it eases as gum health recovers.<\/p>"

    {
      "h2": "Can morning sickness damage your teeth?",
      "html": "<p>Stomach acid reaching the mouth during vomiting creates a harsh environment for enamel. A single episode isn't a problem in itself; the real issue is nausea that repeats frequently throughout the first trimester. In that situation, acid can quietly erode the inner surfaces of the front teeth in particular.<\/p><p>The critical detail here is timing: brushing straight after being sick means brushing away enamel that acid has already softened. Rinsing with water first, then holding off on brushing for around half an hour, gives the enamel time to recover. Sipping water in small amounts through the day helps shorten how long acid stays in the mouth; splitting meals into smaller portions supports the same goal without putting extra strain on the stomach.<\/p><p>Sensitivity to cold, a see-through look developing along the biting edges, or surfaces that feel rough against your tongue can all be early signs. If your nausea is severe, tell your dentist about it; when <a href=\"/en/hizmet/dislerim-asindi/\">tooth wear<\/a> and <a href=\"/en/hizmet/disim-sizliyor/\">tooth sensitivity<\/a> are picked up early, it's possible to move forward with preventive measures.<\/p>"
    },
    {
      "h2": "Which treatments come up in which trimester?",
      "html": "<p>There's no single correct timetable; the decision is shaped by how many weeks pregnant you are, how urgent the procedure is, and the mother's general condition. Having this planning happen within a framework where the dentist and obstetrician stay in contact puts both the expectant mother and the clinical team at ease.<\/p><ul><li><strong>First trimester:<\/strong> During these weeks of intensive organ development, non-urgent procedures are generally postponed; examinations, cleaning and care planning, on the other hand, can go ahead without any concern.<\/li><li><strong>Second trimester:<\/strong> Generally the preferred window for treatment. <a href=\"/en/hizmet/dolgu/\">Fillings<\/a>, <a href=\"/en/hizmet/kanal-tedavisi/\">root canal treatment<\/a> where it's needed, and <a href=\"/en/hizmet/dis-cekimi/\">tooth extraction<\/a> where postponing it would be unwise, are mostly planned for this stage.<\/li><li><strong>Third trimester:<\/strong> A growing bump makes long sessions lying on your back more difficult; non-urgent procedures are mostly left until after delivery, and any treatment that is needed is arranged as short appointments.<\/li><\/ul><p>Local anaesthetic is another question that comes up often in treatment planning. A filling or extraction that needs to be carried out during pregnancy can go ahead under local anaesthetic planned and controlled by your dentist; your dentist chooses the option and amount appropriate to your stage of pregnancy, and seeks your obstetrician's opinion where they judge it necessary. For this planning to be set up correctly, make sure you tell your dentist that you're pregnant; putting up with pain and delaying treatment often turns out more gruelling in the end than a planned appointment would have been.<\/p><p>One exception applies across every stage: pain and infection don't work to a timetable. If you have severe <a href=\"/en/hizmet/disim-agriyor/\">tooth pain<\/a> or facial swelling, you need to see a dentist whatever week you're at; an infection left to progress unchecked can be far more gruelling than a small procedure carried out promptly.<\/p>"

      "h2": "Can dental treatment go ahead while breastfeeding?",
